<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>祈年殿 · 天坛 — 3D 微缩模型</title>
<style>
  /* ==========================================================
     苹果风视觉基调：纯黑 / 深空灰，零彩色装饰
     ========================================================== */
  :root{
    --glass: rgba(28,28,32,.62);
    --glass-brd: rgba(255,255,255,.10);
    --txt: #ededf0;
    --txt-dim: #93939b;
    --pill: rgba(255,255,255,.07);
    --pill-hover: rgba(255,255,255,.15);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#000; color:var(--txt);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro SC",
                "Helvetica Neue", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  canvas{ display:block; }

  /* ---------- 左上标题 ---------- */
  #title{
    position:fixed; left:28px; top:24px; z-index:10; pointer-events:none;
    opacity:0; transition:opacity 1.1s ease .3s;
  }
  #title.in{ opacity:1; }
  #title h1{
    margin:0; font-size:17px; font-weight:600; letter-spacing:.24em;
    color:#f5f5f7; text-shadow:0 1px 18px rgba(0,0,0,.75);
  }
  #title p{
    margin:7px 0 0; font-size:11px; font-weight:400; letter-spacing:.14em;
    color:rgba(255,255,255,.55); text-shadow:0 1px 14px rgba(0,0,0,.8);
  }

  /* ---------- 右下控制面板（毛玻璃） ---------- */
  #panel{
    position:fixed; right:22px; bottom:22px; z-index:20; width:300px;
    padding:15px 16px 13px;
    background:var(--glass);
    border:1px solid var(--glass-brd);
    border-radius:20px;
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    opacity:0; transform:translateY(12px);
    transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1);
    user-select:none; -webkit-user-select:none;
  }
  #panel.in{ opacity:1; transform:translateY(0); }

  .row + .row{ margin-top:14px; }
  .lbl{
    display:block; font-size:10.5px; font-weight:500; letter-spacing:.2em;
    color:var(--txt-dim); margin-bottom:8px;
  }
  .seg{ display:flex; flex-wrap:wrap; gap:5px; }
  .pill{
    appearance:none; -webkit-appearance:none;
    border:1px solid rgba(255,255,255,.08);
    background:var(--pill); color:#d4d4da;
    font:inherit; font-size:12px; font-weight:500; letter-spacing:.04em;
    padding:6px 10px; border-radius:10px; cursor:pointer; white-space:nowrap;
    transition:background .22s ease, color .22s ease, border-color .22s ease,
               transform .12s ease, box-shadow .22s ease;
  }
  .pill:hover{ background:var(--pill-hover); color:#fff; }
  .pill:active{ transform:scale(.94); }
  .pill.on{
    background:#f5f5f7; color:#101013; border-color:#f5f5f7;
    box-shadow:0 2px 14px rgba(255,255,255,.22);
  }
  .pill.disabled{ opacity:.30; cursor:not-allowed; }
  .pill.disabled:hover{ background:var(--pill); color:#d4d4da; }
  .sep{ height:1px; background:rgba(255,255,255,.08); margin:14px 0 13px; }
  #hint{
    margin-top:11px; font-size:10.5px; letter-spacing:.1em;
    color:#63636b; text-align:right;
  }

  /* ---------- 闪电全屏遮罩 ---------- */
  #flash{ position:fixed; inset:0; z-index:15; pointer-events:none; background:#fff; opacity:0; }

  /* ---------- 载入 / 报错 ---------- */
  #boot{
    position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:#000; color:var(--txt-dim);
    font-size:12px; letter-spacing:.26em; text-align:center; padding:0 24px;
    transition:opacity .7s ease;
  }
  #boot.hide{ opacity:0; pointer-events:none; }
  #boot .dot{
    width:26px; height:26px; border-radius:50%;
    border:2px solid rgba(255,255,255,.14); border-top-color:rgba(255,255,255,.72);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #boot .err{ color:#c9c9d0; line-height:2; letter-spacing:.05em; font-size:12.5px; }
</style>
</head>
<body>

<div id="title">
  <h1>祈 年 殿</h1>
  <p>天坛 · 三重檐圆殿</p>
</div>

<div id="panel">
  <div class="row">
    <span class="lbl">天气</span>
    <div class="seg" id="segWeather"></div>
  </div>
  <div class="row">
    <span class="lbl">时间</span>
    <div class="seg" id="segTime"></div>
  </div>
  <div class="sep"></div>
  <div class="seg">
    <button class="pill" id="btnSound">雷声 开</button>
    <button class="pill" id="btnReset">复位视角</button>
  </div>
  <div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
</div>

<div id="flash"></div>
<div id="boot"><div class="dot"></div><div>载 入 中</div></div>

<!-- ============================================================
     依赖：Three.js + OrbitControls（CDN · ES Module）
     如果 cdn.jsdelivr.net 偶发抽风，刷新一次即可。
     ============================================================ -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://fastly.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
 * 石狮：不是基本体拼的，是一个真的网格文件（.glb）——
 * 用 SDF + Marching Cubes 雕出来，12k 面，base64 内嵌在下面。
 * 这样既是"现成模型"，又还是单文件、断网也能开。
 * ================================================================ */
/* （原来内嵌的 sdf 石狮 .glb 已删除，改成下面的程序化蹲狮） */

/* ================================================================
 * 0. 基础常量与材质表
 *    全部 flatShading —— 刻意保留低多边形的硬棱面
 * ================================================================ */
const SEG = 20;            // 圆的段数（越小棱面越明显）
const HALL_Y = 3.95;       // 三层基座顶面 = 殿身地面标高

const M = {
  marble  : new THREE.MeshStandardMaterial({ color:0xdcdad1, roughness:.76, metalness:.02, flatShading:true }),
  marble2 : new THREE.MeshStandardMaterial({ color:0xb9b7ae, roughness:.80, metalness:.02, flatShading:true }),
  shadow  : new THREE.MeshStandardMaterial({ color:0x87847c, roughness:.88, metalness:.00, flatShading:true }),
  ground  : new THREE.MeshStandardMaterial({ color:0x27272b, roughness:.96, metalness:.00 }),
  plaza   : new THREE.MeshStandardMaterial({ color:0x55555d, roughness:.92, metalness:.00, flatShading:true }),
  red     : new THREE.MeshStandardMaterial({ color:0xa5302a, roughness:.62, metalness:.05, flatShading:true }),
  redDeep : new THREE.MeshStandardMaterial({ color:0x7e221d, roughness:.66, metalness:.05, flatShading:true }),
  column  : new THREE.MeshStandardMaterial({ color:0xb03a30, roughness:.52, metalness:.06, flatShading:true }),
  tile    : new THREE.MeshStandardMaterial({ color:0x1c3d7a, roughness:.30, metalness:.26, flatShading:true }),
  tile2   : new THREE.MeshStandardMaterial({ color:0x16305f, roughness:.36, metalness:.20, flatShading:true }),
  gold    : new THREE.MeshStandardMaterial({ color:0xd6a945, roughness:.28, metalness:.62, flatShading:true }),
  goldDim : new THREE.MeshStandardMaterial({ color:0xa8832f, roughness:.42, metalness:.48, flatShading:true }),
  wood    : new THREE.MeshStandardMaterial({ color:0xc79a41, roughness:.60, metalness:.14, flatShading:true }),
  dark    : new THREE.MeshStandardMaterial({ color:0x241f1b, roughness:.85, metalness:.02, flatShading:true }),
  lantern : new THREE.MeshStandardMaterial({ color:0xc23a2c, roughness:.55, metalness:.04, flatShading:true }),
  /* --- 配景用 --- */
  stone   : new THREE.MeshStandardMaterial({ color:0x9d9d97, roughness:.86, metalness:.02, flatShading:true }),
  stone2  : new THREE.MeshStandardMaterial({ color:0x82827d, roughness:.88, metalness:.02, flatShading:true }),
  bronze  : new THREE.MeshStandardMaterial({ color:0x5c6b58, roughness:.42, metalness:.68, flatShading:true }),
  bronze2 : new THREE.MeshStandardMaterial({ color:0x47533f, roughness:.48, metalness:.62, flatShading:true }),
  trunk   : new THREE.MeshStandardMaterial({ color:0x4a3b2c, roughness:.92, metalness:.00, flatShading:true }),
  leaf    : new THREE.MeshStandardMaterial({ color:0x2f4a34, roughness:.90, metalness:.00, flatShading:true }),
  dgGong  : new THREE.MeshStandardMaterial({ color:0x2f7f6a, roughness:.58, metalness:.10, flatShading:true }),
};

/* ================================================================
 * 1. 渲染器 / 场景 / 相机
 * ================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // 防止烈日把琉璃瓦照成死白
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd6ee, 0.0014);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, 3000);
const CAM_HOME = { pos: new THREE.Vector3(0, 6.5, 44), tgt: new THREE.Vector3(0, 11, 0) };
camera.position.copy(CAM_HOME.pos);

/* ================================================================
 * 2. OrbitControls —— 本项目的核心
 *    · 阻尼惯性：松手后顺滑收尾
 *    · 左键旋转 / 滚轮缩放 / 右键平移
 *    · 限制极角：永远看不到地底下
 *    · 镜头完全手动 —— 关掉 autoRotate，页面不会自己动
 * ================================================================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CAM_HOME.tgt);

controls.enableDamping      = true;    // 阻尼
controls.dampingFactor      = 0.055;   // 越小越"滑"
controls.enablePan          = true;    // 右键平移
controls.panSpeed           = 0.8;
controls.screenSpacePanning = false;
controls.enableZoom         = true;
controls.zoomSpeed          = 0.85;
controls.enableRotate       = true;
controls.rotateSpeed        = 0.85;

controls.minDistance        = 18;      // 可以贴到很近看细部
controls.maxDistance        = 90;     // 再远殿就"缩没"了
controls.minPolarAngle      = Math.PI * 0.105;   // 不许俯视到正上方
controls.maxPolarAngle      = Math.PI * 0.580;   // 不许压到地平线以下

controls.autoRotate         = false;   // 镜头完全手动：不自动转、不自动回正
controls.autoRotateSpeed    = 0;

/* ================================================================
 * 3. 天空穹顶（渐变 ShaderMaterial）
 * ================================================================ */
const skyUniforms = {
  topColor: { value: new THREE.Color(0x2f7fd6) },
  botColor: { value: new THREE.Color(0xbcdcf5) },
  offset:   { value: 120 },
  expo:     { value: 0.62 },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(900, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vW;
      void main(){
        vW = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 topColor, botColor;
      uniform float offset, expo;
      varying vec3 vW;
      void main(){
        float h = normalize(vW + vec3(0.0, offset, 0.0)).y;
        gl_FragColor = vec4(mix(botColor, topColor, pow(max(h,0.0), expo)), 1.0);
      }`
  })
);
scene.add(sky);

/* ================================================================
 * 4. 星空（Points）与月亮
 * ================================================================ */
const starMat = (() => {
  // 程序化画一张柔光圆点，避免任何外部贴图
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32,32,0, 32,32,32);
  grd.addColorStop(0,    'rgba(255,255,255,1)');
  grd.addColorStop(0.28, 'rgba(255,255,255,.75)');
  grd.addColorStop(1,    'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,64,64);
  return new THREE.PointsMaterial({
    map: new THREE.CanvasTexture(c), size: 3.0, sizeAttenuation: false,
    transparent: true, opacity: 0, depthWrite: false, fog: false,
    blending: THREE.AdditiveBlending, toneMapped: false,
  });
})();
const stars = (() => {
  const N = 1500, pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const c = new THREE.Color();
  for (let i = 0; i < N; i++){
    const u = Math.random() * Math.PI * 2, v = Math.acos(Math.random() * 0.98);
    const r = 700;
    pos[i*3]   = r * Math.sin(v) * Math.cos(u);
    pos[i*3+1] = r * Math.cos(v);
    pos[i*3+2] = r * Math.sin(v) * Math.sin(u);
    c.setHSL(0.55 + Math.random()*0.10, 0.32, 0.74 + Math.random()*0.26);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col,3));
  const p = new THREE.Points(geo, starMat);
  p.frustumCulled = false;
  scene.add(p);
  return p;
})();

const moonGroup = new THREE.Group();      // 月亮圆盘 + 外圈光晕
{
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(16, 40),
    new THREE.MeshBasicMaterial({ color:0xdfe7ff, fog:false, toneMapped:false })
  );
  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(46, 40),
    new THREE.MeshBasicMaterial({ color:0x9db6ff, fog:false, toneMapped:false,
      transparent:true, opacity:.22, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  halo.position.z = -1;
  moonGroup.add(halo, disc);
  moonGroup.visible = false;
  scene.add(moonGroup);
}

/* 夜景要发光的材质都登记到这里，由 applyEnv 按时间统一驱动 */
const NIGHT_GLOW = [];
const lanternLights = [];

/* ================================================================
 * 5. 灯光
 * ================================================================ */
const sun = new THREE.DirectionalLight(0xfff2e0, 2.4);   // 太阳 / 月亮共用一盏平行光
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 20;
sun.shadow.camera.far  = 620;
sun.shadow.camera.left = -62; sun.shadow.camera.right  =  62;
sun.shadow.camera.top  =  72; sun.shadow.camera.bottom = -34;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.4;
scene.add(sun, sun.target);

const hemi    = new THREE.HemisphereLight(0xbcd6ee, 0x4a4a52, 0.62);  // 天光
const ambient = new THREE.AmbientLight(0x9fb8d8, 0.34);               // 环境光
const fill    = new THREE.DirectionalLight(0xffffff, 0.28);           // 背面补光
fill.position.set(-40, 26, -46);
scene.add(hemi, ambient, fill);

NIGHT_GLOW.push({ m: M.lantern, c: 0xff2a12, base: 0, k: 1.95 });   // 红灯笼

/* 夜景灯：夜里从殿内透到台面上的暖光（白天强度为 0） */
const hallLights = [];
for (let i = 0; i < 6; i++){
  const a = (i / 6) * Math.PI * 2;
  const L = new THREE.PointLight(0xffb570, 0, 16, 2);
  L.position.set(Math.cos(a) * 8.6, HALL_Y + 1.9, Math.sin(a) * 8.6);
  scene.add(L);
  hallLights.push(L);
}

/* ================================================================
 * 6. 云层 —— 低多边形"棉花团"
 *    用 MeshBasicMaterial，颜色/透明度完全由环境状态接管，
 *    这样"乌云密布"就是直接变灰变厚，不依赖光照。
 * ================================================================ */
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
const cloudMats = [];
{
  const N = 16;
  const geo = new THREE.IcosahedronGeometry(1, 1);   // 细分一档，别像六边形板
  for (let i = 0; i < N; i++){
    const mat = new THREE.MeshBasicMaterial({
      color:0xffffff, transparent:true, opacity:0, depthWrite:false, fog:true
    });
    cloudMats.push(mat);
    const g = new THREE.Group();
    const puffs = 3 + ((i * 5) % 3);
    for (let k = 0; k < puffs; k++){
      const m = new THREE.Mesh(geo, mat);
      const s = 11 + Math.random() * 12;
      m.position.set((Math.random()-.5)*26, (Math.random()-.5)*5, (Math.random()-.5)*16);
      m.scale.set(s, s * (0.52 + Math.random()*0.16), s * (0.80 + Math.random()*0.25));
      g.add(m);
    }
    const a = (i / N) * Math.PI * 2 + Math.random() * 0.5;
    const r = 74 + Math.random() * 66;
    g.position.set(Math.cos(a) * r, 76 + Math.random() * 44, Math.sin(a) * r);
    g.rotation.y = Math.random() * Math.PI;
    cloudGroup.add(g);
  }
}

/* ---------- 7.0 程序化贴图工厂（全部 canvas 画，不引任何外部素材） ---------- */
const TEX = (function(){
  function make(w, h, draw){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }
  function rep(t, x, y){ const c = t.clone(); c.needsUpdate = true;
    c.wrapS = c.wrapT = THREE.RepeatWrapping; c.repeat.set(x, y); return c; }

  // ① 琉璃瓦垄：横向明暗条纹。贴到旋转体上，u 方向绕一圈 → 就是放射状的筒瓦
  // 参考图里这顶其实是"近黑泛金"的深色（蓝琉璃瓦在夕阳下压得很暗），
  // 所以做成 深瓦沟 → 金瓦垄背 的渐变
  const ridge = make(64, 8, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, w, 0);
    grd.addColorStop(0.00, '#08090d');
    grd.addColorStop(0.16, '#101319');
    grd.addColorStop(0.36, '#2b2616');
    grd.addColorStop(0.50, '#a8842c');   // 垄背那道金光
    grd.addColorStop(0.64, '#2b2616');
    grd.addColorStop(0.84, '#101319');
    grd.addColorStop(1.00, '#08090d');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
  });

  // ② 檐口瓦当：一圈圆瓦头 + 下方滴水
  const tileEnd = make(64, 64, (g, w, h) => {
    g.fillStyle = '#0d1017'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#a8842c'; g.fillRect(0, 0, w, 7);
    g.beginPath(); g.arc(w/2, 27, 17, 0, Math.PI*2);
    g.fillStyle = '#151a24'; g.fill();
    g.lineWidth = 3; g.strokeStyle = '#d8b04c'; g.stroke();
    g.beginPath(); g.arc(w/2, 27, 7, 0, Math.PI*2);
    g.fillStyle = '#d8b04c'; g.fill();
    g.fillStyle = '#070910'; g.fillRect(0, 47, w, h - 47);
    g.fillStyle = '#c99f3f'; g.fillRect(0, 47, w, 3);
  });

  // ③ 斗拱 / 额枋 彩画：蓝底 + 绿旋子 + 金线
  const caisson = make(120, 64, (g, w, h) => {
    g.fillStyle = '#0e2f4e'; g.fillRect(0, 0, w, h);
    // 上下金线 + 绿边
    g.fillStyle = '#d8b04c'; g.fillRect(0, 0, w, 4); g.fillRect(0, h - 4, w, 4);
    g.fillStyle = '#2f7f6a'; g.fillRect(0, 4, w, 3); g.fillRect(0, h - 7, w, 3);
    // 分间金线
    g.fillStyle = 'rgba(216,176,76,.85)';
    g.fillRect(0, 8, 2, h - 16); g.fillRect(w - 2, 8, 2, h - 16);
    // 中央旋花
    g.beginPath(); g.arc(w/2, h/2, 15, 0, Math.PI*2);
    g.fillStyle = '#2f7f6a'; g.fill();
    g.lineWidth = 3; g.strokeStyle = '#d8b04c'; g.stroke();
    g.beginPath(); g.arc(w/2, h/2, 8, 0, Math.PI*2);
    g.fillStyle = '#1b4a86'; g.fill();
    g.lineWidth = 2.5; g.strokeStyle = '#e8cd82'; g.stroke();
    g.beginPath(); g.arc(w/2, h/2, 3, 0, Math.PI*2);
    g.fillStyle = '#d8b04c'; g.fill();
    // 两侧小旋花
    [w*0.24, w*0.76].forEach(x => {
      g.beginPath(); g.arc(x, h/2, 6.5, 0, Math.PI*2);
      g.fillStyle = '#1b4a86'; g.fill();
      g.lineWidth = 2.5; g.strokeStyle = '#d8b04c'; g.stroke();
      g.beginPath(); g.arc(x, h/2, 2.4, 0, Math.PI*2);
      g.fillStyle = '#e8cd82'; g.fill();
    });
  });

  // ④ 格扇门窗：菱花（斜方格）＋ 金边
  const lattice = make(128, 128, (g, w, h) => {
    g.fillStyle = '#c9963f'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#3a1108'; g.lineWidth = 12;      // 加粗的深红格线
    for (let i = -h; i < w + h; i += 30){
      g.beginPath(); g.moveTo(i, 0);     g.lineTo(i + h, h); g.stroke();
      g.beginPath(); g.moveTo(i + h, 0); g.lineTo(i, h);     g.stroke();
    }
    g.fillStyle = '#e8cc84';
    for (let y = 15; y < h; y += 30)
      for (let x = 15; x < w; x += 30){
        g.beginPath(); g.arc(x, y, 5, 0, Math.PI*2); g.fill();
        g.lineWidth = 2.5; g.strokeStyle = '#3a1108'; g.stroke();
      }
    g.strokeStyle = '#e8cc84'; g.lineWidth = 10;
    g.strokeRect(5, 5, w - 10, h - 10);
    g.strokeStyle = '#3a1108'; g.lineWidth = 3;
    g.strokeRect(13, 13, w - 26, h - 26);
  });

  /* ⑤ 栏板浮雕：外框 + 海棠开光 + 开光里的云头。
     原来画的是两个同心椭圆 —— 一圈圈套下来就是"靶心"，绕台基一圈全是同心圆，
     一眼就露怯。海棠开光才是汉白玉栏板的标准做法。 */
  const rail = make(160, 96, (g, w, h) => {
    g.fillStyle = '#d6d3ca'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(112,108,100,.62)'; g.lineWidth = 4;
    g.strokeRect(5, 5, w - 10, h - 10);

    const cx = w / 2, cy = h / 2, rx = w * 0.30, ry = h * 0.30;
    g.strokeStyle = 'rgba(96,92,85,.82)';
    g.lineWidth = 4;
    g.beginPath();
    g.moveTo(cx, cy - ry);
    g.bezierCurveTo(cx + rx*0.62, cy - ry, cx + rx, cy - ry*0.62, cx + rx, cy);
    g.bezierCurveTo(cx + rx, cy + ry*0.62, cx + rx*0.62, cy + ry, cx, cy + ry);
    g.bezierCurveTo(cx - rx*0.62, cy + ry, cx - rx, cy + ry*0.62, cx - rx, cy);
    g.bezierCurveTo(cx - rx, cy - ry*0.62, cx - rx*0.62, cy - ry, cx, cy - ry);
    g.closePath(); g.stroke();

    // 开光内：小团花（中心一圈 + 八瓣），比卷云更经得起横向拉伸
    g.lineWidth = 3;
    const r1 = Math.min(w, h) * 0.105;
    g.beginPath(); g.arc(cx, cy, r1, 0, Math.PI * 2); g.stroke();
    for (let k = 0; k < 8; k++){
      const a = k * Math.PI / 4;
      g.beginPath();
      g.ellipse(cx + Math.cos(a) * r1 * 1.85, cy + Math.sin(a) * r1 * 1.85,
                r1 * 0.60, r1 * 0.33, a, 0, Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = 'rgba(96,92,85,.5)';
    g.beginPath(); g.arc(cx, cy, r1 * 0.34, 0, Math.PI * 2); g.fill();
  });

  return { make, rep, ridge, tileEnd, caisson, lattice, rail };
})();

/* ---------- 7.2 汉白玉三层圆台 ----------
 *   每层 = 台身 + 底部一道暗色收进线 + 一圈望柱栏板
 *   那道暗线是关键：不加的话三层会糊成一整块白。
 * ------------------------------------------ */
function buildTerrace(rBot, rTop, y0, y1, postCount){
  const h = y1 - y0;
  const g = new THREE.Group();

  const body = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 56), M.marble);
  body.position.y = y0 + h / 2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  // 台身底部的一条暗色线脚 —— 分层全靠它
  const band = new THREE.Mesh(new THREE.CylinderGeometry(rBot + 0.035, rBot + 0.06, 0.30, 56), M.shadow);
  band.position.y = y0 + 0.15;
  g.add(band);

  // 须弥座束腰：中段往里收一圈，台身才有"须弥座"的样子
  const waistH = h * 0.32;
  const waist = new THREE.Mesh(
    new THREE.CylinderGeometry(rBot - 0.26, rBot - 0.30, waistH, 56), M.marble2);
  waist.position.y = y0 + 0.33 + waistH / 2;
  g.add(waist);

  // 排水螭首：须弥座外沿一圈小龙首吐水口
  {
    const headGeo  = new THREE.BoxGeometry(0.30, 0.26, 0.30);
    const snoutGeo = new THREE.ConeGeometry(0.10, 0.32, 6);
    around(8, (a) => {
      const rr = rBot + 0.09;
      const hd = new THREE.Mesh(headGeo, M.stone2);
      hd.position.set(Math.cos(a) * rr, y0 + 0.34, Math.sin(a) * rr);
      hd.rotation.y = -a;
      hd.castShadow = true;
      g.add(hd);
      const sn = new THREE.Mesh(snoutGeo, M.stone2);
      sn.position.set(Math.cos(a) * (rr + 0.22), y0 + 0.31, Math.sin(a) * (rr + 0.22));
      sn.rotation.set(0, -a, -Math.PI / 2);      // 锥尖朝径向外
      g.add(sn);
    });
  }

  // 台沿压边
  const lip = new THREE.Mesh(new THREE.TorusGeometry(rTop, 0.11, 5, 56), M.marble2);
  lip.rotation.x = -Math.PI / 2;
  lip.position.y = y1 - 0.035;
  g.add(lip);

  // 栏板（上下两道横杆）+ 望柱
  const railR = rTop - 0.36;
  const bay = (Math.PI * 2) / postCount;

  /* 台阶口：正前方（a = π/2）让开**整整一个开间**。
     ⚠️⚠️ 原来只让开了栏板，上下两道横杆却是 360° 整圈的 TorusGeometry ——
        两道横杆直接横在台阶顶上，入口等于被围死。横杆必须跟着一起断。
     让开 ±1 个开间（36°），弦长 2·railR·sin18° ≈ 8.9 > 台阶宽 6.0，够走。 */
  const nearFront = (a, tol) =>
    Math.abs(Math.atan2(Math.sin(a - Math.PI / 2), Math.cos(a - Math.PI / 2))) < tol;

  // 上下两道横杆：整圈改成一段圆弧，缺口转到正前方
  const railSeg = Math.PI * 2 - bay * 2;              // 324°
  [0.36, 0.80].forEach(hy => {
    const holder = new THREE.Group();
    holder.rotation.y = -(Math.PI / 2 - bay);         // 把缺口搬到 a = π/2
    const rail = new THREE.Mesh(
      new THREE.TorusGeometry(railR, 0.075, 4, 72, railSeg), M.marble2);
    rail.rotation.x = -Math.PI / 2;
    rail.position.y = y1 + hy;
    rail.castShadow = true;
    holder.add(rail);
    g.add(holder);
  });

  const postGeo   = new THREE.BoxGeometry(0.24, 1.00, 0.24);
  const collarGeo = new THREE.CylinderGeometry(0.145, 0.115, 0.10, 10);
  /* 望柱头改成"莲苞"：下面收一圈 → 中间一颗苞 → 顶上一个小尖。
     原来是个光圆球，远看像蘑菇，中式栏板不长这样。 */
  const budBaseGeo = new THREE.CylinderGeometry(0.118, 0.158, 0.11, 10);
  const budGeo     = new THREE.SphereGeometry(0.145, 10, 8);
  const budTipGeo  = new THREE.ConeGeometry(0.082, 0.17, 8);
  around(postCount, (a) => {
    if (nearFront(a, bay * 0.45)) return;             // 正前方那根望柱让开
    const p = new THREE.Mesh(postGeo, M.marble);
    p.position.set(Math.cos(a) * railR, y1 + 0.50, Math.sin(a) * railR);
    p.rotation.y = -a;
    p.castShadow = true;
    g.add(p);
    const cl = new THREE.Mesh(collarGeo, M.marble2);
    cl.position.set(p.position.x, y1 + 0.96, p.position.z);
    g.add(cl);
    const b1 = new THREE.Mesh(budBaseGeo, M.marble2);
    b1.position.set(p.position.x, y1 + 1.04, p.position.z);
    g.add(b1);
    const b2 = new THREE.Mesh(budGeo, M.marble2);
    b2.position.set(p.position.x, y1 + 1.15, p.position.z);
    b2.castShadow = true;
    g.add(b2);
    const tp = new THREE.Mesh(budTipGeo, M.marble2);
    tp.position.set(p.position.x, y1 + 1.28, p.position.z);
    g.add(tp);
  });

  /* 栏板：填在**相邻两柱中间**（原来是以望柱为中心，两端的缝把板子吃成了
     一条几乎看不见的窄条 —— 一开间 18°，两头各留 0.14 rad，只剩 0.034 rad）。 */
  const panelSpan = bay - 0.075;
  const panelGeo = new THREE.CylinderGeometry(
    railR + 0.01, railR + 0.01, 0.50, 6, 1, true, -panelSpan / 2, panelSpan);
  const panelMat = new THREE.MeshStandardMaterial({
    /* ⚠️ 重复次数必须是 5.5 左右：一跨的弧长约 4.53、栏板高只有 0.50（长宽比 9.1），
       贴图本身是 160x96（1.67）。填 1 次就是把图案横向拉 5 倍多 ——
       海棠开光会变成一条扁椭圆，里面的纹样直接认不出来。 */
    map: TEX.rep(TEX.rail, 5.5, 1), roughness:.82, metalness:.02, side: THREE.DoubleSide });
  for (let i = 0; i < postCount; i++){
    const mid = (i + 0.5) * bay;                      // 相邻两柱的正中
    if (nearFront(mid, bay * 0.6)) continue;          // 台阶口那两跨不放栏板
    const m = new THREE.Mesh(panelGeo, panelMat);
    m.position.y = y1 + 0.58;
    m.rotation.y = Math.PI / 2 - mid;
    m.castShadow = true;
    g.add(m);
  }

  temple.add(g);
}

/* 单侧斜栏杆：地栿 + 栏板 + 望柱 + 寻杖，顺着坡度下来 */
function buildSlopeRail(x, edgeR, yTop, yBot, run, ang, cy, cz, postN){
  const dh = yTop - yBot;
  const ny = Math.cos(ang), nz = Math.sin(ang);
  const L  = Math.hypot(run, dh);

  // 地栿（底面贴坡，所以中心要沿法线抬起半高）
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, L), M.marble2);
  base.position.set(x, cy + 0.11 * ny, cz + 0.11 * nz);
  base.rotation.x = ang; base.castShadow = true; base.receiveShadow = true;
  temple.add(base);

  // 栏板：整段连续一块
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.50, L * 0.99), M.marble);
  panel.position.set(x, cy + 0.47 * ny, cz + 0.47 * nz);
  panel.rotation.x = ang;
  panel.castShadow = true; panel.receiveShadow = true;
  temple.add(panel);

  /* 寻杖（扶手）：一根通长的圆杆，从台面一路顺到广场。
     ⚠️⚠️ 这一段原来就写坏了：望柱每 0.67 插一根（N=9 → 10 根），柱身 0.86 高
         却整根藏在栏板和寻杖里，只露出上面一颗半径 0.145 的圆球 ——
         远看就是"一串珠子"，根本看不出是扶手。现在柱子稀疏、柱身露在寻杖之上，
         中间一根圆杆通到底，才是"一条直接下来"。 */
  const hand = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, L, 10), M.marble2);
  hand.position.set(x, cy + 0.80 * ny, cz + 0.80 * nz);
  hand.rotation.x = ang + Math.PI / 2;          // 圆柱默认轴是 Y，转到沿坡方向
  hand.castShadow = true;
  temple.add(hand);

  // 望柱：只留几根，柱身要在寻杖上面露出一截；柱头用莲苞，和台面栏板统一
  const N = (postN === undefined) ? 3 : postN;
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const pz = edgeR + run * t;
    const py = yTop - dh * t;
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.26, 1.04, 0.26), M.marble);
    post.position.set(x, py + 0.52, pz);
    post.castShadow = true;
    temple.add(post);

    const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.168, 0.11, 10), M.marble2);
    b1.position.set(x, py + 1.09, pz);
    temple.add(b1);
    const b2 = new THREE.Mesh(new THREE.SphereGeometry(0.155, 10, 8), M.marble2);
    b2.position.set(x, py + 1.20, pz);
    b2.castShadow = true;
    temple.add(b2);
    const tp = new THREE.Mesh(new THREE.ConeGeometry(0.088, 0.18, 8), M.marble2);
    tp.position.set(x, py + 1.34, pz);
    temple.add(tp);
  }
}

/* 一层台阶：5 级踏步（踏面 0.36 / 踢面约 0.28）+ 两侧垂带石 + 御路两侧栏杆 */
const STEP_N = 5, STEP_D = 0.36;
function buildStair(edgeR, yTop, yBot, width){
  const steps = STEP_N, dd = STEP_D;
  const dh  = (yTop - yBot) / steps;
  const run = steps * dd;
  const cy  = (yTop + yBot) / 2;
  const cz  = edgeR + run / 2;
  const ang = Math.atan2(yTop - yBot, run);

  for (let i = 0; i < steps; i++){
    const tread = yTop - (i + 1) * dh;
    const b = new THREE.Mesh(
      new THREE.BoxGeometry(width, Math.max(tread - yBot, 0.08), dd), M.marble);
    b.position.set(0, yBot + (tread - yBot) / 2, edgeR + i * dd + dd / 2);
    b.castShadow = true; b.receiveShadow = true;
    temple.add(b);

    // 踏面前缘压一道亮线 —— 不加这个，几级台阶在画面里会糊成一片
    const nose = new THREE.Mesh(new THREE.BoxGeometry(width + 0.02, 0.05, 0.08), M.marble2);
    nose.position.set(0, tread + 0.022, edgeR + i * dd + 0.04);
    temple.add(nose);
  }

  // 两侧垂带石：把踏步两端封住（原来端头是敞的，看着像几块悬空的板）
  [-1, 1].forEach(sd => {
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.42, run + 0.26), M.marble2);
    band.position.set(sd * (width / 2 + 0.23), cy + 0.21 * Math.cos(ang), cz + 0.21 * Math.sin(ang));
    band.rotation.x = ang;
    band.castShadow = true; band.receiveShadow = true;
    temple.add(band);
  });

  /* 抱鼓石：垂带最下端压一对圆鼓。中式台阶没有这个收头，端头就是一根白板。 */
  [-1, 1].forEach(sd => {
    const bx = sd * (width / 2 + 0.23), bz = edgeR + run + 0.20;
    // 底面要往台面里埋 0.02、顶面要高出广场顶面 —— 两端各让开，避免共面闪烁
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.22, 0.78), M.marble2);
    base.position.set(bx, yBot + 0.09, bz);
    base.castShadow = true; base.receiveShadow = true;
    temple.add(base);
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.26, 12), M.marble);
    drum.rotation.z = Math.PI / 2;
    drum.position.set(bx, yBot + 0.40, bz);
    drum.castShadow = true;
    temple.add(drum);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.10, 8, 6), M.marble2);
    knob.position.set(bx, yBot + 0.67, bz);
    temple.add(knob);
  });

  /* 外侧扶手：和御路两侧那道同款（通长圆杆 + 莲苞望柱），只是坐在垂带石上。
     垂带顶面在坡面法线方向 0.42 处，所以 cy/cz 先沿法线抬 0.42 再交给 buildSlopeRail。
     每层台阶宽度不同（6.0 / 5.4 / 4.8），所以只能一层一段，不能像内侧那样一条贯到底。 */
  const oNy = Math.cos(ang), oNz = Math.sin(ang);
  [-1, 1].forEach(sd =>
    buildSlopeRail(sd * (width / 2 + 0.23),
                   edgeR, yTop, yBot, run, ang,
                   cy + 0.40 * oNy, cz + 0.40 * oNz, 2));   // 0.40 而不是 0.42：埋进垂带 0.02，别和垂带顶面共面
}
buildStair(15.4, 1.40,    0.00,    6.0);

/* 御路两侧的栏杆：三层楼梯合用一条，从殿前台面一路贯到广场。
   （原来是每层各做一段，接缝处一节一节的 —— 那不对） */

{

  /* 御路：台阶中央那条带雕饰的斜坡。
     注意 rotation.x 必须是 +θ —— 写成 -θ 会把坡子反向翘起来。

     ⚠️ 贴图重做过。原来是一张 256×1024 的竖图，左右两列各画 24 个开口圆弧，
        再铺到只有 2.19 高的板上 —— 竖着拉伸之后就是一排"弹簧"，不是浮雕。
     现在按每块板的实际长宽比现画：外圈回纹边框 + 中间一朵团花，尺寸对得上，
     看起来才是刻在石头上的。 */
  function makeRampTex(wpx, hpx){
    const c = document.createElement('canvas');
    c.width = wpx; c.height = hpx;
    const g = c.getContext('2d');
    g.fillStyle = '#cfccc3'; g.fillRect(0, 0, wpx, hpx);

    const bw = Math.round(wpx * 0.15);            // 边框宽
    g.fillStyle = '#dbd8cf';
    g.fillRect(0, 0, bw, hpx); g.fillRect(wpx - bw, 0, bw, hpx);

    // 回纹（雷纹）：边框里一格一格的折线
    g.strokeStyle = 'rgba(66,62,56,.85)';
    g.lineWidth = Math.max(2, Math.round(wpx * 0.016));
    const cell = Math.max(14, Math.round(hpx / 14));
    for (let y = 4; y < hpx - cell; y += cell){
      [4, wpx - bw + 4].forEach(x0 => {
        const w = bw - 8;
        g.beginPath();
        g.moveTo(x0, y + cell - 3);
        g.lineTo(x0, y + 3);
        g.lineTo(x0 + w, y + 3);
        g.lineTo(x0 + w, y + cell - 3);
        g.lineTo(x0 + w * 0.55, y + cell - 3);
        g.stroke();
      });
    }

    /* 中央纹样：如意云头 + 上下缠枝。
       原来画的是八角放射 —— 出来是"太阳/齿轮"，不是御路石上的纹样。 */
    g.save();
    g.translate(wpx / 2, hpx / 2);
    g.strokeStyle = 'rgba(62,58,52,.92)';
    g.lineWidth = Math.max(2, Math.round(wpx * 0.019));
    const R0 = Math.min(wpx, hpx) * 0.26;
    const r  = R0 * 0.30;

    // 三卷并列 = 如意云头（左卷、右卷、上卷）
    g.beginPath(); g.arc(-r * 1.35, 0, r, Math.PI * 0.15, Math.PI * 1.75); g.stroke();
    g.beginPath(); g.arc( r * 1.35, 0, r, Math.PI * 1.25, Math.PI * 2.85); g.stroke();
    g.beginPath(); g.arc( 0, -r * 1.20, r, Math.PI * 0.66, Math.PI * 2.24); g.stroke();
    // 云头下面的托
    g.beginPath();
    g.moveTo(-r * 2.05, r * 0.85);
    g.quadraticCurveTo(0, r * 1.40, r * 2.05, r * 0.85);
    g.stroke();

    // 上下各拖一束缠枝，收一个小圆珠
    [-1, 1].forEach(sd => {
      g.beginPath();
      g.moveTo(0, sd * r * 1.05);
      g.bezierCurveTo(r * 1.7, sd * r * 2.0, r * 1.7, sd * r * 3.0, 0, sd * r * 3.35);
      g.stroke();
      g.beginPath(); g.arc(0, sd * r * 3.35, r * 0.44, 0, Math.PI * 2); g.stroke();
      g.fillStyle = 'rgba(88,84,77,.75)';
      g.beginPath(); g.arc(0, sd * r * 3.35, r * 0.16, 0, Math.PI * 2); g.fill();
    });
    g.restore();

    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }
  const rampTex = makeRampTex(192, 240);
  const carveMat = new THREE.MeshStandardMaterial({
    map: rampTex, roughness: .80, metalness: .02, side: THREE.DoubleSide });

  // 每层台阶：进深 run、升高 dh —— 御路照抄同样的坡度
  [[15.4, 1.40, 0.00], [13.6, 2.70, 1.40], [11.8, HALL_Y, 2.70]]
  .forEach(function(tier){
    const edgeR = tier[0], yTop = tier[1], yBot = tier[2];
    const run = 5 * 0.36;
    const dh  = yTop - yBot;
    const L   = Math.hypot(run, dh);
    const th  = Math.atan2(dh, run);          // 必须是 +θ
    const cz  = edgeR + run / 2;
    const cy  = (yTop + yBot) / 2;

    // 坡面法线方向 = (0, cosθ, sinθ)；把它当成"沿法线抬起"，雕纹才贴得住
    const ny = Math.cos(th), nz = Math.sin(th), half = 0.05;

    const ramp = new THREE.Mesh(new THREE.BoxGeometry(2.02, half * 2, L), M.marble2);
    ramp.position.set(0, cy + half * ny, cz + half * nz);   // 底面正好落在台阶棱线上
    ramp.rotation.x = th;
    ramp.castShadow = true; ramp.receiveShadow = true;
    temple.add(ramp);

    // 两侧压边石：给御路一条清楚的边，别让它像一块浮板
    [-1, 1].forEach(sd => {
      const e = new THREE.Mesh(new THREE.BoxGeometry(0.10, half * 2.2, L), M.marble);
      e.position.set(sd * 0.97, cy + half * 1.1 * ny, cz + half * 1.1 * nz);
      e.rotation.x = th;
      e.castShadow = true;
      temple.add(e);
    });

    const cv = new THREE.Mesh(new THREE.PlaneGeometry(1.72, L * 0.94), carveMat);
    cv.position.set(0, cy + (half * 2 + 0.015) * ny, cz + (half * 2 + 0.015) * nz);
    cv.rotation.x = th - Math.PI / 2;
    cv.receiveShadow = true;
    temple.add(cv);
  });
}

  // 12 根外檐柱

  // 柱子要错开半个开间：12 柱 / 12 开间若用同一角度，柱子正好杵在每扇门正中
  around(12, (a0) => {

/* ---------- 7.5 斗拱带（每重檐下一条蓝底金线 + 一圈小斗） ---------- */
function buildDougong(r, y0, y1){
  const h = y1 - y0;
  // 斗拱带换成旋子彩画：环绕一圈蓝底绿旋子 + 金线
  const b = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r, h, 72, 1, false),
    new THREE.MeshStandardMaterial({
      map: TEX.rep(TEX.caisson, Math.max(14, Math.round(r * 5.0)), 1),
      roughness:.52, metalness:.14 }));
  b.position.y = y0 + h / 2;
  b.castShadow = true;
  temple.add(b);

  [y0 + 0.05, y1 - 0.05].forEach(y => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r + 0.02, 0.06, 4, 48), M.gold);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = y;
    temple.add(ring);
  });

  /* 斗拱：原来只是 24 个 0.30 的小方块 —— 远看是"一圈点"，没有斗拱的轮廓。
     现在每个位置三件：坐斗（托）+ 横拱（沿切线的一道）+ 翘（沿径向外挑）。
     ⚠️ rotation.y = -a 之后，方块的**局部 Z 是切线方向、局部 X 是半径方向**，
        所以横拱要长在 Z 上、翘要长在 X 上，写反了就会横竖颠倒。 */
  const sc = h / 0.72;                       // 按各重檐斗拱带的实际高度缩放
  const ys = y0 + h * 0.44;
  /* ⚠️ 横拱的长度要按**相邻两攒的弧长**算，不能写死：三重檐半径差很大
     （8.72 / 5.32 / 2.72），弧长间隔分别是 2.28 / 1.39 / 0.71。
     写死 0.80 的结果是每根拱孤零零杵着；写死一个大的，到上层又会互相穿模。 */
  const sp = (Math.PI * 2 * r) / 24;
  const douGeo  = new THREE.BoxGeometry(0.27 * sc, 0.20 * sc, 0.27 * sc);
  const gongGeo = new THREE.BoxGeometry(0.22 * sc, 0.15 * sc, sp * 0.76);   // 长在 Z = 切线
  const qiaoGeo = new THREE.BoxGeometry(0.54 * sc, 0.16 * sc, 0.22 * sc);   // 长在 X = 半径
  around(24, (a) => {
    const cx = Math.cos(a), sx = Math.sin(a);

    const dou = new THREE.Mesh(douGeo, M.goldDim);
    dou.position.set(cx * (r + 0.13), ys - 0.17 * sc, sx * (r + 0.13));
    dou.rotation.y = -a;
    temple.add(dou);

    const gong = new THREE.Mesh(gongGeo, M.dgGong);
    gong.position.set(cx * (r + 0.13), ys + 0.01 * sc, sx * (r + 0.13));
    gong.rotation.y = -a;
    gong.castShadow = true;
    temple.add(gong);

    const qiao = new THREE.Mesh(qiaoGeo, M.goldDim);
    qiao.position.set(cx * (r + 0.26), ys + 0.01 * sc, sx * (r + 0.26));
    qiao.rotation.y = -a;
    qiao.castShadow = true;
    temple.add(qiao);
  });
}

/* ---------- 7.6 三重蓝色琉璃檐 ----------
 *   用 LatheGeometry 旋转成型：截面点从"斗拱外沿 → 檐口外缘 → 往上收"，
 *   一次把挑檐的曲线和檐下封板都做出来（曲线比直锥更像真檐）。
 * ------------------------------------------------------------ */
function buildRoof(profile, ridgeCount){
  const pts = profile.map(p => new THREE.Vector2(p[0], p[1]));
  // 瓦垄贴图沿 u 方向重复 —— 在旋转体上正好是"一圈放射状的筒瓦"
  const mat = new THREE.MeshStandardMaterial({
    map: TEX.rep(TEX.ridge, ridgeCount, 1),
    color: 0xffffff, roughness: .62, metalness: .22,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(pts, 84), mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  temple.add(mesh);
}

/** 檐口：瓦当圈 + 金线 + 檐下一圈椽头 */
function buildEaveTrim(rEave, yEave, tubeR, rafters, tileCount){

/* 把内嵌的石狮网格摆到两个座上 */
/* 一只蹲狮。局部坐标：脚底 y = 0，面朝 +Z。
   中式石狮的辨识度全在这几处：①②③缺一个就不像。
     ① 头大、方脸、獠牙张口的凶相
     ② 满头螺髻（一圈圈卷毛疙瘩）—— 最标志性的一条
     ③ 项圈 + 铃铛 + 缨络，以及爪下踩的绣球 / 小狮
   另外蹲姿是"前腿直立撑地、后腿折叠坐实、胸脯宽厚"，不是四脚站着的狗。 */
function buildLion(variant){
  const g = new THREE.Group();
  const S = M.stone, S2 = M.stone2, DK = M.dark, SH = M.shadow;
  const G = {
    sph : new THREE.SphereGeometry(1, 8, 6),
    box : new THREE.BoxGeometry(1, 1, 1),
    cyl : new THREE.CylinderGeometry(1, 1, 1, 8),
    cone: new THREE.ConeGeometry(1, 1, 6),
    tor : new THREE.TorusGeometry(1, 0.17, 5, 14),
  };
  function put(geo, mat, x, y, z, sx, sy, sz, rx, ry, rz){
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    m.rotation.set(rx || 0, ry || 0, rz || 0);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
    return m;
  }

  /* ---------- 身体：蹲姿 ---------- */
  put(G.box, S2, 0, 0.05, 0.02,   1.16, 0.10, 1.30);        // 脚下薄石台
  put(G.sph, S,  0, 0.47, -0.26,  0.44, 0.38, 0.44);        // 后臀（坐实）
  put(G.sph, S,  0, 0.70, -0.02,  0.38, 0.39, 0.38);        // 腰
  put(G.sph, S,  0, 0.87,  0.15,  0.39, 0.34, 0.34);        // 胸

  [-1, 1].forEach(sd => {
    put(G.cyl,  S,  sd * 0.235, 0.55, 0.31,  0.135, 0.64, 0.135);   // 前腿
    put(G.box,  S,  sd * 0.235, 0.095, 0.43, 0.31, 0.19, 0.38);     // 前爪
    for (let t = -1; t <= 1; t++)                                    // 爪趾
      put(G.sph, S, sd * 0.235 + t * 0.088, 0.075, 0.615, 0.052, 0.05, 0.055);

    put(G.sph,  S,  sd * 0.375, 0.35, -0.06, 0.22, 0.23, 0.31);     // 后腿大腿
    put(G.box,  S,  sd * 0.375, 0.16,  0.10, 0.21, 0.29, 0.40);     // 后腿小腿
    put(G.box,  S,  sd * 0.375, 0.065, 0.33, 0.25, 0.14, 0.31);     // 后爪
  });

  /* ---------- 头 ---------- */
  const HX = 0, HY = 1.15, HZ = 0.28;
  put(G.cyl,  S,  0, 0.97, 0.12,  0.21, 0.30, 0.21);        // 颈
  put(G.sph,  S,  HX, HY, HZ,     0.315, 0.29, 0.30);       // 颅

  /* 吻部拆成上下两块，中间留 0.045 的缝当嘴。
     这样嘴腔是"真的凹进去"，牙从缝里露出来 —— 一整块吻部加个暗盒是做不出来的。 */
  put(G.box,  S,   0, 1.095, 0.605,  0.34, 0.13, 0.20);     // 上颚 / 上唇
  put(G.box,  S,   0, 0.932, 0.595,  0.31, 0.11, 0.19);     // 下颚
  put(G.box,  DK,  0, 1.008, 0.575,  0.285, 0.052, 0.16);   // 口腔（暗，略退进去）
  put(G.box,  S2,  0, 1.128, 0.715,  0.150, 0.080, 0.070);  // 鼻头（贴在吻端）
  [-1, 1].forEach(sd =>                                      // 獠牙
    put(G.cone, M.marble, sd * 0.115, 1.012, 0.672, 0.033, 0.105, 0.033, Math.PI, 0, 0));
  [-2, -1, 1, 2].forEach(k =>                                // 上排小齿
    put(G.cone, M.marble, k * 0.065, 1.020, 0.695, 0.019, 0.055, 0.019, Math.PI, 0, 0));

  /* 眼和眉都要推到颅球表面之外 —— 头球在 x=0.15,y=1.19 处的前表面约 z=0.540 */
  [-1, 1].forEach(sd => {
    put(G.sph, DK, sd * 0.150, 1.192, 0.556, 0.060, 0.058, 0.050);          // 眼（暗）
    put(G.sph, SH, sd * 0.150, 1.192, 0.588, 0.030, 0.030, 0.022);          // 瞳
    put(G.box, S,  sd * 0.163, 1.252, 0.532, 0.20, 0.062, 0.10, 0, 0, sd * 0.26); // 压眉
    put(G.sph, S,  sd * 0.280, 1.250, 0.195, 0.088, 0.076, 0.055);          // 耳
  });

  /* ---------- 螺髻：颅外一层疙瘩，正面让开脸 ---------- */
  const R = 0.372;
  [[-0.55, 11], [-0.18, 14], [0.20, 14], [0.58, 12], [0.92, 10], [1.22, 6]].forEach(([lat, cnt]) => {
    const cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < cnt; i++){
      const lon = (i / cnt) * Math.PI * 2 + lat * 2.3;
      const dz = Math.sin(lon) * cl;
      if (dz > 0.38) continue;                                // 让开正脸
      put(G.sph, S2, HX + Math.cos(lon) * cl * R, HY + sl * R, HZ + dz * R,
          0.064, 0.064, 0.064);
    }
  });

  /* ---------- 项圈 / 铃铛 / 缨络 ---------- */
  put(G.tor, S2, 0, 0.948, 0.14, 0.35, 0.35, 0.35, Math.PI / 2, 0, 0);
  put(G.sph, M.goldDim, 0, 0.828, 0.500, 0.098, 0.104, 0.098);
  [-0.064, 0, 0.064].forEach(dx =>
    put(G.cone, M.goldDim, dx, 0.722, 0.492, 0.026, 0.11, 0.026, Math.PI, 0, 0));

  /* ---------- 尾巴：贴着脊背卷上去 ---------- */
  for (let i = 0; i < 6; i++){
    const t = i / 5;
    put(G.sph, S2, 0.03 + t * 0.15, 0.32 + t * 0.76, -0.62 + t * 0.13, 0.062, 0.062, 0.062);
  }
  put(G.tor, S2, 0.22, 1.06, -0.47, 0.09, 0.09, 0.09, 0, Math.PI / 2, 0);

  /* ---------- 爪下：绣球 / 小狮 ---------- */
  if (variant === 'ball'){
    put(G.sph, S, 0.245, 0.175, 0.665, 0.168, 0.168, 0.168);
    for (let k = 0; k < 3; k++)
      put(G.tor, S2, 0.245, 0.175, 0.665, 0.171, 0.171, 0.171,
          Math.PI / 2, 0, k * Math.PI / 3);
  } else {
    put(G.sph, S, 0.250, 0.150, 0.645, 0.175, 0.120, 0.22);   // 小狮身子
    put(G.sph, S, 0.250, 0.215, 0.815, 0.105, 0.095, 0.095);  // 小狮头
    [-1, 1].forEach(s2 => put(G.sph, S2, 0.250 + s2 * 0.088, 0.255, 0.800, 0.030, 0.030, 0.028));
    [-1, 1].forEach(s2 => put(G.sph, S,  0.250 + s2 * 0.078, 0.052, 0.745, 0.048, 0.055, 0.052));
    put(G.tor, S2, 0.250, 0.205, 0.63, 0.15, 0.15, 0.15, Math.PI / 2, 0, 0);
  }

  g.scale.setScalar(1.10);
  return g;
}

/* ---- 古柏（低多边形，绕一圈把院子围起来） ---- */
function buildCypress(x, z, sc){
  /* 古柏：树干高、树冠是一根往上收的"塔"，不是几团绿球堆在一起。
     原来 4 个二十面体随机缩放旋转，堆出来就是"绿石头插棍子"。 */
  const g = new THREE.Group();
  const H = 6.2 * sc;
  const lean = (Math.random() - 0.5) * 0.12;

  // 树干：下粗上细，两节带一点弯（古柏没有直的）
  const t1 = new THREE.Mesh(new THREE.CylinderGeometry(0.19 * sc, 0.36 * sc, H * 0.50, 7), M.trunk);
  t1.position.set(0, H * 0.25, 0);
  t1.rotation.z = lean;
  g.add(t1);
  const t2 = new THREE.Mesh(new THREE.CylinderGeometry(0.13 * sc, 0.20 * sc, H * 0.30, 7), M.trunk);
  t2.position.set(Math.sin(lean) * -H * 0.28, H * 0.62, 0);
  t2.rotation.z = lean * 1.6;
  g.add(t2);

  // 树冠：7 块扁平多面体往上叠，越往上越小、越偏
  const leafGeo = new THREE.IcosahedronGeometry(1, 0);
  const N = 7;
  for (let i = 0; i < N; i++){
    const t = i / (N - 1);
    const r = (1.42 - t * 1.16) * sc;
    const m = new THREE.Mesh(leafGeo, M.leaf);
    m.position.set(
      (Math.random() - 0.5) * 0.60 * sc + Math.sin(lean) * -H * 0.32 * t,
      H * (0.33 + t * 0.66),
      (Math.random() - 0.5) * 0.60 * sc);
    m.scale.set(r * 1.06, r * (0.66 + Math.random() * 0.22), r * 1.06);
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    g.add(m);
  }

  g.position.set(x, 0, z);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  temple.add(g);
}
// 只种在后侧与两侧，正前方留出视线（a 从 +X 起算、朝 +Z 为正）

}

/* ================================================================
 * 8. 雨 —— LineSegments + 自定义 Shader（带倾斜角，暴雨会斜得更狠）
 * ================================================================ */
const RAIN_MAX = 14000, RAIN_R = 130, RAIN_H = 110;
const rainUniforms = {
  uTime:  { value: 0 },
  uH:     { value: RAIN_H },
  uLen:   { value: 2.6 },
  uSpeed: { value: 42.0 },
  uSlant: { value: 0.10 },
  uColor: { value: new THREE.Color(0xa9c2e6) },
  uAlpha: { value: 0.0 },
};
const rain = (() => {
  const pos = new Float32Array(RAIN_MAX * 6);
  const off = new Float32Array(RAIN_MAX * 2);
  const flag= new Float32Array(RAIN_MAX * 2);
  for (let i = 0; i < RAIN_MAX; i++){
    const x = (Math.random() - .5) * RAIN_R * 2;
    const z = (Math.random() - .5) * RAIN_R * 2;
    const o = Math.random() * RAIN_H;
    const i6 = i * 6;
    pos[i6] = x; pos[i6+1] = 0; pos[i6+2] = z;
    pos[i6+3] = x; pos[i6+4] = 0; pos[i6+5] = z;
    off[i*2] = o; off[i*2+1] = o;
    flag[i*2] = 0; flag[i*2+1] = 1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aOff',  new THREE.BufferAttribute(off, 1));
  geo.setAttribute('aFlag', new THREE.BufferAttribute(flag, 1));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
    uniforms: rainUniforms,
    vertexShader: `
      attribute float aOff; attribute float aFlag;
      uniform float uTime, uH, uLen, uSpeed, uSlant;
      varying float vA;
      void main(){
        float y = mod(aOff - uTime * uSpeed, uH);
        float wob = sin(uTime * 1.6 + aOff * 3.1) * 0.30;
        vec3 p = vec3(position.x + wob + y * uSlant, y + aFlag * uLen, position.z + y * uSlant * 0.35);
        vA = mix(0.70, 0.05, aFlag);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uAlpha; varying float vA;
      void main(){ gl_FragColor = vec4(uColor, vA * uAlpha); }`
  });
  const ls = new THREE.LineSegments(geo, mat);
  ls.frustumCulled = false;
  ls.geometry.setDrawRange(0, 0);
  scene.add(ls);
  return ls;
})();

/* ================================================================
 * 9. 彩虹 —— 7 条半环 Torus 叠出来，永远正面朝向相机
 * ================================================================ */
const rainbow = new THREE.Group();
{
  [0xff4d4d, 0xff9a3d, 0xffe14d, 0x6fdc6f, 0x4dc8ff, 0x4d7dff, 0xa86bff]
  .forEach((c, i) => {
    const arc = new THREE.Mesh(
      new THREE.TorusGeometry(35 + i * 1.75, 0.80, 6, 64, Math.PI),
      new THREE.MeshBasicMaterial({
        color:c, transparent:true, opacity:0.40, depthWrite:false,

      })
    );
    rainbow.add(arc);
  });
  rainbow.position.set(0, 1.5, -150);
  rainbow.visible = false;
  scene.add(rainbow);
}

/* ================================================================
 * 10. 环境状态：天气 × 时间
 *     每个状态只描述"基数/偏移"，最终目标值再交给每帧插值器，
 *     所以切换是渐变过去，不会硬跳。
 * ================================================================ */
const TIMES = {
  day:   { key:'day',   name:'白天', el: 56, az:  42, sunColor:0xfff3e2, sunPower:2.15,
           skyTop:0x2f7fd6, skyBot:0xbcdcf5, amb:0.36, ambColor:0x9fb8d8,
           hemi:0.56, hemiSky:0xbcd6ee, star:0,   isMoon:false, exposure:1.02, lamp:0.00 },
  dusk:  { key:'dusk',  name:'黄昏', el:  8, az:  26, sunColor:0xff9248, sunPower:2.2,
           skyTop:0x27356e, skyBot:0xff9d5c, amb:0.30, ambColor:0xc08a72,
           hemi:0.42, hemiSky:0x6d6ea8, star:0.28, isMoon:false, exposure:1.06, lamp:0.55 },
  night: { key:'night', name:'黑夜', el: 46, az:  28, sunColor:0xaecaff, sunPower:1.90,
           skyTop:0x04070f, skyBot:0x101c33, amb:0.32, ambColor:0x5b74a8,
           hemi:0.38, hemiSky:0x2c4270, star:1.00, isMoon:true,  exposure:1.22, lamp:1.00 },
};

const WEATHERS = {
  sunny:    { key:'sunny',    name:'晴天',     sunMul:1.00, ambMul:1.00, cloud:0.16, cloudColor:0xffffff,
              rain:0.00, rainSpeed:1.00, slant:0.06, skyMix:0.00, skyTint:0x8fc4ff, fogMul:1.0, starMul:1.0, flash:0, rainbow:0 },
  hot:      { key:'hot',      name:'出太阳',   sunMul:1.38, ambMul:1.24, cloud:0.05, cloudColor:0xfff7ea,
              rain:0.00, rainSpeed:1.00, slant:0.04, skyMix:0.12, skyTint:0x7fd0ff, fogMul:0.8, starMul:1.0, flash:0, rainbow:0 },
  overcast: { key:'overcast', name:'阴天',     sunMul:0.34, ambMul:0.95, cloud:0.72, cloudColor:0xdadce0,
              rain:0.00, rainSpeed:1.00, slant:0.08, skyMix:0.64, skyTint:0x9aa2aa, fogMul:1.9, starMul:0.3, flash:0, rainbow:0 },
  dark:     { key:'dark',     name:'乌云密布', sunMul:0.16, ambMul:0.72, cloud:1.00, cloudColor:0x565a62,
              rain:0.05, rainSpeed:0.90, slant:0.12, skyMix:0.88, skyTint:0x535961, fogMul:2.6, starMul:0.0, flash:0, rainbow:0 },
  rain:     { key:'rain',     name:'下雨',     sunMul:0.20, ambMul:0.80, cloud:0.90, cloudColor:0x757a83,
              rain:0.42, rainSpeed:1.00, slant:0.10, skyMix:0.80, skyTint:0x69717c, fogMul:3.0, starMul:0.0, flash:0, rainbow:0 },
  storm:    { key:'storm',    name:'暴雨',     sunMul:0.12, ambMul:0.66, cloud:1.00, cloudColor:0x484c55,
              rain:1.00, rainSpeed:1.75, slant:0.34, skyMix:0.92, skyTint:0x4a505a, fogMul:4.2, starMul:0.0, flash:0, rainbow:0 },
  thunder:  { key:'thunder',  name:'打雷',     sunMul:0.14, ambMul:0.70, cloud:1.00, cloudColor:0x4d525b,
              rain:0.72, rainSpeed:1.35, slant:0.24, skyMix:0.90, skyTint:0x4d535d, fogMul:3.6, starMul:0.0, flash:1, rainbow:0 },
  lightning:{ key:'lightning',name:'闪电',     sunMul:0.15, ambMul:0.72, cloud:1.00, cloudColor:0x51565f,
              rain:0.50, rainSpeed:1.20, slant:0.20, skyMix:0.90, skyTint:0x50565f, fogMul:3.4, starMul:0.0, flash:2, rainbow:0 },
  rainbow:  { key:'rainbow',  name:'彩虹',     sunMul:0.72, ambMul:1.05, cloud:0.44, cloudColor:0xdde2e8,
              rain:0.10, rainSpeed:0.85, slant:0.06, skyMix:0.36, skyTint:0x9fc0d8, fogMul:1.4, starMul:0.4, flash:0, rainbow:1 },
};

let curTime = 'day', curWeather = 'sunny';

/* 当前值 / 目标值 */
const CUR = {
  skyTop:new THREE.Color(), skyBot:new THREE.Color(),
  fogColor:new THREE.Color(), fogDensity:0.0014,
  sunColor:new THREE.Color(), sunPower:1, el:56, az:138,
  hemi:0.6, hemiSky:new THREE.Color(), hemiGnd:new THREE.Color(0x4a4a52),
  amb:0.36, ambColor:new THREE.Color(),
  cloud:0.16, cloudColor:new THREE.Color(0xffffff), cloudY:1,
  rain:0, rainSpeed:1, slant:0.06, rainAlpha:0,
  star:0, rainbow:0, exposure:1.05, lamp:0,
};
const TGT = {
  skyTop:new THREE.Color(), skyBot:new THREE.Color(),
  fogColor:new THREE.Color(), fogDensity:0.0014,
  sunColor:new THREE.Color(), sunPower:1, el:56, az:138,
  hemi:0.6, hemiSky:new THREE.Color(), hemiGnd:new THREE.Color(0x4a4a52),
  amb:0.36, ambColor:new THREE.Color(),
  cloud:0.16, cloudColor:new THREE.Color(0xffffff), cloudY:1,
  rain:0, rainSpeed:1, slant:0.06, rainAlpha:0,
  star:0, rainbow:0, exposure:1.05, lamp:0,
};

/** 天气 × 时间 → 目标值 */
function recomputeTargets(){
  const t = TIMES[curTime], w = WEATHERS[curWeather], mix = w.skyMix;

  TGT.skyTop.copy(new THREE.Color(t.skyTop).lerp(new THREE.Color(w.skyTint), mix));
  TGT.skyBot.copy(new THREE.Color(t.skyBot).lerp(new THREE.Color(w.skyTint), mix * 0.82));
  TGT.fogColor.copy(TGT.skyBot).multiplyScalar(0.92);
  TGT.fogDensity = 0.0013 * w.fogMul * (curTime === 'night' ? 0.7 : 1);

  TGT.sunColor.set(t.sunColor);
  TGT.sunPower = t.sunPower * w.sunMul;
  TGT.el = t.el;
  TGT.az = t.az;

  TGT.hemi = t.hemi * (0.55 + 0.45 * w.ambMul);
  TGT.hemiSky.set(t.hemiSky).lerp(new THREE.Color(w.skyTint), mix * 0.5);
  TGT.hemiGnd.set(curTime === 'night' ? 0x1a1f2c : 0x4a4a52);

  TGT.amb = t.amb * w.ambMul;
  TGT.ambColor.set(t.ambColor).lerp(new THREE.Color(w.skyTint), mix * 0.45);

  TGT.cloud = w.cloud;
  TGT.cloudColor.set(w.cloudColor);
  TGT.cloudY = 1 - mix * 0.26;

  TGT.rain       = w.rain;
  TGT.rainSpeed  = w.rainSpeed;
  TGT.slant      = w.slant;
  TGT.rainAlpha  = w.rain > 0 ? 0.30 + w.rain * 0.34 : 0;

  TGT.star    = t.star * w.starMul;
  TGT.rainbow = w.rainbow;
  TGT.lamp    = t.lamp;
  TGT.exposure = t.exposure;
}

/** 每帧朝目标插值 */
function lerpEnv(dt){
  const k = 1 - Math.pow(0.0016, dt);     // 与帧率无关的平滑系数
  for (const key of ['skyTop','skyBot','fogColor','sunColor','hemiSky','hemiGnd',
                     'ambColor','cloudColor']){
    CUR[key].lerp(TGT[key], k);
  }
  for (const key of ['fogDensity','sunPower','el','az','hemi','amb','cloud','cloudY',
                     'rain','rainSpeed','slant','rainAlpha','star','rainbow','exposure','lamp']){
    CUR[key] += (TGT[key] - CUR[key]) * k;
  }
}

/** 插值结果 → 场景对象 */
function applyEnv(){
  skyUniforms.topColor.value.copy(CUR.skyTop);
  skyUniforms.botColor.value.copy(CUR.skyBot);
  scene.fog.color.copy(CUR.fogColor);
  scene.fog.density = CUR.fogDensity;

  // 主光方向：白天是太阳，夜里同一盏灯调成冷色月光，方向翻到另一侧
  const el = THREE.MathUtils.degToRad(CUR.el), az = THREE.MathUtils.degToRad(CUR.az);
  const dir = new THREE.Vector3(
    Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
  const isMoon = TIMES[curTime].isMoon;
  // 注意：夜里不要再 dir.negate() —— 那会让月亮跑到地平线以下，等于从地底往上打光
  sun.position.copy(dir).multiplyScalar(260);
  sun.target.position.set(0, 8, 0);
  sun.color.copy(CUR.sunColor);
  sun.intensity = CUR.sunPower;

  moonGroup.visible = isMoon && CUR.star > 0.02;
  if (moonGroup.visible){
    moonGroup.position.copy(dir).multiplyScalar(640);
    moonGroup.lookAt(0, 0, 0);
  }

  hemi.intensity = CUR.hemi;
  hemi.color.copy(CUR.hemiSky);
  hemi.groundColor.copy(CUR.hemiGnd);
  ambient.intensity = CUR.amb + ambientExtra;     // ambientExtra = 闪电瞬时加亮
  ambient.color.copy(CUR.ambColor);
  fill.intensity = 0.32 * (isMoon ? 1.0 : 1) * (0.35 + 0.65 * Math.min(CUR.sunPower / 2.6, 1.4));

  // 云
  cloudMats.forEach((m, i) => {
    m.opacity = CUR.cloud * (i % 3 === 0 ? 0.80 : 0.64);
    m.color.copy(CUR.cloudColor);
  });
  cloudGroup.position.y = (CUR.cloudY - 1) * 34;
  cloudGroup.rotation.y += 0.0012;

  // 星星（云一厚就看不见）
  starMat.opacity = Math.max(0, CUR.star - CUR.cloud * 0.9) * 0.95;

  // 雨
  rain.geometry.setDrawRange(0, Math.floor(CUR.rain * RAIN_MAX) * 2);
  rainUniforms.uSlant.value = CUR.slant;
  rainUniforms.uSpeed.value = 42 * CUR.rainSpeed;
  rainUniforms.uLen.value   = 2.4 + CUR.rain * 2.4;
  rainUniforms.uAlpha.value = CUR.rainAlpha;

  // 彩虹（绕 Y 轴始终正对相机）
  rainbow.visible = CUR.rainbow > 0.02;
  if (rainbow.visible){
    rainbow.children.forEach((arc, i) => {
      arc.material.opacity = CUR.rainbow * (0.44 - i * 0.018);
    });
    rainbow.rotation.y = Math.atan2(camera.position.x, camera.position.z + 150);
  }

  // 夜景：门窗、匾额透出灯光；殿身四周的暖光打到台面上
  const glow = CUR.lamp;
  for (let i = 0; i < NIGHT_GLOW.length; i++){
    const o = NIGHT_GLOW[i];
    o.m.emissive.setHex(o.c);
    o.m.emissiveIntensity = o.base + glow * o.k;
  }
  for (let i = 0; i < hallLights.length; i++) hallLights[i].intensity = glow * 1.6;
  for (let i = 0; i < lanternLights.length; i++) lanternLights[i].intensity = glow * 2.4;

  renderer.toneMappingExposure = CUR.exposure;
}

/* ================================================================
 * 11. 闪电与雷声
 * ================================================================ */
const flashEl = document.getElementById('flash');
let flashTimer = null, rumbleEnabled = true;
let ambientExtra = 0;                     // 闪电期间额外叠加的环境光

/** 一次闪电：全屏 DOM 遮罩频闪 + 环境光瞬时拉满 */
function strike(intensity){
  const seq = [[0,1.00],[0.07,0.12],[0.13,0.85],[0.26,0.05],[0.34,0.42],[0.52,0]];
  const T0 = performance.now(), dur = 620;
  (function tick(){
    const p = (performance.now() - T0) / dur;
    if (p >= 1){ flashEl.style.opacity = 0; ambientExtra = 0; return; }
    let v = 0;
    for (let i = 0; i < seq.length - 1; i++){
      if (p >= seq[i][0] && p < seq[i+1][0]){
        v = THREE.MathUtils.lerp(seq[i][1], seq[i+1][1], (p - seq[i][0]) / (seq[i+1][0] - seq[i][0]));
        break;
      }
    }
    flashEl.style.opacity = (v * intensity * 0.55).toFixed(3);
    ambientExtra = v * intensity * 1.6;
    requestAnimationFrame(tick);
  })();
}

/** 按当前天气排下一次闪电 */
function scheduleFlash(){
  if (flashTimer) clearTimeout(flashTimer);
  const w = WEATHERS[curWeather];
  if (!w.flash) return;
  const fast = w.flash === 2;                 // 2 = 闪电（更频繁），1 = 打雷
  flashTimer = setTimeout(() => {
    strike(fast ? 1.0 : 0.85);
    if (rumbleEnabled) SFX.thunder(fast ? 0.55 : 0.9);
    scheduleFlash();
  }, fast ? 1400 + Math.random() * 2200 : 4200 + Math.random() * 5200);
}

/* ================================================================
 * 12. 雷声（Web Audio 程序化合成，零素材）
 *     浏览器要求先有交互才允许出声 —— 首次点击/滚轮/按键自动启动。
 * ================================================================ */
const SFX = (function(){
  let ctx = null, master = null, noise = null;
  function boot(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
    const n = Math.floor(ctx.sampleRate * 3);
    const b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    noise = b;
  }
  return {
    start: boot,
    thunder(power){                    // 由亮转闷的低频隆隆声
      if (!ctx) return;
      const t = ctx.currentTime;
      const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(420, t);
      lp.frequency.exponentialRampToValueAtTime(70, t + 2.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.24 * power, t + 0.09);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
      s.connect(lp); lp.connect(g); g.connect(master);
      s.start(t); s.stop(t + 3.3);
    },
    mute(on){
      if (!ctx || !master) return;
      const t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(on ? 0 : 0.85, t + 0.15);
    }
  };
})();
['pointerdown','wheel','keydown','touchstart'].forEach(ev => {
  window.addEventListener(ev, function once(){ SFX.start(); }, { once:true, passive:true });
});

/* ================================================================
 * 13. 控制面板
 * ================================================================ */
function buildSeg(host, list, getCur, onPick){
  const btns = {};
  Object.values(list).forEach(item => {
    const b = document.createElement('button');
    b.className = 'pill';
    b.textContent = item.name;
    b.addEventListener('click', e => {
      e.stopPropagation();
      onPick(item.key);
      sync();
    });
    host.appendChild(b);
    btns[item.key] = b;
  });
  function sync(){
    const c = getCur();
    for (const k in btns) btns[k].classList.toggle('on', k === c);
  }
  sync();
  return { sync: sync, btns: btns };
}

const panel = document.getElementById('panel');

const segW = buildSeg(document.getElementById('segWeather'), WEATHERS,
  () => curWeather,
  k => {
    if (k === 'rainbow' && curTime === 'night') return;   // 夜里不给开彩虹
    curWeather = k; recomputeTargets(); scheduleFlash();
  });

const segT = buildSeg(document.getElementById('segTime'), TIMES,
  () => curTime,
  k => {
    curTime = k;
    // 切到夜间就把彩虹收掉，并把"彩虹"按钮锁住；回到白天再解锁
    if (curTime === 'night' && curWeather === 'rainbow'){
      curWeather = 'rain';
      syncW();
    }
    recomputeTargets();
    syncRainbowAvail();
  });

const syncW = segW.sync, syncT = segT.sync;
const rainbowBtn = segW.btns['rainbow'];

/** 夜间禁用"彩虹"按钮 */
function syncRainbowAvail(){
  const off = (curTime === 'night');
  rainbowBtn.disabled = off;
  rainbowBtn.classList.toggle('disabled', off);
  rainbowBtn.title = off ? '夜间不会有彩虹' : '';
}
syncRainbowAvail();

const btnSound = document.getElementById('btnSound');
btnSound.classList.add('on');
btnSound.addEventListener('click', e => {
  e.stopPropagation();
  rumbleEnabled = !rumbleEnabled;
  btnSound.classList.toggle('on', rumbleEnabled);
  btnSound.textContent = '雷声 ' + (rumbleEnabled ? '开' : '关');
  SFX.mute(!rumbleEnabled);
});

document.getElementById('btnReset').addEventListener('click', e => {
  e.stopPropagation();
  camera.position.copy(CAM_HOME.pos);
  controls.target.copy(CAM_HOME.tgt);
  controls.update();
});

/* 面板上的指针事件不要漏到画布（面板在 canvas 之上，吞掉更保险） */
['pointerdown','pointerup','pointermove','wheel','contextmenu'].forEach(ev => {
  panel.addEventListener(ev, e => e.stopPropagation(), { passive:false });
});

/* ================================================================
 * 14. 渲染循环
 * ================================================================ */
let last = performance.now() / 1000, elapsed = 0;

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  const dt = Math.min(now - last, 0.05);
  last = now;
  elapsed += dt;

  lerpEnv(dt);
  applyEnv();

  // 雨跟着相机平移，保证永远在"头顶上"
  rain.position.set(camera.position.x * 0.6, 0, camera.position.z * 0.6);
  rainUniforms.uTime.value = elapsed;

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);

  controls.update();          // enableDamping / autoRotate 都靠它生效
  // 正面仰视时相机会压得很低 —— 兜一道底，绝不许钻到地面以下
  if (camera.position.y < 0.9) camera.position.y = 0.9;
  renderer.render(scene, camera);
}

/* ================================================================
 * 15. 启动
 * ================================================================ */
recomputeTargets();
// 初始值直接落到目标上，避免开场那一段"由暗转亮"
CUR.skyTop.copy(TGT.skyTop);  CUR.skyBot.copy(TGT.skyBot);
CUR.fogColor.copy(TGT.fogColor); CUR.fogDensity = TGT.fogDensity;
CUR.sunColor.copy(TGT.sunColor); CUR.sunPower = TGT.sunPower;
CUR.el = TGT.el; CUR.az = TGT.az;
CUR.hemi = TGT.hemi; CUR.hemiSky.copy(TGT.hemiSky); CUR.hemiGnd.copy(TGT.hemiGnd);
CUR.amb = TGT.amb;   CUR.ambColor.copy(TGT.ambColor);
CUR.cloud = TGT.cloud; CUR.cloudColor.copy(TGT.cloudColor); CUR.cloudY = TGT.cloudY;
CUR.star = TGT.star; CUR.exposure = TGT.exposure;
applyEnv();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();

requestAnimationFrame(() => {
  const boot = document.getElementById('boot');
  setTimeout(() => boot.classList.add('hide'), 240);
  setTimeout(() => {
    document.getElementById('title').classList.add('in');
    panel.classList.add('in');
  }, 420);
});

/* 控制台里可以直接调：__temple.setWeather('storm') / __temple.setTime('night') */
window.__temple = {
  scene, camera, renderer, controls,
  setWeather(k){
    if (k === 'rainbow' && curTime === 'night') return;
    curWeather = k; recomputeTargets(); scheduleFlash(); syncW();
  },
  setTime(k){
    curTime = k;
    if (curTime === 'night' && curWeather === 'rainbow'){ curWeather = 'rain'; syncW(); }
    recomputeTargets(); syncT(); syncRainbowAvail();
  },
};
</script>

  // 出错时把原因显示出来，而不是白屏
  window.addEventListener('error', function (e) {
    var b = document.getElementById('boot');
    if (!b) return;
    window.__err = true;
    b.classList.remove('hide');
    b.innerHTML = '<div class="err">脚本报错：<br>' +
      (e.message || e.error || '未知') + '<br>' +
      (e.filename || '') + ':' + (e.lineno || '') + '</div>';
  });
  // CDN 偶发抽风（连接被重置）—— 自动重载一次；只重试一次，避免死循环
  setTimeout(function () {
    if (window.__temple || window.__err) return;
    if (location.hash !== '#r2') {
      location.hash = (location.hash === '#r1') ? '#r2' : '#r1';
      location.reload();
      return;
    }
    var b = document.getElementById('boot');
    if (b) b.innerHTML = '<div class="err">Three.js 没能从 CDN 加载。<br>' +
      '请确认能访问 cdn.jsdelivr.net，再刷新一次通常就好。</div>';
  }, 7000);
</script>
