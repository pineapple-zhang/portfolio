let perfT = 0;
let transition = 0;
let roundFx = 0;                    // 开场 ROUND / FIGHT 演出计时
let koFx = 0;                        // 通关 K.O. 演出计时

/* 超必杀演出状态 */
const superFx = { on: false, t: 0, fade: 0 };

const SAVE_KEY = 'rabbit_quest_progress_v1';
const UP_KEYS = ['atk', 'hp', 'arm'];
const UP_INFO = {
  atk: { name: '攻击力',   max: 20, fmt: v => '+' + (v * 8) + '%' },
  hp:  { name: '生命上限', max: 20, fmt: v => '+' + (v * 12) },
  arm: { name: '护甲',     max: 8,  fmt: v => '-' + (v * 6) + '% 受伤' }
};
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
    const up = p.up || {};
    return {
      maxLevel: p.maxLevel || 0,
      points:   p.points   || 0,
      up: { atk: up.atk || 0, hp: up.hp || 0, arm: up.arm || 0 }
    };
  } catch (e) {
    return { maxLevel: 0, points: 0, up: { atk: 0, hp: 0, arm: 0 } };
  }
}
function saveProgress(p) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(p)); } catch (e) {} }
progress = loadProgress();

function loadLevel(i) {
  levelIndex = i;
  level = LEVELS[i];
  LEVEL_W = level.width;
  player.reset(level.spawn.x, level.spawn.y);
  enemies = level.enemies.map(([t, x, y]) => new Enemy(t, x, y));
  // 难度递增：后面的关卡怪更肉、更疼
  const pw = level.power || 1;
  for (const e of enemies) {
    e.maxHp = Math.round(e.maxHp * pw); e.hp = e.maxHp;
    e.dmg = Math.round(e.dmg * pw);
  }
  shocks = []; particles = []; waves = []; slashes = []; eShots = []; pickups = []; healthOrbs = [];
  // BOSS 场地入口固定放一颗回血球：走到关底时一般已经掉了不少血
  if (level.bossArena) spawnHealthOrb(level.bossArena.x + 70, 236, 0.35);
  camera.x = clamp(player.cx - VW / 2, 0, Math.max(0, LEVEL_W - VW));
  camera.y = 0;                      // 纵向偏移也必须清 —— 空中死亡/过关会把 -34 带进下一关
  storm = null;
  camera.zoom = 1; feel.hitstop = 0; feel.shake = 0; feel.shakeX = 0; feel.shakeY = 0;
  feel.flash = 0; feel.zoomPunch = 0;
  superFx.on = false; superFx.t = 0; superFx.fade = 0;
  transition = 30;
  roundFx = 110;                     // 开场演出
  koFx = 0;
  gameState = 'playing';
}

/* ---- 特效 ---- */
function spawnShock(x, y, dir) {
  shocks.push({ x, y, r: 6, t: 0, life: 28, dir });
  spawnDust(x, y, 12, 1.4);
}
function spawnDust(x, y, n, power) {
  for (let i = 0; i < n; i++) {
    const a = rnd(-Math.PI, 0);
    particles.push({
      x: x + rnd(-8, 8), y: y - rnd(0, 4),
      vx: Math.cos(a) * rnd(0.6, 2.4) * power,
      vy: Math.sin(a) * rnd(0.6, 1.8) * power - 0.4,
      life: 18 + Math.random() * 14,
      col: i % 3 === 0 ? '#6A6A62' : (i % 3 === 1 ? '#8E8E84' : '#4A4A46'),
      s: 1 + Math.round(power), dust: true
    });
  }
}
/* 二段跳的空中气浪：脚下一圈向外炸开的气环。
   纯粒子，不新增系统 —— 豆包出的图集里刻意没让它画特效（特效会变成独立色块，
   分水岭切片会把它当成额外帧）。 */
function spawnAirBurst(x, y) {
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    particles.push({
      x: x + Math.cos(a) * 6, y: y - 8 + Math.sin(a) * 4.5,
      vx: Math.cos(a) * 2.8, vy: Math.sin(a) * 2.2 + 0.3,
      life: 15, col: i % 3 === 0 ? '#DFF3FF' : (i % 3 === 1 ? '#7FD6FF' : '#4FA8D8'), s: 2
    });
  }
}
/* 格挡火花：斧面上炸开一小簇白青色火星，朝来袭方向弹回去 */
function spawnBlockFx(x, y, dir) {
  for (let i = 0; i < 14; i++) {
    const spread = rnd(-0.9, 0.9), sp = rnd(1.6, 4.4);
    particles.push({
      x: x + rnd(-3, 3), y: y + rnd(-6, 6),
      vx: -dir * Math.cos(spread) * sp,
      vy: Math.sin(spread) * sp - 0.8,
      life: 13 + Math.random() * 10,
      col: i % 3 === 0 ? '#FFFFFF' : (i % 3 === 1 ? '#9BE4FF' : '#5FA8FF'),
      s: 2
    });
  }
}
function spawnHitFx(x, y, big, dir) {
  const n = big ? 22 : 12;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(1, big ? 6 : 3.6);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6,
      life: big ? 26 : 16, col: i % 3 === 0 ? '#fff' : (i % 3 === 1 ? C.redL : '#FFD9A0'),
      s: big ? 2 : 1 });
  }
  // 集中线
  slashes.push({ x, y, t: 0, life: big ? 14 : 9, big, dir });
}

/* ==================================================================
   雷霆天怒 —— 从主角身上爆开的雷暴
   ================================================================== */
let storm = null;

function boltPts(x0, y0, x1, y1, segs, jit) {
  const pts = [[x0, y0]];
  for (let i = 1; i < segs; i++) {
    const u = i / segs;
    const w = 1 - Math.abs(u - 0.5) * 0.5;            // 中段抖得最凶，两头收住
    pts.push([x0 + (x1 - x0) * u + (Math.random() * 2 - 1) * jit * w,
              y0 + (y1 - y0) * u + (Math.random() * 2 - 1) * jit * 0.5]);
  }
  pts.push([x1, y1]);
  return pts;
}
function strokePts(g, pts) {
  g.beginPath();
  g.moveTo(Math.round(pts[0][0]), Math.round(pts[0][1]));
  for (let i = 1; i < pts.length; i++) g.lineTo(Math.round(pts[i][0]), Math.round(pts[i][1]));
  g.stroke();
}
/* 四层描边：外圈蓝雾 → 中层冷蓝 → 内层亮青 → 芯线纯白。
   全部用 lighter 混合，叠起来才有"发光"而不是"画了根线"的观感。 */
function drawBolt(g, pts, k, a) {
  g.globalCompositeOperation = 'lighter';
  g.strokeStyle = 'rgba(56,124,255,'  + (0.20 * a) + ')'; g.lineWidth = 10 * k; strokePts(g, pts);
  g.strokeStyle = 'rgba(124,192,255,' + (0.40 * a) + ')'; g.lineWidth = 4.6 * k; strokePts(g, pts);
  g.strokeStyle = 'rgba(222,244,255,' + (0.72 * a) + ')'; g.lineWidth = 2.0 * k; strokePts(g, pts);
  g.strokeStyle = 'rgba(255,255,255,' + (0.95 * a) + ')'; g.lineWidth = 0.9 * k; strokePts(g, pts);
  g.globalCompositeOperation = 'source-over';
}

function spawnStorm(x, y, dir, len) {
  storm = { t: 0, x, y, dir, len, pts: null };
  feel.shakeIt(26); feel.flash = 1;
  audio.thunder();
  spawnDust(x, y, 18, 1.8);
}

function updateStorm() {
  if (!storm) return;
  storm.t++;
  const s = storm;
  if (s.t > 60) { storm = null; return; }
  if (s.t % 3 === 0 || !s.pts) {
    // 每 3 帧重掷一次几何。每帧重掷只是噪点闪烁，看不出"闪电"的形状。
    const P2 = [];
    P2.push({ k: 1.7, p: boltPts(s.x + rnd(-16, 16), s.y - 300, s.x + rnd(-8, 8), s.y, 15, 15) });
    for (let i = 0; i < 3; i++)                       // 分叉
      P2.push({ k: 1.0, p: boltPts(s.x + rnd(-18, 18), s.y - rnd(140, 290),
                                   s.x + rnd(-90, 90), s.y - rnd(0, 130), 9, 22) });
    for (let i = 0; i < 5; i++) {                     // 铺满半个屏幕的水平电弧
      const ex = s.x + s.dir * rnd(s.len * 0.5, s.len);
      P2.push({ k: 1.2, p: boltPts(s.x, s.y - rnd(24, 86), ex, s.y - rnd(2, 96), 13, 20) });
    }
    P2.push({ k: 1.5, p: boltPts(s.x, s.y - 2, s.x + s.dir * s.len * 0.9, s.y + rnd(-3, 5), 11, 11) });
    s.pts = P2;
  }
  if (s.t % 2 === 0 && s.t < 34) {
    for (let i = 0; i < 3; i++) {
      const ang = rnd(0, Math.PI * 2), sp = rnd(1.4, 5.2);
      particles.push({ x: s.x + rnd(-10, 10), y: s.y - rnd(0, 70),
        vx: Math.cos(ang) * sp + s.dir * 1.6, vy: Math.sin(ang) * sp - 0.8,
        life: 10 + Math.random() * 10, col: i % 2 ? '#DFF3FF' : '#6FB6FF', s: 2 });
    }
  }
}

function drawStorm(g) {
  const s = storm, t = s.t;
  const a = t < 5 ? t / 5 : (t > 44 ? Math.max(0, (60 - t) / 16) : 1);
  if (a <= 0 || !s.pts) return;
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const b of s.pts) drawBolt(g, b.p, b.k, a);

  // 脚下向外翻的冲击环
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const u = Math.min(1, t / (16 + i * 7));
    g.globalAlpha = Math.max(0, (1 - u)) * 0.65 * a;
    g.strokeStyle = i === 0 ? '#EAF6FF' : '#5FA8FF';
    g.lineWidth = 4 - i;
    g.beginPath();
    g.ellipse(s.x, s.y + 2, 24 + u * s.len * 0.62, 7 + u * 28, 0, 0, Math.PI * 2);
    g.stroke();
  }
  g.globalAlpha = 1;
  // 中心过曝
  const R = 96;
  const gr = g.createRadialGradient(s.x, s.y - 44, 4, s.x, s.y - 44, R);
  gr.addColorStop(0,    'rgba(255,255,255,' + (0.80 * a) + ')');
  gr.addColorStop(0.34, 'rgba(150,215,255,' + (0.42 * a) + ')');
  gr.addColorStop(1,    'rgba(56,124,255,0)');
  g.fillStyle = gr;
  g.fillRect(s.x - R, s.y - 44 - R, R * 2, R * 2);
  g.restore();
}

/* ==================================================================
   战斗结算
   ================================================================== */
function resolveCombat() {
  const box = player.attackBox;
  const a = player.atk;
  const multi = !!(a && a.multi);

  if (box && a && player.activeFrames && (multi || !player.hasHit)) {
    let landed = 0, lastE = null;
    for (const e of enemies) {
      if (e.dead || !hit(box, e.hitbox)) continue;
      if (multi && player.atkHits.has(e)) continue;
      if (multi) player.atkHits.add(e);

      e.hurt(Math.round(a.dmg * player.atkMul), player.facing * (a.kb || 3), a.lift || 0);
      player.energy = clamp(player.energy + (a.hitE || 0), 0, 100);
      spawnHitFx((e.cx + player.cx) / 2, e.y - e.h * 0.6, a.fx === 'big' || a.fx === 'ult', player.facing);
      landed++; lastE = e;
      if (!multi) { player.hasHit = true; break; }
    }
    if (landed) {
      feel.freeze(a.stop);
      feel.shakeIt(a.shake);
      feel.punch(a.punch);
      if (a.snd === 'heavy') { audio.heavyHit(); audio.metalClang(); }
      else if (a.snd === 'boom') { audio.hitBig(); }
      else audio.lightHit();
    }
  }

  if (multi && player.atkT === a.startup) {
    feel.flash = 1;
    // 判定帧起点 = 天雷落地。演出（立绘/书法字）刚好在前摇里演完。
    spawnStorm(player.cx, player.y, player.facing, ATK.ult.hb.w);
  }
  if (player.atkName === 'ult' && player.activeFrames) feel.shakeIt(8);

  for (const w of waves) {
    if (w.dead) continue;
    for (const e of enemies) {
      if (e.dead || w.hitSet.has(e)) continue;
      if (!hit(w.box, e.hitbox)) continue;
      w.hitSet.add(e);
      e.hurt(Math.round(22 * player.atkMul), w.dir * 7, 0);
      feel.freeze(3); feel.shakeIt(5); feel.punch(0.03);
      audio.lightHit();
      spawnHitFx(e.cx, e.y - e.h / 2, false, w.dir);
      player.energy = clamp(player.energy + 4, 0, 100);
    }
  }
}

/* ==================================================================
   城镇
   ================================================================== */
const portals = [
  { i:0, x:120, y:170, w:56, h:76, label:'雨夜旷野', col:C.blue },
  { i:1, x:212, y:170, w:56, h:76, label:'幽蓝洞窟', col:'#4FA8D8' },
  { i:2, x:304, y:170, w:56, h:76, label:'赤核殿堂', col:C.red }
];
let townPlayer = { x:194, y:246, facing:1, walk:0, panel:false, sel:0, flash:0 };

function enterTown() {
  gameState = 'town';
  townPlayer.panel = false;
  townPlayer.x = 194; townPlayer.facing = 1; townPlayer.walk = 0;
  waves = []; particles = []; shocks = []; slashes = []; eShots = []; pickups = [];
  superFx.on = false; superFx.fade = 0; feel.flash = 0;
}

/* ==================================================================
   主循环
   ================================================================== */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  perfTick(now - last);
  acc += Math.min(now - last, 100);
  last = now;
  let stepped = 0;
  while (acc >= STEP) { update(); acc -= STEP; stepped++; }
  render();

  // ⚠️ 只在"真的跑过 update"之后才清输入。
  // 原来是无条件清 —— 144Hz 屏上 rAF 每秒 144 次、update 只有 60 次，
  // 那些没轮到 update 的帧会把 keyPressed 直接抹掉，实测超过一半的按键
  // 从头到尾没被处理过。这就是"按了没反应、不跟手"的根因。
  if (stepped > 0 && feel.hitstop <= 0) {
    for (const k in keyPressed) delete keyPressed[k];
    pointerPressed = false;
  }
  audio.pumpMusic();
}

function update() {
  perfT++;
  feel.update();

  if (feel.hitstop > 0) { feel.hitstop--; updateFx(); return; }

  if (transition > 0) transition--;
  if (roundFx > 0) roundFx--;
  if (koFx > 0) koFx--;
  if (superFx.on) {
    superFx.t++;
    // 演出只在前摇里放，判定帧前必须收掉 —— 否则会盖住真正的大招
    if (!player.attacking || player.atkName !== 'ult' || player.atkT >= 15) {
      superFx.on = false; superFx.fade = 1;
    }
  } else if (superFx.fade > 0) {
    superFx.fade = Math.max(0, superFx.fade - 0.13);
  }

  if (gameState === 'title') {
    if (keyPressed.KeyJ || keyPressed.KeyK || keyPressed.Space || keyPressed.Enter || pointerPressed) enterTown();
    if (roundFx > 0) roundFx--;
    return;
  }

  if (gameState === 'town') {
    /* ---- 强化面板：安全区里按 J 打开 ---- */
    if (townPlayer.panel) {
      if (keyPressed.KeyA) { townPlayer.sel = (townPlayer.sel + UP_KEYS.length - 1) % UP_KEYS.length; audio.step(); }
      if (keyPressed.KeyD) { townPlayer.sel = (townPlayer.sel + 1) % UP_KEYS.length; audio.step(); }
      if (keyPressed.KeyK || keyPressed.KeyS || keyPressed.Escape) { townPlayer.panel = false; audio.step(); }
      if (keyPressed.KeyJ || pointerPressed) {
        const key = UP_KEYS[townPlayer.sel], info = UP_INFO[key];
        if (progress.points > 0 && progress.up[key] < info.max) {
          progress.up[key]++; progress.points--; saveProgress(progress);
          if (key === 'hp') player.hp = player.maxHp;       // 加血上限顺便回满
          audio.ultCharge(); townPlayer.flash = 12;
        } else {
          audio.thump(180, 90, 0.12, 0.10);
        }
      }
      if (townPlayer.flash > 0) townPlayer.flash--;
      pointerPressed = false;
      return;
    }
    if (keyPressed.KeyJ || pointerPressed) { townPlayer.panel = true; townPlayer.sel = 0; pointerPressed = false; return; }

    let ax = 0;
    if (keys.KeyA) ax = -1;
    if (keys.KeyD) ax = 1;
    if (ax) { townPlayer.x += ax * 1.5; townPlayer.facing = ax; townPlayer.walk += 0.25; }
    else townPlayer.walk *= 0.9;
    townPlayer.x = clamp(townPlayer.x, 60, VW - 60);

    for (const p of portals) {
      if (p.i > progress.maxLevel) continue;
      const pb = { x:p.x, y:p.y, w:p.w, h:p.h };
      const tb = { x:townPlayer.x - 11, y:townPlayer.y - 62, w:22, h:62 };
      if (hit(pb, tb)) { loadLevel(p.i); return; }
    }
    return;
  }

  if (gameState === 'playing') {
    player.update(level);
    for (const e of enemies) e.update(level, player);
    resolveCombat();
    for (const w of waves) w.update();
    waves = waves.filter(w => !w.dead);
    for (const sh of eShots) sh.update();
    eShots = eShots.filter(sh => !sh.dead);
    updatePickups();
    // 炮台弹丸 / BOSS 弹幕打到玩家。架着盾就只吃一点点真伤，不击退也不僵直。
    for (const sh of eShots) {
      if (hit(sh.box, player.hitbox)) {
        sh.dead = true;
        if (player.guarding) player.blockHit(12, sh.x);
        else player.hurt(12, sign(player.cx - sh.x) || 1);
      }
    }
    camera.update(player, LEVEL_W);

    if (feel.hitstop <= 0 && enemies.length > 0 && enemies.every(e => e.dead)) {
      if (levelIndex + 1 > progress.maxLevel) {
        progress.maxLevel = Math.min(levelIndex + 1, LEVELS.length - 1);
        saveProgress(progress);
      }
      gameState = 'cleared'; transition = 100; koFx = 46; audio.ko();
    } else if (player.state === 'dead') {
      gameState = 'dead'; transition = 80;
    }
  } else if (gameState === 'cleared') {
    if (transition < 44 && (keyPressed.KeyJ || keyPressed.KeyK || keyPressed.Space || keyPressed.Enter || pointerPressed)) enterTown();
  } else if (gameState === 'dead') {
    if (transition <= 0) loadLevel(levelIndex);
  }

  updateFx();

  // 音乐跟着场景走（标题 / 安全区 / 每关各一首）
  audio.playMusic(gameState === 'title' ? 'title'
                : gameState === 'town'  ? 'town'
                : (level && level.theme) || 'field');
}

function updateFx() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if (p.dust) { p.vy += 0.06; p.vx *= 0.93; p.vy *= 0.94; }
    else { p.vy += 0.24; p.vx *= 0.965; }
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i]; s.t++; s.r += 2.8; s.life--;
    if (s.life <= 0) shocks.splice(i, 1);
  }
  for (let i = slashes.length - 1; i >= 0; i--) {
    const s = slashes[i]; s.t++; s.life--;
    if (s.life <= 0) slashes.splice(i, 1);
  }
  updateStorm();
}

/* ==================================================================
   渲染
   ================================================================== */
function render() {
  vctx.imageSmoothingEnabled = false;
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  if (gameState === 'title')     renderTitle(vctx);
  else if (gameState === 'town') renderTown(vctx);
  else                           renderWorld(vctx);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(vcanvas, 0, 0, VW, VH, 0, 0, canvas.width, canvas.height);
  renderUI();

  if (feel.flash > 0) {
    ctx.fillStyle = 'rgba(255,244,238,' + (feel.flash * 0.34) + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  // 超必杀：全屏压暗 + 频闪 + 立绘滑入 + 红色书法字
  if (superFx.on) drawSuperPresentation(ctx);
}

/* ---------------- 世界 ---------------- */
function renderWorld(g) {
  const ox = camera.ox, oy = camera.oy;
  drawSky(g, level);
  drawSceneBg(g, level.theme, ox);

  g.save();
  // 动态变焦：绕世界视口中心缩放
  const z = camera.zoom;
  if (z !== 1) {
    g.translate(VW / 2, VH / 2);
    g.scale(z, z);
    g.translate(-VW / 2, -VH / 2);
  }
  g.translate(-ox, -oy);
  drawTerrain(g, level, ox);
  for (const s of shocks) drawShock(g, s);
  for (const e of enemies) e.draw(g, level);
  player.draw(g, level);
  for (const w of waves) w.draw(g);
  for (const sh of eShots) sh.draw(g);
  drawPickups(g);
  if (storm) drawStorm(g);
  drawParticles(g);
  drawSlashes(g);
  g.restore();

  drawRain(g, level);
  drawVignette(g);

  if (gameState === 'cleared') drawKOPanel(g);
  if (gameState === 'dead')    drawDeadPanel(g);
  if (gameState === 'playing' && roundFx > 0) drawRoundStart(g);
}

function drawSky(g, lv) {
  const grad = g.createLinearGradient(0, 0, 0, VH);
  if (lv.theme === 'field')      { grad.addColorStop(0,'#0D1220'); grad.addColorStop(.55,'#1A2036'); grad.addColorStop(1,'#241E2C'); }
  else if (lv.theme === 'cave')  { grad.addColorStop(0,'#080A12'); grad.addColorStop(.60,'#101A2C'); grad.addColorStop(1,'#0A1220'); }
  else                           { grad.addColorStop(0,'#160C10'); grad.addColorStop(.50,'#241014'); grad.addColorStop(1,'#120A0C'); }
  g.fillStyle = grad; g.fillRect(0, 0, VW, VH);
}

function drawTerrain(g, lv, ox) {
  // 地面压暗 + 顶部一道亮边，贴合生成背景的色调
  const T = {
    field: { face:'#161C28', face2:'#0E131C', edge:'#4FA8D8', edge2:'rgba(79,168,216,0.45)' },
    cave:  { face:'#101A2C', face2:'#0A1220', edge:'#4FA8D8', edge2:'rgba(79,168,216,0.35)' },
    hall:  { face:'#1C0E12', face2:'#12080B', edge:C.red,     edge2:'rgba(196,48,60,0.45)' }
  }[lv.theme];

  const x0 = ox - 100, x1 = ox + VW + 100;
  for (const p of lv.platforms) {
    if (p.x + p.w < x0 || p.x > x1) continue;
    drawGroundTex(g, lv.theme, p);
    // 顶面高光：贴图自带的地表纹理之上再压一道亮边，界面上才看得出"能站"
    g.fillStyle = T.edge;  g.fillRect(p.x, p.y - 1, p.w, 2.5);
    g.fillStyle = T.edge2; g.fillRect(p.x, p.y - 3, p.w, 1.5);
    // 左右边缘压暗，做出体积
    g.fillStyle = 'rgba(0,0,0,0.45)';
    g.fillRect(p.x, p.y, 2, VH - p.y + 60);
    g.fillRect(p.x + p.w - 2, p.y, 2, VH - p.y + 60);
  }
  for (const hz of (lv.hazards || [])) {
    if (hz.x + hz.w < x0 || hz.x > x1) continue;
    g.fillStyle = 'rgba(0,0,0,0.68)';
    g.fillRect(hz.x, hz.y + 6, hz.w, VH - hz.y + 60);
    g.fillStyle = 'rgba(196,48,60,0.28)';
    g.fillRect(hz.x, hz.y + 6, hz.w, 3);
  }

  // BOSS 场地入口：地面一条标线 + 两根矮门柱（纯视觉，不是墙，不挡路）
  if (lv.bossArena) {
    const a = lv.bossArena;
    const gc = lv.theme === 'hall' ? C.red : '#4FA8D8';
    g.fillStyle = gc;
    g.globalAlpha = 0.55;
    g.fillRect(a.x, 234, a.w, 2);
    g.globalAlpha = 1;
    if (a.x > x0 - 60 && a.x < x1 + 60) {
      g.fillStyle = gc;
      g.fillRect(a.x - 7, 202, 4, 34);
      g.fillRect(a.x + 3, 202, 4, 34);
      g.globalAlpha = 0.35;
      g.fillRect(a.x - 7, 202, 14, 4);
      g.globalAlpha = 1;
    }
  }
}

function drawRain(g, lv) {
  if (lv.theme === 'field') {
    g.strokeStyle = 'rgba(143,214,245,0.20)'; g.lineWidth = 1;
    for (let i = 0; i < 70; i++) {
      const seed = i * 97.3;
      const rx = (seed * 7 + perfT * 5.5) % (VW + 120) - 60;
      const ry = (seed * 13 + perfT * 12.5) % (VH + 60) - 30;
      g.beginPath();
      g.moveTo(Math.round(rx), Math.round(ry));
      g.lineTo(Math.round(rx - 3), Math.round(ry + 9));
      g.stroke();
    }
    g.fillStyle = 'rgba(143,214,245,0.05)'; g.fillRect(0, 232, VW, 10);
  } else if (lv.theme === 'hall') {
    for (let i = 0; i < 46; i++) {
      const seed = i * 61.7;
      const rx = (seed * 11 + perfT * 0.7) % (VW + 80) - 40;
      const ry = 240 - ((seed * 17 + perfT * 1.9) % 210);
      g.fillStyle = (i % 3) ? 'rgba(255,107,61,0.55)' : 'rgba(196,48,60,0.55)';
      g.fillRect(Math.round(rx), Math.round(ry), 2, 2);
    }
  }
}

function drawVignette(g) {
  const vg = g.createRadialGradient(VW / 2, VH / 2, 90, VW / 2, VH / 2, 300);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vg; g.fillRect(0, 0, VW, VH);
}

function drawShock(g, s) {
  const a = s.life / 28;
  g.save();
  g.globalAlpha = a * 0.9; g.strokeStyle = C.blueL; g.lineWidth = 3.5;
  g.beginPath(); g.ellipse(s.x, s.y, s.r, s.r * 0.40, 0, 0, Math.PI * 2); g.stroke();
  g.globalAlpha = a * 0.45; g.strokeStyle = '#fff'; g.lineWidth = 1.8;
  g.beginPath(); g.ellipse(s.x, s.y, s.r * 0.7, s.r * 0.28, 0, 0, Math.PI * 2); g.stroke();
  g.restore();
}
function drawParticles(g) {
  for (const p of particles) {
    g.globalAlpha = clamp(p.life / (p.dust ? 26 : 20), 0, 1) * (p.dust ? 0.75 : 1);
    g.fillStyle = p.col;
    g.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  g.globalAlpha = 1;
}
/* 命中集中线：从命中点向外放射，拳皇式 */
function drawSlashes(g) {
  for (const s of slashes) {
    const a = s.life / (s.big ? 14 : 9);
    g.save();
    g.globalAlpha = a * 0.85;
    g.translate(s.x, s.y);
    const n = s.big ? 12 : 7;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + s.t * 0.06;
      const r0 = (s.big ? 12 : 7) + (1 - a) * (s.big ? 34 : 20);
      const r1 = r0 + (s.big ? 16 : 10) * a;
      g.strokeStyle = i % 2 ? '#fff' : (s.big ? C.redL : C.blueL);
      g.lineWidth = s.big ? 2.5 : 1.6;
      g.beginPath();
      g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
      g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
      g.stroke();
    }
    g.restore();
  }
}

function renderTown(g) {
  const grad = g.createLinearGradient(0, 0, 0, VH);
  grad.addColorStop(0, '#0A0E18'); grad.addColorStop(0.6, '#14192B'); grad.addColorStop(1, '#1C1420');
  g.fillStyle = grad; g.fillRect(0, 0, VW, VH);
  drawSceneBg(g, 'town', 0);                       // 城镇用霓虹街道那张背景
  drawGroundTex(g, 'field', { x: 0, y: 240, w: VW });   // 地面复用野外那条湿路面
  g.fillStyle = '#4FA8D8'; g.fillRect(0, 239, VW, 2.5);
  g.fillStyle = 'rgba(79,168,216,0.45)'; g.fillRect(0, 237, VW, 1.5);

  for (const p of portals) {
    const unlocked = p.i <= progress.maxLevel;
    const pulse = 0.5 + Math.sin(perfT * 0.07 + p.i) * 0.5;
    g.save();
    g.globalAlpha = unlocked ? (0.5 + pulse * 0.5) : 0.22;
    g.fillStyle = p.col; g.fillRect(p.x - 3, p.y - 3, p.w + 6, p.h + 6);
    g.globalAlpha = unlocked ? 0.9 : 0.25;
    g.fillStyle = '#0B0D12'; g.fillRect(p.x, p.y, p.w, p.h);
    g.globalAlpha = unlocked ? (0.35 + pulse * 0.4) : 0.15;
    g.fillStyle = p.col;
    for (let i = 0; i < p.h; i += 6) g.fillRect(p.x + 2, p.y + ((i + perfT * 1.3) % p.h), p.w - 4, 2);
    g.restore();

    g.textAlign = 'center';
    g.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.30)';
    g.font = '9px "Microsoft YaHei",sans-serif';
    g.fillText(p.label, p.x + p.w / 2, p.y - 8);
    if (!unlocked) {
      g.fillStyle = 'rgba(255,255,255,0.28)';
      g.font = '8px "Microsoft YaHei",sans-serif';
      g.fillText('未 解 锁', p.x + p.w / 2, p.y + p.h + 11);
    }
  }

  // 城镇里的主角（同一套骨骼，站着呼吸 + 走动）
  const tp = townPlayer;
  drawShadow(g, tp.x, tp.y, 26, [{x:-999,y:246,w:9999}], 1);
  drawSpr(g, 'idle', Math.floor(perfT / 15) % 6, tp.x, tp.y, tp.facing);
  townPlayer._lastX = tp.x;

  /* ---- 强化面板 ---- */
  if (tp.panel) {
    const PX = 96, PY = 58, PW = VW - PX * 2, PH = 150;
    g.save();
    g.fillStyle = 'rgba(4,6,10,0.78)'; g.fillRect(0, 0, VW, VH);

    g.fillStyle = 'rgba(10,16,26,0.97)'; g.fillRect(PX, PY, PW, PH);
    g.strokeStyle = C.blue; g.lineWidth = 1.5; g.strokeRect(PX + 0.5, PY + 0.5, PW - 1, PH - 1);
    g.fillStyle = 'rgba(79,168,216,0.14)'; g.fillRect(PX, PY, PW, 20);
    g.fillStyle = '#9FE4FF'; g.font = 'bold 12px "Microsoft YaHei",sans-serif';
    g.textAlign = 'left';
    g.fillText('强 化', PX + 10, PY + 14);
    g.textAlign = 'right';
    g.font = '9px "Microsoft YaHei",sans-serif';
    g.fillStyle = progress.points > 0 ? '#FFD9A0' : 'rgba(255,255,255,0.35)';
    g.fillText('剩余属性点 ' + progress.points, PX + PW - 10, PY + 14);

    UP_KEYS.forEach((key, i) => {
      const info = UP_INFO[key];
      const lv = progress.up[key];
      const maxed = lv >= info.max;
      const y = PY + 34 + i * 30;
      const on = i === tp.sel;
      if (on) {
        g.fillStyle = 'rgba(79,168,216,0.20)'; g.fillRect(PX + 8, y - 4, PW - 16, 26);
        g.strokeStyle = C.blueL; g.lineWidth = 1; g.strokeRect(PX + 8.5, y - 3.5, PW - 17, 25);
      }
      g.textAlign = 'left';
      g.fillStyle = on ? '#fff' : 'rgba(255,255,255,0.66)';
      g.font = 'bold 10px "Microsoft YaHei",sans-serif';
      g.fillText(info.name, PX + 18, y + 12);
      g.font = '9px "Microsoft YaHei",sans-serif';
      g.fillStyle = maxed ? '#FFD9A0' : (on ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.42)');
      g.fillText('Lv ' + lv + (maxed ? ' · 已满' : ''), PX + 92, y + 12);

      // 等级格子
      const bx = PX + 150, bw = PW - 176;
      g.fillStyle = 'rgba(6,10,16,0.9)'; g.fillRect(bx, y + 4, bw, 8);
      g.fillStyle = maxed ? '#FFD9A0' : C.blueL;
      g.fillRect(bx, y + 4, bw * (lv / info.max), 8);
      g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
      g.strokeRect(bx + 0.5, y + 4.5, bw - 1, 7);

      g.textAlign = 'right';
      g.font = '9px "Microsoft YaHei",sans-serif';
      g.fillStyle = lv > 0 ? '#9FE4FF' : 'rgba(255,255,255,0.3)';
      g.fillText(lv > 0 ? info.fmt(lv) : '—', PX + PW - 18, y + 12);
    });

    g.textAlign = 'center';
    g.font = '8px "Microsoft YaHei",sans-serif';
    g.fillStyle = 'rgba(255,255,255,0.5)';
    g.fillText('A / D 选择      J 强化      S 关闭', VW / 2, PY + PH - 10);
    g.restore();
  }

  g.textAlign = 'center';
  g.fillStyle = 'rgba(255,255,255,0.6)'; g.font = '9px "Microsoft YaHei",sans-serif';
  g.fillText(tp.panel ? '' : ('A / D 走动进入关卡   ·   J 打开强化' +
    (progress.points > 0 ? '（有 ' + progress.points + ' 点未分配）' : '')), VW / 2, 132);
}

/* ==================================================================
   超必杀演出（拳皇式：压暗 + 频闪 + 立绘滑入 + 红色书法字）
   ================================================================== */
function drawSuperPresentation(c) {
  const t = superFx.t;                     // 从 ult 起手开始计帧
  const S = SCALE;
  const dur = ATK.ult.startup;             // 前摇期间演完
  const p = clamp(t / dur, 0, 1);
  const A0 = superFx.on ? 1 : superFx.fade;  // 收尾淡出
  c.save();
  c.globalAlpha = A0;

  // 1) 压暗，只留角色周围一圈亮
  c.save();
  c.fillStyle = 'rgba(4,5,9,' + (0.62 * Math.min(1, t / 6)) + ')';
  c.fillRect(0, 0, canvas.width, canvas.height);

  const px = (player.cx - camera.ox) * S * camera.zoom;
  const py = (player.y - camera.oy - 40) * S * camera.zoom;
  const g2 = c.createRadialGradient(px, py, 30 * S, px, py, 190 * S);
  g2.addColorStop(0, 'rgba(255,255,255,0)');
  g2.addColorStop(1, 'rgba(255,255,255,0)');
  c.globalCompositeOperation = 'destination-out';
  const hole = c.createRadialGradient(px, py, 20 * S, px, py, 150 * S);
  hole.addColorStop(0, 'rgba(0,0,0,0.85)');
  hole.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = hole;
  c.fillRect(0, 0, canvas.width, canvas.height);
  c.globalCompositeOperation = 'source-over';
  c.restore();

  // 2) 频闪（越接近出招越密）
  const beat = Math.sin(t * (0.5 + p * 0.9));
  if (beat > 0.6) {
    c.fillStyle = 'rgba(255,240,240,' + (0.16 + 0.24 * p) + ')';
    c.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 3) 立绘从左侧滑入
  if (spriteReady) {
    const ih = canvas.height * 0.92;
    const iw = ih * (SPRITE_IMG.naturalWidth / SPRITE_IMG.naturalHeight);
    const slide = EASE.out(Math.min(1, t / 14));
    const x = -iw + (canvas.width * 0.06 + iw) * slide;
    const y = canvas.height - ih;
    c.save();
    // 红色斜切底
    c.globalAlpha = 0.55;
    c.fillStyle = '#0B2A5E';
    c.beginPath();
    c.moveTo(x - 40, 0); c.lineTo(x + iw * 0.9, 0);
    c.lineTo(x + iw * 0.9 - 70, canvas.height); c.lineTo(x - 40, canvas.height);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
    c.drawImage(SPRITE_IMG, x, y, iw, ih);
    c.restore();
  }

  // 4) 红色书法字（从右侧冲进来）
  const tx = EASE.snap(Math.min(1, t / 16));
  const ox2 = (1 - tx) * canvas.width * 0.5;
  c.save();
  // 书法字后面劈几道电弧，跟场上的雷暴呼应
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    c.strokeStyle = i % 2 ? 'rgba(180,225,255,0.55)' : 'rgba(255,255,255,0.4)';
    c.lineWidth = (1.6 + i * 0.6) * S;
    c.beginPath();
    let px2 = canvas.width * 0.34 + i * 40 * S, py2 = canvas.height * 0.10;
    c.moveTo(px2, py2);
    for (let k = 0; k < 7; k++) {
      px2 += rnd(-26, 26) * S; py2 += canvas.height * 0.105;
      c.lineTo(px2, py2);
    }
    c.stroke();
  }
  c.globalCompositeOperation = 'source-over';
  c.textAlign = 'right';
  c.globalAlpha = clamp(t / 8, 0, 1);
  c.font = 'bold ' + (38 * S) + 'px "Microsoft YaHei",sans-serif';
  c.lineWidth = 5 * S; c.strokeStyle = '#fff';
  c.strokeText('雷霆天怒', canvas.width - 26 * S + ox2, canvas.height * 0.42);
  c.fillStyle = C.red;
  c.fillText('雷霆天怒', canvas.width - 26 * S + ox2, canvas.height * 0.42);
  c.font = 'bold ' + (11 * S) + 'px "Microsoft YaHei",sans-serif';
  c.fillStyle = 'rgba(255,255,255,0.85)';
  c.fillText('THUNDER  WRATH', canvas.width - 26 * S + ox2, canvas.height * 0.42 + 16 * S);
  c.restore();
  c.restore();
}

/* ==================================================================
   HUD（拳皇式：左右大血条 + 名牌 + 底部气功槽）
   ================================================================== */
function renderUI() {
  if (gameState === 'title') return;
  const S = SCALE, W = canvas.width, H = canvas.height;

  /* ---- 左上：立绘牌 + 血条 ---- */
  const barX = 74 * S, barY = 14 * S, barW = 190 * S, barH = 13 * S;

  // 名牌底板
  ctx.fillStyle = 'rgba(6,8,12,0.82)';
  ctx.fillRect(10 * S, 8 * S, 62 * S, 52 * S);
  // 立绘小像
  if (spriteReady) {
    const ih = 46 * S, iw = ih * (SPRITE_IMG.naturalWidth / SPRITE_IMG.naturalHeight);
    ctx.save();
    ctx.beginPath(); ctx.rect(13 * S, 11 * S, 56 * S, 46 * S); ctx.clip();
    ctx.drawImage(SPRITE_IMG, 13 * S + (56 * S - iw) / 2, 11 * S, iw, ih);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(196,48,60,0.8)'; ctx.lineWidth = 1.5 * S;
  ctx.strokeRect(13 * S + 0.5, 11 * S + 0.5, 56 * S, 46 * S);

  // 血条：暗底 → 黄色余量 → 红条（拳皇是黄/红两段）
  ctx.fillStyle = 'rgba(6,8,12,0.85)';
  ctx.fillRect(barX - 3 * S, barY - 3 * S, barW + 6 * S, barH + 6 * S);
  ctx.fillStyle = '#2A1216'; ctx.fillRect(barX, barY, barW, barH);
  const hpR = clamp(player.hp / player.maxHp, 0, 1);
  ctx.fillStyle = '#E8B23C'; ctx.fillRect(barX, barY, barW * hpR, barH);   // 缓动黄
  ctx.fillStyle = C.hp;      ctx.fillRect(barX, barY, barW * hpR, barH * 0.62);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(barX, barY, barW * hpR, Math.max(1, barH * 0.28));
  // 斜切分段线
  ctx.fillStyle = 'rgba(6,8,12,0.55)';
  for (let i = 1; i < 10; i++) ctx.fillRect(barX + barW * i / 10, barY, 1 * S, barH);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5 * S;
  ctx.strokeRect(barX - 0.5, barY - 0.5, barW + 1, barH + 1);

  ctx.textAlign = 'left';
  ctx.font = 'bold ' + (11 * S) + 'px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('重 甲 兔 战 士', barX, barY - 6 * S);
  ctx.font = 'bold ' + (9 * S) + 'px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#FFD9A0';
  ctx.fillText(Math.max(0, Math.ceil(player.hp)) + '', barX + barW + 8 * S, barY + barH - 1 * S);

  /* ---- 右上：关卡 / BOSS ---- */
  const boss = enemies.find(e => e.isBoss && !e.dead);
  const mini = enemies.find(e => e.miniBoss && !e.dead);
  ctx.textAlign = 'right';
  ctx.font = 'bold ' + (10 * S) + 'px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = C.redL;
  ctx.fillText(gameState === 'town' ? '安 全 区' : level.name, W - 14 * S, 18 * S);
  ctx.font = (8 * S) + 'px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.62)';
  if (gameState === 'playing' && !boss) {
    ctx.fillText('敌人剩余 ' + enemies.filter(e => !e.dead && !e.isBoss).length, W - 14 * S, 32 * S);
  } else if (gameState === 'town') {
    ctx.fillText('最新解锁 第 ' + (progress.maxLevel + 1) + ' 关', W - 14 * S, 32 * S);
  }

  /* ---- 未分配的属性点 ---- */
  if (progress.points > 0) {
    ctx.textAlign = 'right';
    ctx.font = 'bold ' + (9 * S) + 'px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#9FE4FF';
    ctx.fillText('\u2726 属性点 ' + progress.points + '\uff08回安全区强化\uff09', W - 14 * S, 60 * S);
  }

  /* ---- 右下：音乐开关状态 ---- */
  ctx.textAlign = 'right';
  ctx.font = (7.5 * S) + 'px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = audio.muted ? 'rgba(255,120,120,0.8)' : 'rgba(255,255,255,0.35)';
  ctx.fillText(audio.muted ? '\u266a 音乐已关 (M)' : '\u266a 音乐开 (M)', W - 14 * S, H - 8 * S);

  if (boss && gameState === 'playing') {
    const bw = W * 0.42, bx = W - bw - 74 * S, by = 40 * S;
    ctx.fillStyle = 'rgba(6,8,12,0.85)'; ctx.fillRect(bx - 3 * S, by - 3 * S, bw + 6 * S, 12 * S);
    ctx.fillStyle = '#2A1216'; ctx.fillRect(bx, by, bw, 7 * S);
    ctx.fillStyle = '#FF6B3D'; ctx.fillRect(bx, by, bw * clamp(boss.hp / boss.maxHp, 0, 1), 7 * S);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5 * S;
    ctx.strokeRect(bx - 0.5, by - 0.5, bw + 1, 7 * S + 1);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + (9 * S) + 'px "Microsoft YaHei",sans-serif';
    ctx.fillText(boss.tag || 'BOSS', W - 14 * S, by - 6 * S);
  }

  /* ---- 小 BOSS：血条短一截、冷蓝色，和大 BOSS 区分开 ---- */
  if (mini && gameState === 'playing') {
    // 大 BOSS 也在场时，小 BOSS 血条往下让一行，两条一起显示
    const bw = W * 0.28, bx = W - bw - 74 * S, by = (boss ? 64 : 40) * S;
    ctx.fillStyle = 'rgba(6,8,12,0.85)'; ctx.fillRect(bx - 3 * S, by - 3 * S, bw + 6 * S, 9 * S);
    ctx.fillStyle = '#131A28'; ctx.fillRect(bx, by, bw, 5 * S);
    ctx.fillStyle = '#6FD6FF'; ctx.fillRect(bx, by, bw * clamp(mini.hp / mini.maxHp, 0, 1), 5 * S);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5 * S;
    ctx.strokeRect(bx - 0.5, by - 0.5, bw + 1, 5 * S + 1);
    ctx.textAlign = 'right';
    ctx.font = 'bold ' + (9 * S) + 'px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#CDEBFF';
    ctx.fillText(mini.tag || '精英', W - 14 * S, by - 6 * S);
  }

  /* ---- 底部：气功槽 ---- */
  if (gameState !== 'town') {
    const gw = 150 * S, gh = 12 * S, gx = 16 * S, gy = H - 42 * S;   // 抬高一点，标题别压在地面线上
    ctx.fillStyle = 'rgba(6,8,12,0.85)';
    ctx.fillRect(gx - 3 * S, gy - 3 * S, gw + 6 * S, gh + 6 * S);
    ctx.fillStyle = C.enBG; ctx.fillRect(gx, gy, gw, gh);
    const eR = clamp(player.energy / 100, 0, 1);
    // 槽分成 3 段（50 / 100 两个节点）
    const grd = ctx.createLinearGradient(gx, 0, gx + gw, 0);
    grd.addColorStop(0, '#2A6A92'); grd.addColorStop(1, C.blueL);
    ctx.fillStyle = grd;
    ctx.fillRect(gx, gy, gw * eR, gh);
    ctx.fillStyle = 'rgba(6,8,12,0.7)';
    ctx.fillRect(gx + gw * 0.5, gy, 1.5 * S, gh);
    ctx.fillStyle = 'rgba(6,8,12,0.7)';
    ctx.fillRect(gx + gw * 0.25, gy, 1 * S, gh);
    ctx.fillRect(gx + gw * 0.75, gy, 1 * S, gh);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5 * S;
    ctx.strokeRect(gx - 0.5, gy - 0.5, gw + 1, gh + 1);

    ctx.textAlign = 'left';
    ctx.font = 'bold ' + (8 * S) + 'px "Microsoft YaHei",sans-serif';
    if (eR >= 1) {
      const bl = Math.sin(perfT * 0.2) > 0;
      ctx.fillStyle = bl ? '#FFE96B' : C.redL;
      ctx.fillText('MAX  气功就绪  J + K + L', gx, gy - 4 * S);
    } else if (eR >= 0.5) {
      ctx.fillStyle = C.blueL;
      ctx.fillText('可放气功波  L', gx, gy - 4 * S);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText('气 功 槽', gx, gy - 4 * S);
    }
  }
}

/* ==================================================================
   启动
   ================================================================== */
requestAnimationFrame(loop);
</script>
</body>
</html>
