/* ==========================================================================
   玉兔下凡 · 重甲兔战士   v2「拳皇风」
   —— 单文件像素风横版动作闯关（HTML5 Canvas + Web Audio，零外部依赖）

   三件事决定了"像不像格斗游戏"：

   ① 骨骼动画（流畅度的根）
      角色不再是"一堆会抖的方块"，而是 11 段可旋转关节：
      髋 → 躯干 → 头 → 耳朵，肩 → 上臂 → 前臂 → 手 → 斧头，髋 → 大腿 → 小腿 → 脚。
      每套动作都是若干"关键姿势"，帧间用缓动插值。
      这样才有拳皇那种 预备 → 发力 → 随势 → 收招 的完整弧线，
      而不是"挥一下、弹回去"。

   ② 硬黑描边 + 地面投影（物体感）
      每个形体先描一圈黑边再填色 —— 拳皇的招牌硬边剪影。
      每个角色脚下按射线找到真实地面，画一枚随高度缩放的椭圆影子 ——
      这一步能把"贴纸浮在空中"直接变成"站得住"。

   ③ 挤压拉伸 + 尘土 + 镜头
      起跳拉长、落地压扁、重击甩出去；落地扬尘、跑步扬尘；
      重击镜头推近、大招先拉后推。身体有惯性，世界才有质量。

   另附：超必杀演出（压暗 + 频闪 + 立绘滑入 + 红色书法字）、
        左右大血条 + 底部气功槽 + K.O. 演出、顿帧白闪剪影、命中集中线。
   ========================================================================== */

const VW = 480, VH = 270;
const BSCALE = 3;
const SCALE = BSCALE;
const DEG = Math.PI / 180;
// 全局动画节奏系数。>1 更慢。离散精灵帧和连续插值不一样，
// 原来那套速率直接把 4 帧跑步循环跑成了每秒 12 圈。
const ANIM_SPEED = 1.0;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

const vcanvas = document.createElement('canvas');
vcanvas.width = VW; vcanvas.height = VH;
const vctx = vcanvas.getContext('2d', { alpha: false });
vctx.imageSmoothingEnabled = false;

function resize() {
  canvas.width  = VW * BSCALE;
  canvas.height = VH * BSCALE;
  const s = Math.min((innerWidth - 20) / canvas.width, (innerHeight - 44) / canvas.height);
  canvas.style.width  = Math.round(canvas.width  * s) + 'px';
  canvas.style.height = Math.round(canvas.height * s) + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

/* 相邻帧交叉淡入 —— 精灵图每套只有几帧，硬切会一跳一跳的；
   在过渡区间里把前后两帧按相位叠起来，快速挥砍就出现自然的动态模糊。
   SPR_BLEND = false 可以退回到硬切。 */
const SPR_BLEND = true;
function drawSpr(g, anim, idx, ax, ay, facing, post) {
  const list = SPR_MAN[anim];
  if (!list || !sprReady) return;
  const last = list.length - 1;
  const i0 = Math.max(0, Math.min(last, Math.floor(idx)));
  const frac = SPR_BLEND ? Math.max(0, Math.min(1, idx - i0)) : 0;
  const i1 = Math.min(last, i0 + 1);
  const fr = list[i0];
  g.save();
  g.translate(Math.round(ax), Math.round(ay));
  g.scale(facing, 1);
  if (post) post(g);
  if (frac > 0.05 && i1 !== i0) {
    // 关键：**本体永远实心**，只在上面叠一层淡的下一位姿当拖影。
    // 两边都画半透明的话，本体被打虚、还会跟背景透出来，看着像重影而不是运动模糊。
    const f2 = list[i1];
    g.drawImage(SPR_IMG, fr.x, fr.y, fr.w, fr.h, fr.ox, fr.oy, fr.w, fr.h);
    g.globalAlpha = frac * 0.45;
    g.drawImage(SPR_IMG, f2.x, f2.y, f2.w, f2.h, f2.ox, f2.oy, f2.w, f2.h);
    g.globalAlpha = 1;
  } else {
    g.drawImage(SPR_IMG, fr.x, fr.y, fr.w, fr.h, fr.ox, fr.oy, fr.w, fr.h);
  }
  g.restore();
}

/* 带染色的精灵绘制。受击闪红 / 顿帧白闪必须在离屏小画布上做：
   直接在主画布上用 source-atop 会把整个世界一起染红。 */
const tintCv = document.createElement('canvas');
const tintCtx = tintCv.getContext('2d');
function drawSprTinted(g, anim, idx, ax, ay, facing, mode, post) {
  const list = SPR_MAN[anim];
  if (!list || !sprReady) return;
  if (!mode) { drawSpr(g, anim, idx, ax, ay, facing, post); return; }
  const fr = list[idx < 0 ? 0 : (idx >= list.length ? list.length - 1 : idx | 0)];
  if (tintCv.width !== fr.w || tintCv.height !== fr.h) { tintCv.width = fr.w; tintCv.height = fr.h; }
  tintCtx.globalCompositeOperation = 'source-over';
  tintCtx.clearRect(0, 0, fr.w, fr.h);
  tintCtx.drawImage(SPR_IMG, fr.x, fr.y, fr.w, fr.h, 0, 0, fr.w, fr.h);
  tintCtx.globalCompositeOperation = 'source-atop';
  // 红色要压得住：0.55 的罩色在深色重甲上还行，落到浅色（霜核那身冰蓝、石壳灰）上
  // 就只剩一点粉。提到 0.68 并去掉蓝绿分量，受击一眼就能看出来。
  tintCtx.fillStyle = mode === 'white' ? 'rgba(246,248,252,0.95)'
                                       : (mode === 'red2' ? 'rgba(255,26,26,0.78)' : 'rgba(255,52,52,0.68)');
  tintCtx.fillRect(0, 0, fr.w, fr.h);
  tintCtx.globalCompositeOperation = 'source-over';

  g.save();
  g.translate(Math.round(ax), Math.round(ay));
  g.scale(facing, 1);
  if (post) post(g);
  g.drawImage(tintCv, fr.ox, fr.oy);
  g.restore();
}

const BG_IMG = new Image();
let bgReady = false;
BG_IMG.onload = () => { bgReady = true; };
BG_IMG.src = BG_DATA;
const BG_W = 832, BG_H = 234;
const BG_ORDER = ['field', 'cave', 'hall', 'town'];
const BG_PARALLAX = 0.22;          // 值越小背景越"远"

// 地面贴图并排在背景下面：3 关各一条 1024x112 的剖面
const GND_ORDER = ['field', 'cave', 'hall'];
const GD_W = 1024, GD_H = 112;
const GND_Y0 = BG_H * 4;
const GND_BOTTOM = { field:'#202126', cave:'#112B51', hall:'#211518' };   // 贴图以下接续的纯色

function drawGroundTex(g, theme, p) {
  const gi = GND_ORDER.indexOf(theme);
  const visH = VH - p.y + 60;
  if (bgReady && gi >= 0) {
    // 按平台世界坐标取不同区段，免得每块平台长得一样
    const maxSx = Math.max(1, GD_W - Math.min(p.w, GD_W));
    const sx = Math.floor(Math.abs(p.x * 0.37) % maxSx);
    const sw = Math.min(GD_W - sx, Math.max(1, Math.round(p.w)));
    const dh = Math.min(GD_H, visH);
    g.drawImage(BG_IMG, sx, GND_Y0 + gi * GD_H, sw, dh, p.x, p.y, p.w, dh);
  } else {
    g.fillStyle = '#1A1F2E'; g.fillRect(p.x, p.y, p.w, visH);
  }
  const rest = visH - GD_H;
  if (rest > 0) {
    g.fillStyle = GND_BOTTOM[theme] || '#14181F';
    g.fillRect(p.x, p.y + GD_H, p.w, rest);
  }
}

// 每关一层淡色调，让背景和角色处在同一个色温里
const BG_GRADE = {
  field: 'rgba(28,40,74,0.16)',
  cave:  'rgba(20,50,90,0.18)',
  hall:  'rgba(70,18,20,0.18)',
  town:  'rgba(40,20,60,0.12)'
};

function drawSceneBg(g, theme, ox) {
  if (!bgReady) return;
  const i = BG_ORDER.indexOf(theme);
  if (i < 0) return;
  let dx = Math.round(-ox * BG_PARALLAX);
  dx = clamp(dx, -(BG_W - VW), 0);
  g.drawImage(BG_IMG, 0, i * BG_H, BG_W, BG_H, dx, 0, BG_W, BG_H);

  // 落地渐变：亮背景直接怼到暗地面上会是一道生硬的横切口，必须过渡
  const grd = g.createLinearGradient(0, 120, 0, VH);
  grd.addColorStop(0, 'rgba(6,8,12,0)');
  grd.addColorStop(0.55, 'rgba(6,8,12,0.40)');
  grd.addColorStop(1, 'rgba(6,8,12,0.88)');
  g.fillStyle = grd;
  g.fillRect(0, 120, VW, VH - 120);

  if (BG_GRADE[theme]) { g.fillStyle = BG_GRADE[theme]; g.fillRect(0, 0, VW, VH); }
}

/* ==================================================================
   自适应画质
   轮廓光用 shadowBlur 实现，在中低端机上是稳 60 帧的最大风险点。
   连续 100 帧平均帧时超过 26ms 就自动关掉它 —— 宁可少一圈边光，也不能卡。
   ================================================================== */
let rimLight = true;
const _ft = [];
function perfTick(ms) {
  if (!rimLight) return;
  _ft.push(ms);
  if (_ft.length >= 100) {
    let sum = 0; for (let i = 0; i < _ft.length; i++) sum += _ft[i];
    if (sum / _ft.length > 26) rimLight = false;
    _ft.length = 0;
  }
}

/* ---------------------------------------------------------------- 输入 */
const keys = {};
const keyPressed = {};
addEventListener('keydown', e => {
  if (!keys[e.code]) keyPressed[e.code] = true;
  keys[e.code] = true;
  if (['KeyA','KeyD','KeyW','KeyS','KeyJ','KeyK','KeyL','Space',
       'ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
  audio.unlock();
  if (e.code === 'KeyM') audio.toggleMute();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* 鼠标 / 触摸：点击 = 确认（开始游戏、过关回城）。顺便在这里解锁音频 ——
   浏览器要求 AudioContext 必须在用户手势里才能出声。 */
let pointerPressed = false;
addEventListener('mousedown', e => { pointerPressed = true; audio.unlock(); });
addEventListener('touchstart', e => {
  pointerPressed = true; audio.unlock();
  if (e.cancelable) e.preventDefault();          // 防止手机上双击缩放
}, { passive: false });

   音频：Web Audio 现场合成，零音频文件、零外部依赖
   ================================================================== */

/* ---- 背景音乐用的乐句表 ---- */
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
// Am – F – C – G。小调走向，够暗，但也够推着人往前走。
const CHORDS = [[45, 57, 60, 64], [41, 53, 57, 60], [48, 60, 64, 67], [43, 55, 59, 62]];
const MUSIC_CFG = {
  title: { bpm: 90,  kind: 'calm' },
  town:  { bpm: 90,  kind: 'calm' },
  field: { bpm: 132, kind: 'battle' },
  cave:  { bpm: 122, kind: 'battle' },
  hall:  { bpm: 144, kind: 'battle' }
};

const audio = {
  ac: null, bus: null, sfx: null, mus: null, echo: null, muted: false,
  unlock() {
    if (!this.ac) {
      try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      if (this.ac) {
        const ac = this.ac;
        // 三条总线：master → SFX / 音乐。静音只要掐 master 一个点。
        this.bus = ac.createGain(); this.bus.gain.value = 1;    this.bus.connect(ac.destination);
        this.sfx = ac.createGain(); this.sfx.gain.value = 0.85; this.sfx.connect(this.bus);
        this.mus = ac.createGain(); this.mus.gain.value = 0.40; this.mus.connect(this.bus);
        // 主音走一条带反馈的短延迟，不用卷积混响也能有点空间
        const dl = ac.createDelay(0.5); dl.delayTime.value = 0.19;
        const fb = ac.createGain(); fb.gain.value = 0.30;
        const wet = ac.createGain(); wet.gain.value = 0.34;
        this.echo = ac.createGain(); this.echo.gain.value = 1;
        this.echo.connect(dl); dl.connect(fb); fb.connect(dl);
        dl.connect(wet); wet.connect(this.mus);
      }
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },
  toggleMute() {
    this.muted = !this.muted;
    if (this.bus) this.bus.gain.value = this.muted ? 0 : 1;
  },
  noise(dur) {
    const ac = this.ac, n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },
  band(dur, freq, q, gain, sweepTo) {
    const ac = this.ac; if (!ac) return;
    const src = ac.createBufferSource(); src.buffer = this.noise(dur);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq, ac.currentTime);
    if (sweepTo) bp.frequency.exponentialRampToValueAtTime(sweepTo, ac.currentTime + dur);
    bp.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    src.connect(bp); bp.connect(g); g.connect(this.sfx);
    src.start(); src.stop(ac.currentTime + dur);
  },
  thump(f0, f1, dur, gain) {
    const ac = this.ac; if (!ac) return;
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), ac.currentTime + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(gain, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(this.sfx);
    o.start(); o.stop(ac.currentTime + dur);
  },
  swing()      { this.band(0.15, 1100, 1.6, 0.10, 300); },
  swingHeavy() { this.band(0.26, 760, 1.1, 0.16, 210); this.band(0.14, 2200, 2.0, 0.09, 600); },
  // 轻击：脆，主频高，尾巴短
  lightHit()   { this.band(0.07, 4200, 2.0, 0.30, 1500);
                 this.band(0.16, 2400, 1.6, 0.20, 620);
                 this.thump(300, 110, 0.09, 0.26); },
  // 重击：一记低频冲击 + 一层金属碎屑，收尾拖长一点才有"砸进去了"
  heavyHit()   { this.band(0.09, 2600, 1.5, 0.36, 900);
                 this.band(0.44, 1250, 0.9, 0.42, 150);
                 this.thump(150, 36, 0.34, 0.55);
                 this.thump(72, 28, 0.52, 0.30); },
  // 破防 / 大招命中：最厚的一档
  hitBig()     { this.band(0.12, 3000, 1.2, 0.28, 800);
                 this.band(0.60, 900, 0.8, 0.36, 110);
                 this.thump(120, 30, 0.55, 0.42);
                 this.thump(58, 24, 0.8, 0.24);
                 this.band(0.34, 6200, 7.0, 0.11, 2600); },
  metalClang() { this.band(0.42, 3400, 6.0, 0.22, 1500); this.band(0.30, 5600, 8.0, 0.12, 2400); },
  boom()       { this.band(0.60, 430,  0.8, 0.50, 90);   this.thump(115, 30, 0.55, 0.55); },
  jump()       { this.band(0.10, 620, 1.0, 0.08, 1500); },
  land()       { this.thump(150, 55, 0.16, 0.26); this.band(0.12, 800, 1.0, 0.11, 260); },
  step()       { this.band(0.05, 1500, 1.4, 0.05, 500); },
  hurt()       { this.thump(320, 80, 0.20, 0.26); this.band(0.14, 1200, 1.0, 0.14, 300); },
  dash()       { this.band(0.20, 520, 0.9, 0.17, 1900); },
  ultCharge()  { this.band(0.75, 190, 3.0, 0.20, 3400); this.thump(70, 200, 0.7, 0.22); },
  ultBurst()   { this.band(0.9, 300, 0.7, 0.36, 60); this.thump(90, 26, 0.85, 0.40); },
  kiWave()     { this.band(0.34, 1400, 1.4, 0.22, 420); this.thump(430, 120, 0.30, 0.28);
                 this.band(0.50, 700, 0.9, 0.16, 240); },
  ko()         { this.thump(300, 40, 0.7, 0.5); this.band(0.8, 900, 1.0, 0.3, 120); },
  // 雷：先一记脆裂，再跟一段低频滚雷
  thunder()    { this.band(0.11, 5400, 2.0, 0.34, 1600);
                 this.thump(190, 62, 0.20, 0.34);
                 this.band(1.7, 200, 0.7, 0.34, 44);
                 this.thump(74, 26, 1.25, 0.42); },

  /* ---------------- 背景音乐（前向调度合成） ----------------
     每帧调用 pumpMusic()，往前排 ~0.22 秒的音符。用 ac.currentTime 而不是帧计数，
     所以帧率掉到 30 或者飙到 144，节奏都不会歪。 */
  bgmScene: '', bgmStep: 0, bgmNext: 0, bgmBuf: null,

  playMusic(name) {
    if (this.bgmScene === name) return;
    this.bgmScene = name; this.bgmStep = 0;
    this.bgmNext = this.ac ? this.ac.currentTime + 0.05 : 0;
  },
  pumpMusic() {
    const ac = this.ac;
    if (!ac || !this.bgmScene || this.muted) return;
    const cfg = MUSIC_CFG[this.bgmScene];
    if (!cfg) return;
    const spb = 60 / cfg.bpm / 4;                       // 十六分音符秒数
    if (!(this.bgmNext > ac.currentTime - 0.5)) this.bgmNext = ac.currentTime + 0.02;
    let guard = 0;
    while (this.bgmNext < ac.currentTime + 0.22 && guard++ < 40) {
      this.musicStep(this.bgmStep, this.bgmNext, cfg, spb);
      this.bgmNext += spb; this.bgmStep++;
    }
  },
  nbuf(dur) {
    const ac = this.ac;
    if (!this.bgmBuf || this.bgmBuf.duration < dur - 0.001) {
      const len = Math.ceil(ac.sampleRate * Math.max(dur, 0.3));
      const b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.bgmBuf = b;
    }
    return this.bgmBuf;
  },
  nEnv(g, t, a, d, peak) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  mKick(t, vol) {
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    this.nEnv(g, t, 0.004, 0.16, 0.55 * (vol || 1));
    o.connect(g); g.connect(this.mus);
    o.start(t); o.stop(t + 0.24);
  },
  mSnare(t) {
    const ac = this.ac, src = ac.createBufferSource(), g = ac.createGain(), hp = ac.createBiquadFilter();
    src.buffer = this.nbuf(0.2);
    hp.type = 'highpass'; hp.frequency.value = 1500;
    this.nEnv(g, t, 0.003, 0.13, 0.20);
    src.connect(hp); hp.connect(g); g.connect(this.mus);
    src.start(t); src.stop(t + 0.2);
  },
  mHat(t, vol) {
    const ac = this.ac, src = ac.createBufferSource(), g = ac.createGain(), hp = ac.createBiquadFilter();
    src.buffer = this.nbuf(0.06);
    hp.type = 'highpass'; hp.frequency.value = 6500;
    this.nEnv(g, t, 0.002, 0.04, vol);
    src.connect(hp); hp.connect(g); g.connect(this.mus);
    src.start(t); src.stop(t + 0.08);
  },
  mBass(midi, t, dur) {
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = NOTE(midi);
    f.type = 'lowpass'; f.Q.value = 7;
    f.frequency.setValueAtTime(1100, t);
    f.frequency.exponentialRampToValueAtTime(240, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.mus);
    o.start(t); o.stop(t + dur + 0.04);
  },
  mLead(midi, t, dur, vol) {
    const ac = this.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = NOTE(midi);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.mus);
    if (this.echo) g.connect(this.echo);
    o.start(t); o.stop(t + dur + 0.04);
  },
  mPad(midi, t, dur, vol) {
    const ac = this.ac, g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1500;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.6);
    g.gain.setValueAtTime(vol, t + Math.max(0.62, dur - 0.9));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(this.mus);
    for (let i = 0; i < 2; i++) {
      const o = ac.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = NOTE(midi); o.detune.value = i ? 8 : -8;
      o.connect(f); o.start(t); o.stop(t + dur + 0.06);
    }
  },
  musicStep(step, t, cfg, spb) {
    const bar = Math.floor(step / 16) % 4, s = step % 16, ch = CHORDS[bar];
    if (cfg.kind === 'battle') {
      if (s % 4 === 0) this.mKick(t, 1);
      if (s === 4 || s === 12) this.mSnare(t);
      if (s % 2 === 1) this.mHat(t, s % 4 === 3 ? 0.085 : 0.045);
      if (s % 2 === 0 || s === 3 || s === 11) this.mBass(ch[0] - 12, t, spb * 0.85);
      if (s % 2 === 1) this.mLead(ch[1 + ((step >> 1) % 3)], t, spb * 1.3, 0.045);
      if (s === 6 || s === 14) this.mLead(ch[3] + 12, t, spb * 2.0, 0.038);
    } else {
      if (s === 0) {
        this.mKick(t, 0.50);
        for (let i = 1; i < 4; i++) this.mPad(ch[i], t, spb * 15, 0.050);
      }
      if (s === 3)  this.mPad(ch[0] - 12, t, spb * 15, 0.042);   // 低八度根音，垫住
      if (s === 6)  this.mLead(ch[2] + 12, t, spb * 3, 0.042);
      if (s === 10) this.mLead(ch[3] + 12, t, spb * 3, 0.038);
    }
  }
};

/* ==================================================================
   小工具
   ================================================================== */
const rnd   = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const sign  = v => v < 0 ? -1 : 1;
function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

/* 缓动：出招用 snap（起手快、落点稳），预备用 easeOut，回收用 smooth */
const EASE = {
  line:  u => u,
  smooth:u => u * u * (3 - 2 * u),
  in:    u => u * u * u,
  out:   u => 1 - Math.pow(1 - u, 3),
  snap:  u => 1 - Math.pow(1 - u, 5),
  back:  u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); },
  hold:  u => 0
};

function tiledX(ox, factor, spacing, fn) {
  const off = -ox * factor;
  let i = Math.floor((off - spacing) / spacing);
  for (let x = i * spacing; x < VW + spacing; x += spacing, i++) fn(x, i);
}

/* 沿 (x, y) 往下找最近的地面顶面 —— 影子要靠它贴地 */
function groundBelow(x, y, plats) {
  let best = null;
  for (const p of plats) {
    if (x < p.x || x > p.x + p.w) continue;
    if (p.y >= y - 4 && (best === null || p.y < best)) best = p.y;
  }
  return best;
}

/* ==================================================================
   打击感：顿帧 / 屏幕震动 / 全屏闪 / 镜头冲击
   ================================================================== */
const feel = {
  hitstop: 0, shake: 0, shakeX: 0, shakeY: 0, flash: 0,
  zoomPunch: 0,                      // 镜头推近的瞬时量
  freeze(f) { this.hitstop = Math.max(this.hitstop, f); },
  shakeIt(m) { this.shake = Math.max(this.shake, m); },
  punch(m) { this.zoomPunch = Math.max(this.zoomPunch, m); },
  update() {
    if (this.shake > 0) {
      this.shakeX = rnd(-this.shake, this.shake);
      this.shakeY = rnd(-this.shake, this.shake) * 0.7;
      this.shake *= 0.82;
      if (this.shake < 0.3) { this.shake = 0; this.shakeX = this.shakeY = 0; }
    }
    if (this.flash > 0) this.flash = Math.max(0, this.flash - 0.048);
    if (this.zoomPunch > 0) this.zoomPunch = Math.max(0, this.zoomPunch - 0.045);
  }
};

/* ==================================================================
   摄像机：跟随 + 预看前方 + 动态变焦（拳皇的推拉）
   ================================================================== */
const camera = {
  x: 0, y: 0, zoom: 1, targetZoom: 1,
  update(p, levelW) {
    const lead = p.facing * 40;
    let tx = p.cx - VW / 2 + lead;
    tx = clamp(tx, 0, Math.max(0, levelW - VW));
    this.x = lerp(this.x, tx, 0.13);
    if (Math.abs(this.x - tx) < 0.15) this.x = tx;
    this.x = clamp(this.x, 0, Math.max(0, levelW - VW));

    /* 纵向：只在主角跳得比平地二段跳还高时才往下让镜头。
       阈值 96 高于"地面起跳二段"的顶点（实测约 116），所以平地怎么跳镜头都不动；
       只有站到高台（y≤200）上再二段跳才会触发。上限 34px 是地面地平线的极限：
       地面在 y=236、屏幕高 270，再往下让地平线就掉出屏幕底了。
       精灵高 93px，让满 34 后顶边约在 y=-6 —— 只剩耳尖被切掉几像素，肉眼看不出来。 */
    const wantY = Math.min(0, p.y - 96);
    this.y = lerp(this.y, clamp(wantY, -34, 0), 0.22);
    if (Math.abs(this.y - clamp(wantY, -34, 0)) < 0.1) this.y = clamp(wantY, -34, 0);

    // 大招期间先拉远再推近，平时受"冲击"推近
    let z = 1;
    if (player.atkName === 'ult' && player.attacking) z = 1.10;
    z += feel.zoomPunch;
    this.targetZoom = z;
    this.zoom = lerp(this.zoom, this.targetZoom, 0.18);
  },
  get ox() { return Math.round(this.x + feel.shakeX); },
  get oy() { return Math.round(this.y + feel.shakeY); }
};

/* ==================================================================
   骨骼系统
   ------------------------------------------------------------------
   所有角度单位是度。约定：
     · 朝"上"的骨骼（躯干/头/耳）：正值 = 身体前倾
     · 朝"下"的骨骼（四肢）：      正值 = 向后摆
   姿势就是一个扁平的数字对象，帧与帧之间逐项插值。
   ================================================================== */
/* ---- 地面影子：物体感的头号功臣 ---- */
function drawShadow(g, x, feetY, w, plats, scale) {
  const gy = groundBelow(x, feetY - 1, plats);
  if (gy === null) return;
  const h = Math.max(0, gy - feetY);
  const k = clamp(1 - h / 190, 0.28, 1);
  g.save();
  g.globalAlpha = 0.42 * k;
  g.fillStyle = '#000';
  g.beginPath();
  g.ellipse(x, gy + 1.5, w * 0.5 * k * (scale || 1), w * 0.16 * k * (scale || 1), 0, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

/* ==================================================================
   玩家
   ================================================================== */
const ATK = {
  light: { startup: 9,  active: 8,  recovery: 16, dmg: 12,
           hb:{w:56,h:40,ox:6,oy:-38},   stop:3, shake:4,  kb:3.4, energy:0, hitE:9, punch:0.035,
           snd:'light', fx:'small' },
  heavy: { startup: 21, active: 10, recovery: 34, dmg: 34,
           hb:{w:76,h:62,ox:4,oy:-46},   stop:7, shake:11, kb:9.5, energy:0, hitE:16, punch:0.10,
           snd:'heavy', fx:'big' },
  up:    { startup: 14, active: 10, recovery: 30, dmg: 30,
           hb:{w:50,h:70,ox:2,oy:-86},   stop:6, shake:9,  kb:5.0, lift:-10.5, energy:0, hitE:14, punch:0.07,
           snd:'heavy', fx:'big' },
  dive:  { startup: 4,  active: 120, recovery: 14, dmg: 26,
           hb:{w:70,h:44,ox:-6,oy:-46},  stop:7, shake:12, kb:7.0, energy:0, hitE:14, punch:0.08,
           snd:'heavy', fx:'big' },
  dash:  { startup: 8,  active: 26, recovery: 24, dmg: 20,
           hb:{w:62,h:38,ox:0,oy:-32},   stop:5, shake:7,  kb:8.0, energy:0, hitE:11, punch:0.05,
           snd:'light', fx:'small', invuln:true },
  // 雷霆天怒：判定是"面前半个屏幕"的长条（0.55 屏宽 × 210 高），站到背后打不到。
  // 前摇 34 帧里放超必杀演出，第 34 帧天雷落地 —— 演出和判定是同一件事。
  // ⚠️ 大招的 energy 是 -100（起手扣掉一管气），不是"给气" —— 清零就放大招了。
  ult:   { startup: 34, active: 36, recovery: 44, dmg: 60,
           hb:{w:Math.round(VW*0.55),h:210,ox:-12,oy:-190}, stop:10, shake:24, kb:12,
           energy:-100, hitE:0, punch:0.16,
           snd:'boom', fx:'ult', multi:true }
};

/* 强化进度。⚠️ 必须先于 Player 声明：Player 的 maxHp/atkMul/dmgCut 三个 getter
   在构造（this.hp = this.maxHp）时就会被读到，而读存档的代码在后面 ——
   放到后面会踩 TDZ，整个脚本从第一行就挂掉。 */
let progress = { maxLevel: 0, points: 0, up: { atk: 0, hp: 0, arm: 0 } };

class Player {
  constructor(x, y) {
    this.w = 22; this.h = 62;
    this.reset(x, y);
  }
  // 强化等级直接参与数值计算，读的时候算一遍就行，不用到处同步
  get maxHp()  { return 100 + (progress.up.hp  || 0) * 12; }
  get atkMul() { return 1 + (progress.up.atk || 0) * 0.08; }
  get dmgCut() { return Math.min(0.5, (progress.up.arm || 0) * 0.06); }
  reset(x, y) {
    this.x = x; this.y = y;                    // y = 脚底
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.onGround = false;
    this.hp = this.maxHp;
    this.energy = 0;
    this.state = 'idle';
    this.atk = null; this.atkName = ''; this.atkT = 0;
    this.hasHit = false; this.atkHits = new Set();
    this.invuln = 0; this.hurtT = 0;
    this.bufJ = 0; this.bufK = 0; this.bufL = 0; this.bufO = 0;   // 出招中按下的攻击键缓冲
    this.animT = 0;          // 通用动作计时（受击/待机/落地）
    this.locoT = 0;          // 位移相位：只用于跑步循环，跟移动速度挂钩
    this.coyote = 0; this.jumpBuf = 0;
    this.blocking = false;     // 架盾中（按住 W）
    this.jumpsLeft = 2;        // 二段跳：还能跳几次（落地回满）
    this.airJumpT = 0;         // 二段跳动画计时（>0 时走 jump2 图集）
    this.dashCd = 0;
    this.crouching = false;
    this.chargeFx = 0;
    this.lastTap = {};
    this.landT = 0;
    this.wasAir = false;
    this.stepAcc = 0;
    this.trail = [];
  }

  get cx() { return this.x + this.w / 2; }
  get hitbox() { return { x: this.x, y: this.y - this.h, w: this.w, h: this.h }; }

  get attackBox() {
    if (!this.atk) return null;
    const hb = this.atk.hb;
    return {
      x: this.facing > 0 ? this.cx + hb.ox : this.cx - hb.ox - hb.w,
      y: this.y + hb.oy, w: hb.w, h: hb.h
    };
  }
  get attacking() { return this.state === 'attack'; }
  /* 架盾是否真的生效：按住 W + 站在地上 + 没在出招、没在受击硬直。
     光看 blocking 不够 —— 那个只表示"W 按着"，出招/受击时不该还在挡。 */
  get guarding() {
    return !!this.blocking && !this.attacking && this.state !== 'hurt' && this.state !== 'dead';
  }
  get activeFrames() {
    const a = this.atk;
    return !!a && this.atkT >= a.startup && this.atkT < a.startup + a.active;
  }

  // 取出缓冲里的招式（取消窗口打开后调用）
  popBuffered() {
    if (this.bufO > 0 && this.energy >= 100) { this.bufO = 0; return 'ult'; }
    if (this.bufK > 0) {
      this.bufK = 0;
      if (!this.onGround) return 'dive';
      if (keys.Space) return 'up';
      return 'heavy';
    }
    if (this.bufJ > 0) {
      this.bufJ = 0;
      if (!this.onGround) return 'dive';
      if (this.dashCd > 0) return 'dash';
      return 'light';
    }
    if (this.bufL > 0 && this.energy >= 50) {
      this.bufL = 0; this.energy -= 50; fireWave(this);
    }
    return null;
  }

  /* 起跳。地面那一跳和空中二段跳共用 —— 出招取消起跳也走这里，
     三处如果各写一遍，迟早会漏掉某一个分支。 */
  doJump(fromGround) {
    this.jumpsLeft = Math.max(0, this.jumpsLeft - 1);
    this.jumpBuf = 0; this.coyote = 0; this.onGround = false;
    // 立刻置成 jump。取消出招那条路是 `return` 走的，到不了下面那段状态赋值，
    // 不在这里补一下的话，起跳当帧会闪一帧 idle 站姿。
    this.state = 'jump';
    if (fromGround) {
      this.vy = -8.6;
      audio.jump();
      spawnDust(this.cx, this.y, 5, 0.8);
    } else {
      this.vy = -7.9;                          // 二段略轻，两段叠起来约 123px
      this.airJumpT = 20;                      // 这 20 帧走 jump2 图集
      audio.band(0.13, 940, 1.0, 0.10, 2300);  // 比地面起跳更高更脆，听得出是第二段
      spawnAirBurst(this.cx, this.y);
    }
  }

  startAttack(name) {
    const a = ATK[name];
    this.state = 'attack'; this.atkName = name; this.atk = a;
    this.blocking = false;                 // 出招就把盾撤了，不然会边砍边挡
    this.atkT = 0; this.hasHit = false; this.atkHits = new Set();
    this.bufJ = 0; this.bufK = 0; this.bufL = 0; this.bufO = 0;   // 这一按已经被消费掉了
    this.energy = clamp(this.energy + (a.energy || 0), 0, 100);
    audio.swing();
    if (name === 'heavy' || name === 'up' || name === 'ult') audio.swingHeavy();
    if (name === 'dash') { audio.dash(); this.invuln = 26; this.vx = this.facing * 5.4; }
    if (name === 'dive') { this.vy = 9; }
    if (name === 'up')   { this.vy = -2.4; }
    if (name === 'ult')  { audio.ultCharge(); this.chargeFx = 1; superFx.t = 0; superFx.on = true; }
  }

  /* 架盾吃掉一发弹幕：不击退、不僵直，只吃 25% 的少量真伤。
     近身重击不走这里 —— 格挡只挡弹幕，不然就成无敌了。 */
  blockHit(dmg, fromX) {
    if (this.state === 'dead') return;
    this.hp = Math.max(0, this.hp - Math.max(1, Math.round(dmg * 0.25 * (1 - this.dmgCut))));
    this.facing = fromX >= this.cx ? 1 : -1;      // 自动转向来袭方向
    audio.metalClang();
    spawnBlockFx(this.cx + this.facing * 13, this.y - this.h * 0.55, this.facing);
    feel.freeze(2); feel.shakeIt(5); feel.punch(0.025);
    if (this.hp <= 0) {                            // 挡到死也得死
      this.hp = 0; this.state = 'dead'; this.atk = null; this.atkName = '';
      this.animT = 0; this.blocking = false; this.chargeFx = 0;
      feel.freeze(12); feel.shakeIt(16); audio.ko();
    }
  }

  hurt(dmg, kx) {
    if (this.invuln > 0 || this.state === 'dead') return;
    this.hp = Math.max(0, this.hp - Math.max(1, Math.round(dmg * (1 - this.dmgCut))));   // 护甲减伤
    /* 大招期间照常掉血，但**绝不被打断** —— "必须放完"这条要真的成立，
       不然随便一发弹幕就把超必杀掐了。死亡仍然中断（人都死了没得放）。 */
    if (this.attacking && this.atkName === 'ult') {
      this.invuln = 24;                    // 不是无敌，只是别被连续打成一串
      audio.hurt(); feel.shakeIt(6);
      if (this.hp <= 0) {
        this.hp = 0; this.state = 'dead'; this.atk = null; this.atkName = '';
        this.animT = 0; this.chargeFx = 0; this.blocking = false;
      }
      return;
    }
    this.invuln = 54; this.hurtT = 14;
    this.vx = kx * 3.4; this.vy = -3.2;
    this.state = this.hp <= 0 ? 'dead' : 'hurt';
    this.atk = null; this.chargeFx = 0; this.blocking = false;
    this.animT = 0;
    audio.hurt(); feel.shakeIt(6);
  }

  update(level) {
    const plats = level.platforms;
    const SPD = 1.85, AIR_ACC = 0.52, FRIC = 0.42;

    if (this.state === 'dead') {
      this.animT++;
      this.vy += 0.5; this.y += this.vy; this.x += this.vx; this.vx *= 0.94;
      this.groundCollide(plats);
      return;
    }
    if (this.y > level.deathY) {
      this.hp = 0; this.state = 'dead'; this.atk = null; this.animT = 0;
      this.vy = Math.min(this.vy, 6);
      return;
    }
    if (this.invuln > 0) this.invuln--;
    if (this.hurtT > 0) this.hurtT--;
    if (this.dashCd > 0) this.dashCd--;
    if (this.landT > 0) this.landT--;
    if (this.airJumpT > 0) this.airJumpT--;
    if (this.chargeFx > 0 && !this.attacking && !superFx.on) this.chargeFx = Math.max(0, this.chargeFx - 0.03);

    /* ---------- 格挡（按住 W） ----------
       只在地面上成立，而且不能和蹲重叠（S 优先）。放在最前面，本帧的输入立刻生效。
       ⚠️ 真正"挡得住"还要看 guarding（不能是出招中/受击硬直中），见那个 getter。 */
    this.blocking = !!keys.KeyW && this.onGround && !keys.KeyS;

    // 残影（冲刺/大招时留一串半透明剪影）
    const wantTrail = this.atkName === 'dash' || this.atkName === 'ult';
    if (wantTrail) {
      const tsf = this.spriteFrame();
      this.trail.push({ ax: this.cx, ay: this.y, f: this.facing, a: tsf[0], i: tsf[1], life: 9 });
      if (this.trail.length > 10) this.trail.shift();
    }

    /* ---------- 出招中的输入缓冲 ---------- */
    // 出招期间按下的攻击键**一直留到这一招播完**（不衰减），播完当帧无缝接上。
    // 于是"按键绝不丢"和"动画绝不被掐断"可以同时成立 —— 这也是取代旧的
    // "取消窗口"的地方（旧做法是在判定帧之后提前掐断收招动画，动画不完整）。
    // 平时按键会被下面的输入分支立刻消费掉，用不到缓冲。
    if (this.attacking) {
      const left = this.atk
        ? (this.atk.startup + this.atk.active + this.atk.recovery - this.atkT) : 20;
      const hold = left + 12;                 // 留一点残影，别无限期囤着
      if (keyPressed.KeyJ) this.bufJ = hold;
      if (keyPressed.KeyK) this.bufK = hold;
      if (keyPressed.KeyL) this.bufL = hold;
      if (keyPressed.KeyO) this.bufO = hold;
      // 跳跃键是空格（W 已经改成格挡了）。ArrowUp 保留，方便习惯方向键的人。
      if (keyPressed.Space || keyPressed.ArrowUp) this.jumpBuf = 10;
    } else {
      if (this.bufJ > 0) this.bufJ--;
      if (this.bufK > 0) this.bufK--;
      if (this.bufL > 0) this.bufL--;
      if (this.bufO > 0) this.bufO--;
    }

    /* ---------- 攻击推进 ---------- */
    if (this.attacking) {
      this.atkT++; this.animT++;
      const a = this.atk;
      // 只有普通攻击（轻击/重击）可以被移动和组合技打断。
      // 升龙/冲锋/下劈是"已经豁出去了"的招，大招更是必须放完，都不给这个口子。
      const soft = (this.atkName === 'light' || this.atkName === 'heavy');

      /* ---------- ① 组合技打断普通攻击 ----------
         升龙（空格+K）/ 冲锋（方向+J）/ 下劈（空中 J）。
         ⚠️ 必须排在跳跃取消**之前**：空格+K 会同时点亮 jumpBuf，先判跳跃就会变成跳走。 */
      if (soft) {
        let combo = null;
        if (keyPressed.KeyK && keys.Space) combo = 'up';
        else if (keyPressed.KeyJ) {
          if (!this.onGround) combo = 'dive';
          else if (this.dashCd > 0 || keyPressed.KeyA || keyPressed.KeyD) combo = 'dash';
        }
        if (combo) {
          this.bufJ = 0; this.bufK = 0; this.bufL = 0; this.bufO = 0; this.jumpBuf = 0;
          this.startAttack(combo);
          return;
        }
      }

      /* ---------- 跳跃取消 ----------
         出招期间按 W 可以直接跳走（站着或土狼时间内）。存在的意义是"有出路"：
         不然站在坑边出一招就一路滑下去、被怪围住也动不了，一点办法都没有。

         ⚠️⚠️ 但**攻击不能取消攻击**。下一招只在动画播完的那一帧才接上（见本段末尾）。
         如果允许攻击打断攻击，连按重击就会永远停在"举起斧头"的起手帧 ——
         斧头举起来了，一下都砸不下去。跳跃是另一种输入，所以它可以取消；
         同一个攻击键重复按只是"排队等下一招"，不能重置当前这招。 */
      // 空中也能取消，但要走 doJump 花掉那一次二段跳 —— 空中出招因此不是零代价，
      // "下劈"该有的风险保住了，同时又永远留了一条出路（和地面取消同一条思路）。
      const canJumpOut = this.onGround || this.coyote > 0 || this.jumpsLeft > 0;
      if (a && this.atkName !== 'ult' && this.jumpBuf > 0 && canJumpOut) {
        const fromGround = this.onGround || this.coyote > 0;
        this.state = 'idle'; this.atk = null; this.atkName = ''; this.animT = 0;
        this.bufJ = 0; this.bufK = 0; this.bufL = 0; this.bufO = 0;   // 取消就把排队的一起清掉
        this.doJump(fromGround);
        return;
      }

      /* ---------- ② 移动打断普通攻击 ----------
         按 A/D 立刻收招走人。放在跳跃之后：同一帧按"方向+空格"应该是跳走而不是走。

         ⚠️⚠️ 判的是 **keyPressed（新按下的那一下）而不是 keys（按住的）**。
         用 keys 会毁掉"边跑边打"：按住 D 跑动时按 J，下一帧 keys.KeyD 还是 true，
         攻击会被自己按着的方向键当场掐掉 —— 一下都打不出去。 */
      if (soft && (keyPressed.KeyA || keyPressed.KeyD)) {
        this.state = 'idle'; this.atk = null; this.atkName = ''; this.animT = 0;
        this.bufJ = 0; this.bufK = 0; this.bufL = 0; this.bufO = 0;
        return;
      }

      if (this.atkName === 'dive') {
        this.vy = 9;
        if (this.onGround) {
          if (!this.hasHit) {
            this.hasHit = true;
            audio.boom(); audio.land();
            feel.shakeIt(a.shake); feel.freeze(7); feel.punch(a.punch);
            spawnShock(this.cx, this.y, this.facing);
            spawnDust(this.cx, this.y, 14, 1.6);
          }
          if (this.atkT > a.startup + 6) { this.state = 'idle'; this.atk = null; this.atkName = ''; this.animT = 0; }
        }
        this.x += this.vx; this.y += this.vy;
        this.groundCollide(plats);
        return;
      }

      // 地面出招：脚下钉住。否则在坑边出一招就一路滑下去，而且出招中不能跳，
      // 完全没有补救手段。冲刺除外 —— 它本来就要往前滑。
      this.vx *= (this.onGround && this.atkName !== 'dash') ? 0.80 : 0.94;
      this.vy += 0.52; this.vy = clamp(this.vy, -14, 13);
      this.x += this.vx; this.y += this.vy;
      this.groundCollide(plats);

      // 动画完整播完的**那一帧**才允许接下一招：不提前掐断，也没有空档。
      if (this.atkT >= a.startup + a.active + a.recovery) {
        const nxt = this.popBuffered();
        if (nxt) { this.startAttack(nxt); return; }
        this.state = 'idle'; this.atk = null; this.atkName = ''; this.animT = 0;
      }
      return;
    }

    /* ---------- 受击硬直 ---------- */
    if (this.state === 'hurt') {
      this.animT++;
      this.vy += 0.5; this.vx *= 0.94;
      this.x += this.vx; this.y += this.vy;
      this.groundCollide(plats);
      if (this.hurtT <= 0 && this.onGround) { this.state = 'idle'; this.animT = 0; }
      return;
    }

    /* ---------- 月华天怒 ---------- */
    /* ---------- 雷霆天怒（O 键） ---------- */
    // 原来要 J+K+L 三键同时按，实战里几乎按不出来；改成单按 O。
    if (keyPressed.KeyO) {
      if (this.energy >= 100) this.startAttack('ult');
      else audio.thump(180, 90, 0.12, 0.10);      // 气不够，给个闷响
      return;
    }

    /* ---------- 攻击输入 ---------- */
    if (keyPressed.KeyK) {
      // 升龙斩 = 空格 + K。空格是跳跃键，但攻击分支排在跳跃之前，同一帧按下不会被跳跃截胡；
      // 顺手把 jumpBuf 清掉，免得收招之后又补跳一下。
      if (keys.Space) { this.jumpBuf = 0; this.startAttack('up'); }
      else           this.startAttack('heavy');
      return;
    }
    if (keyPressed.KeyJ) {
      if (!this.onGround) this.startAttack('dive');
      else if (this.dashCd > 0) this.startAttack('dash');   // 双击方向键 = 意图已明确，不再额外要求速度
      else this.startAttack('light');
      return;
    }
    if (keyPressed.KeyL) {
      if (this.energy >= 50) { this.energy -= 50; fireWave(this); }
      else audio.thump(180, 90, 0.12, 0.10);
      return;
    }

    /* ---------- 移动 ---------- */
    let ax = 0;
    if (keys.KeyA) { ax = -1; this.facing = -1; }
    if (keys.KeyD) { ax = 1;  this.facing = 1; }

    // 狂野冲锋：**单击**方向键就打开窗口（原来是双击），窗口内按 J 出冲锋。
    // 窗口只有 22 帧（约 0.37 秒），而且是"按下"才算 —— 一直按着方向走不会误触，
    // 走一会儿再按 J 还是普通轻击。
    for (const code of ['KeyA', 'KeyD']) {
      if (keyPressed[code] && this.onGround) this.dashCd = 22;
    }

    this.crouching = keys.KeyS && this.onGround;
    if (this.guarding) {
      // 架盾时站住：不能再加速，只靠残余惯性滑一点。格挡要是还能全速跑就没代价了。
      this.vx *= 0.62;
      if (Math.abs(this.vx) < 0.15) this.vx = 0;
    } else if (this.crouching) {
      this.vx *= 0.5;
    } else if (ax !== 0) {
      // 起速要狠。原来是 0.42*SPD，从 0 到全速要 2.4 帧、加上原来的减速手感，
      // 整体就"软"。现在一次给足，并且**反向输入额外加力** —— 转身不能在原地磨。
      this.vx += this.onGround ? ax * SPD * 0.72 : ax * AIR_ACC;
      if (this.vx * ax < 0) this.vx += ax * (this.onGround ? SPD * 0.55 : 0.30);
      this.vx = clamp(this.vx, -SPD * 1.6, SPD * 1.6);
    } else {
      // 松手立刻收住。原来 FRIC=0.78，从全速到停要 14 帧（0.23 秒），
      // 滑得跟在冰上一样 —— 这是"不跟手"里最明显的一条。
      this.vx *= this.onGround ? FRIC : 0.94;
      if (Math.abs(this.vx) < 0.08) this.vx = 0;
    }

    /* ---------- 跳跃（可二段） ---------- */
    // 落地回满两段。走下悬崖时土狼时间一结束就把第一段收掉 ——
    // 否则从台沿掉下去还能连跳两下，等于白送一次跳跃。
    if (this.onGround) { this.coyote = 8; this.jumpsLeft = 2; }
    else if (this.coyote > 0) {
      this.coyote--;
      if (this.coyote === 0) this.jumpsLeft = Math.min(this.jumpsLeft, 1);
    }
    if (keyPressed.Space || keyPressed.ArrowUp) this.jumpBuf = 8;
    else if (this.jumpBuf > 0) this.jumpBuf--;
    if (this.jumpBuf > 0 && (this.coyote > 0 || this.jumpsLeft > 0)) {
      this.doJump(this.coyote > 0);
    }
    if (!keys.Space && !keys.ArrowUp && this.vy < -5.5) this.vy = -5.5;

    /* ---------- 重力 + 位移 ---------- */
    this.vy += 0.52; this.vy = clamp(this.vy, -14, 13);
    this.x += this.vx; this.y += this.vy;
    const wasAir = !this.onGround;
    this.groundCollide(plats);

    /* ---------- 落地 ---------- */
    if (this.onGround && wasAir) {
      const impact = clamp(Math.abs(this.vy) / 10, 0.3, 1.4);
      this.landT = 10;
      feel.shakeIt(2 + impact * 4);
      audio.land();
      spawnDust(this.cx, this.y, Math.round(4 + impact * 8), impact);
      if (impact > 0.9) feel.punch(0.03 * impact);
    }

    /* ---------- 状态 ---------- */
    const prevState = this.state;
    if (!this.onGround)        this.state = this.vy < 0 ? 'jump' : 'fall';
    else if (this.crouching)   this.state = 'crouch';
    else if (Math.abs(this.vx) > 0.35) this.state = 'run';
    else                       this.state = 'idle';
    // 只在真正需要重新起拍的几个状态上重置动作计时。
    // 原来任何状态变化都重置 —— 玩家减速时 run/idle 反复切换，
    // 待机动画被反复打断，实测要 41.5 帧才换一次帧（我设的是 18）。
    if (this.state !== prevState &&
        (this.state === 'hurt' || this.state === 'dead' ||
         this.state === 'crouch' || this.state === 'jump' || this.state === 'fall')) {
      this.animT = 0;
    }

    // 动作计时
    this.animT += 1;
    // 跑步相位：跟移动速度挂钩，但速率要压到"一个 4 帧循环约 0.45 秒"
    const spd = Math.abs(this.vx);
    if (this.onGround && spd > 0.35) {
      const prev = this.locoT;
      this.locoT += (1 + spd * 0.9) / ANIM_SPEED;
      if (Math.floor(prev / 26) !== Math.floor(this.locoT / 26)) {
        spawnDust(this.cx - this.facing * 8, this.y, 2, 0.5);
        audio.step();
      }
    }
  }

  // 实心碰撞（y 是脚底）。平台在画面上是从地表一直延伸到屏幕外的石柱，
  // 所以侧面必须挡 —— 只做顶面落地的话人会直接穿过去。
  groundCollide(plats) {
    const pushX = (p) => {
      const pb = { x: p.x, y: p.y, w: p.w, h: VH + 60 - p.y };
      const me = { x: this.x, y: this.y - this.h, w: this.w, h: this.h };
      if (!hit(me, pb)) return false;
      // ⭐ 关键：用「这一帧移动之前」的 y 判断是不是真的从侧面撞上去。
      // 站着的时候重力会把 y 往下压 0.52px，如果拿当前的 y 判断，
      // 每帧都会被当成"侧面重叠"，角色会被一路推出去（实测直接瞬移到 x=0）。
      // 移动前脚就在柱顶以上 → 是在柱顶上走 / 正要落到柱顶，不算侧面撞。
      if (this.y - this.vy <= pb.y + 1) return false;
      if (this.vx > 0) this.x = pb.x - this.w;
      else if (this.vx < 0) this.x = pb.x + pb.w;
      this.vx = 0;
      return true;
    };
    // 先解水平
    for (const p of plats) pushX(p);

    // 再解垂直（只做顶面落地：石柱没有底面可以撞）
    const prevBottom = this.y - this.vy;
    this.onGround = false;
    for (const p of plats) {
      if (this.x + this.w > p.x && this.x < p.x + p.w) {
        if (prevBottom <= p.y + 2 && this.y >= p.y && this.vy >= 0) {
          this.y = p.y; this.vy = 0; this.onGround = true;
          this.wall = 0;
        }
      }
    }
    this.x = clamp(this.x, 0, LEVEL_W - this.w);
  }

  // 水平方向是否被石柱挡住（给敌人判断要不要跳过去用）
  blockedX(plats) {
    for (const p of plats) {
      const pb = { x: p.x, y: p.y, w: p.w, h: VH + 60 - p.y };
      const me = { x: this.x + (this.dir > 0 ? 2 : -2), y: this.y - this.h, w: this.w, h: this.h };
      if (hit(me, pb) && this.y - this.vy > pb.y + 1) return true;
    }
    return false;
  }

  /* 当前该放图集的哪一帧：[动画名, 帧号] */
  spriteFrame() {
    if (this.attacking) {
      // 下劈的 active 有 120 帧、而且是"落地即结束"，按总时长比例取帧会永远卡在头两帧，
      // 所以按空中/落地两种状态分别取。
      if (this.atkName === 'dive') {
        // 6 帧：0 空中起手 / 1 翻身前倾 / 2 垂直俯冲 / 3 加速俯冲 / 4 砸中 / 5 落地定住
        if (this.hasHit && this.onGround) return ['dive', this.atkT > 12 ? 5 : 4];
        return ['dive', this.atkT < 5 ? 0 : (this.vy > 6 ? 3 : (this.vy > 2 ? 2 : 1))];
      }
      const sp = ATKSPR[this.atkName];
      if (sp) {
        const total = this.atk.startup + this.atk.active + this.atk.recovery;
        const p = this.atkT / Math.max(1, total);
        // 返回**小数帧号**：两个关键帧之间线性插值，交给 drawSpr 做交叉淡入。
        const K = sp.keys;
        let a = K[0][1], b = K[0][1], k0 = K[0][0], k1 = K[0][0];
        if (p >= K[K.length - 1][0]) {
          a = b = K[K.length - 1][1];
        } else {
          for (let i = 0; i < K.length - 1; i++) {
            if (p >= K[i][0] && p < K[i + 1][0]) {
              k0 = K[i][0]; k1 = K[i + 1][0]; a = K[i][1]; b = K[i + 1][1];
              break;
            }
          }
        }
        const u = k1 > k0 ? (p - k0) / (k1 - k0) : 1;
        return [sp.sheet, a + (b - a) * clamp(u, 0, 1)];
      }
    }
    if (this.state === 'dead')   return ['hurt', 2];
    if (this.state === 'hurt')   return ['hurt', Math.min(3, Math.floor(this.animT / 9))];
    if (this.blocking) {
      // block 4 帧：0 站姿 / 1 抬斧 / 2 架住 / 3 架住微动。
      // 前 8 帧用小数帧号平滑地把斧头抬起来，之后在 2/3 之间缓慢交替（呼吸感）。
      const t = this.animT;
      if (t < 8) return ['block', Math.min(2, t / 4)];
      return ['block', 2 + (((t / 26) | 0) % 2)];
    }
    if (this.state === 'crouch') {
      // crouch 4 帧：0 站姿 / 1 屈膝 / 2 深蹲 / 3 深蹲静置。
      // 前 10 帧用小数帧号平滑压到深蹲（交给 drawSpr 的交叉淡入），
      // 之后在 2/3 之间缓慢交替 —— 蹲着也有呼吸感，不是一张死图。
      const t = this.animT;
      if (t < 10) return ['crouch', Math.min(2, t / 5)];
      return ['crouch', 2 + (((t / 24) | 0) % 2)];
    }
    // 二段跳：蹬踏 / 前空翻 / 展开。只在空中播 —— 落地或受击时 state 不是 jump/fall，
    // 会自动落回 air / hurt，不用额外清计时器。
    if (this.airJumpT > 0 && (this.state === 'jump' || this.state === 'fall')) {
      return ['jump2', Math.min(5, Math.floor((1 - this.airJumpT / 20) * 6))];
    }
    // air 6 帧：0 快速上升 / 1 上升 / 2 顶点 / 3 开始下落 / 4 快速下落 / 5 落地瞬间
    if (this.state === 'jump')   return ['air', this.vy < -4 ? 0 : (this.vy < 0.6 ? 2 : 1)];
    if (this.state === 'fall')   return ['air', this.vy > 4 ? 4 : 3];
    if (this.landT > 5)          return ['air', 5];
    // 跑步 6 帧、待机 6 帧，单帧停留时间等比缩短，一圈总时长基本不变
    if (Math.abs(this.vx) > 0.35) return ['run', Math.floor(this.locoT / 18) % 6];
    return ['idle', Math.floor(this.animT / 15) % 6];
  }

  draw(g, level) {
    const sf = this.spriteFrame();

    // 残影（冲刺/大招时留一串半透明剪影）
    for (const t of this.trail) {
      t.life--;
      if (t.life <= 0) continue;
      g.save();
      g.globalAlpha = (t.life / 24) * 0.5;
      drawSpr(g, t.a, t.i, t.ax, t.ay, t.f);
      g.restore();
    }
    this.trail = this.trail.filter(t => t.life > 0);

    // 影子
    drawShadow(g, this.cx, this.y, 26, level.platforms, this.onGround ? 1 : 0.85);

    g.save();
    // 无敌帧：半透明而不是整个消失
    if (this.invuln > 0 && this.invuln % 6 < 3 && this.state !== 'dead') g.globalAlpha = 0.42;
    // 冷色轮廓光：深色重甲在雨夜里需要一圈边光才跳得出来。
    // 精灵图用 shadowBlur 直接给整张贴图描一圈，比逐形体描边便宜得多。
    if (rimLight) { g.shadowColor = 'rgba(118,178,235,0.55)'; g.shadowBlur = 4; }
    drawSprTinted(g, sf[0], sf[1], this.cx, this.y, this.facing,
      (this.hurtT > 0 && this.hurtT % 4 < 2) ? 'red' : null,
      (gg) => {
        // 下蹲不再靠缩放 —— 已有专门的图集动作，腿是真的弯下去的
        if (this.state === 'dead')   gg.rotate(74 * DEG);   // 倒地：绕脚底翻过去
      });
    g.restore();

    // 大招蓄力：脚下升起的红色光柱（超必杀演出的一部分）
    if (this.chargeFx > 0.02) {
      g.save();
      const a = this.chargeFx;
      g.globalAlpha = a * 0.55;
      // 雷霆蓄力：冷蓝光柱 + 绕着身体爬的电弧
      const grd = g.createLinearGradient(0, this.y - 150, 0, this.y);
      grd.addColorStop(0, 'rgba(90,160,255,0)');
      grd.addColorStop(1, 'rgba(160,220,255,' + (a * 0.72) + ')');
      g.fillStyle = grd;
      g.fillRect(this.cx - 24 * a, this.y - 150, 48 * a, 150);
      g.globalAlpha = a * 0.9;
      g.strokeStyle = '#BFE6FF'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(this.cx, this.y, 32 * a, 9 * a, 0, 0, Math.PI * 2); g.stroke();
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = 'rgba(210,238,255,' + (0.55 * a) + ')';
      g.lineWidth = 1.4;
      for (let i = 0; i < 3; i++) {
        const sgn = i % 2 ? 1 : -1;
        const pts = boltPts(this.cx + sgn * 6, this.y - 4,
                            this.cx + sgn * rnd(14, 30), this.y - rnd(40, 120), 7, 9);
        strokePts(g, pts);
      }
      g.restore();
    }
  }
}

class Wave {
  constructor(x, y, dir) {
    this.x = x; this.y = y; this.dir = dir;
    this.t = 0; this.life = 62; this.dead = false;
    this.hitSet = new Set();
  }
  get box() { return { x: this.x - 17, y: this.y - 18, w: 34, h: 36 }; }
  // 图集是「小球带电弧 → 拉长成彗星」6 帧，用时间轴推进；到顶以后两帧交替闪，
  // 不然会像一张静止贴图贴上去。
  get sprIdx() {
    const t = this.t;
    if (t < 3) return 0;
    if (t < 6) return 1;
    if (t < 26) return Math.min(5, 2 + Math.floor((t - 6) / 5));
    return ((t / 5) | 0) % 2 ? 4 : 5;
  }
  update() {
    this.x += this.dir * 3.8;
    this.t++; this.life--;
    if (this.t % 4 === 0) particles.push({ x: this.x - this.dir * 8, y: this.y + rnd(-8, 8),
      vx: this.dir * -0.6, vy: rnd(-0.8, 0.2), life: 12, col: C.blueL, s: 2 });
    if (this.life <= 0 || this.x < -40 || this.x > LEVEL_W + 40) this.dead = true;
  }
  draw(g) {
    const a = clamp(this.life / 16, 0, 1);
    // 加色辉光：半径刻意压在 26px 以内 —— 大尺寸 sprite 光晕会把夜景整片洗白
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.55 * a;
    const R = 26;
    const gr = g.createRadialGradient(this.x, this.y, 2, this.x, this.y, R);
    gr.addColorStop(0,   'rgba(170,228,255,0.95)');
    gr.addColorStop(0.45,'rgba(70,150,255,0.45)');
    gr.addColorStop(1,   'rgba(30,90,220,0)');
    g.fillStyle = gr;
    g.fillRect(this.x - R, this.y - R, R * 2, R * 2);
    g.restore();

    g.save();
    g.globalAlpha = a;
    drawSpr(g, 'ki', this.sprIdx, this.x, this.y, this.dir);
    g.restore();
  }
}
let waves = [];
function fireWave(p) {
  const wx = p.cx + p.facing * 20, wy = p.y - 34;
  waves.push(new Wave(wx, wy, p.facing));
  for (let i = 0; i < 12; i++) {
    const a = rnd(-Math.PI, Math.PI), sp = rnd(0.8, 3.2);
    particles.push({ x: wx, y: wy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.7,
      life: 14 + Math.random() * 8, col: i % 2 ? '#BFE8FF' : C.blueL, s: 2 });
  }
  audio.kiWave(); feel.shakeIt(3);
}

let pickups = [];          // BOSS 掉的属性点
let healthOrbs = [];       // 回血球（红色十字）
function spawnPickups(x, y, n) {
  for (let i = 0; i < n; i++) {
    pickups.push({ x: x + rnd(-16, 16), y: y - 18,
                   vx: rnd(-1.8, 1.8), vy: rnd(-5.4, -3.4), t: i * 7, life: 1200 });
  }
}
// heal 是最大生命的比例（0.25 = 回 25%）
function spawnHealthOrb(x, y, heal) {
  healthOrbs.push({ x, y: y - 18, vx: rnd(-1.5, 1.5), vy: rnd(-4.8, -3.2),
                    t: 0, life: 1500, heal: heal || 0.25 });
}
function updatePickups() {
  /* 永久属性点 */
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t++; p.life--;
    p.vy += 0.34; p.x += p.vx; p.y += p.vy; p.vx *= 0.985;
    const gy = groundBelow(p.x, p.y, level.platforms);
    const floor = (gy === null || gy === undefined) ? 236 : gy;
    if (p.y > floor) { p.y = floor; p.vy = 0; p.vx *= 0.78; }
    if (p.life <= 0 || p.x < -60 || p.x > LEVEL_W + 60) { pickups.splice(i, 1); continue; }
    // 拾取
    if (hit({ x: p.x - 15, y: p.y - 30, w: 30, h: 34 }, player.hitbox)) {
      pickups.splice(i, 1);
      progress.points++; saveProgress(progress);
      audio.ultCharge(); feel.shakeIt(4);
      for (let k = 0; k < 18; k++) {
        const a = rnd(0, Math.PI * 2);
        particles.push({ x: p.x, y: p.y - 16, vx: Math.cos(a) * rnd(1, 4), vy: Math.sin(a) * rnd(1, 4) - 1,
                         life: 22, col: k % 2 ? '#DFF4FF' : '#5FA8FF', s: 2 });
      }
    }
  }

  /* 回血球：满血时不捡，留在原地等下次 */
  for (let i = healthOrbs.length - 1; i >= 0; i--) {
    const orb = healthOrbs[i];
    orb.t++; orb.life--;
    orb.vy += 0.32; orb.x += orb.vx; orb.y += orb.vy; orb.vx *= 0.985;
    const gy = groundBelow(orb.x, orb.y, level.platforms);
    const floor = (gy === null || gy === undefined) ? 236 : gy;
    if (orb.y > floor) { orb.y = floor; orb.vy = 0; orb.vx *= 0.78; }
    if (orb.life <= 0 || orb.x < -60 || orb.x > LEVEL_W + 60) { healthOrbs.splice(i, 1); continue; }
    if (player.hp >= player.maxHp) continue;
    if (hit({ x: orb.x - 14, y: orb.y - 28, w: 28, h: 32 }, player.hitbox)) {
      healthOrbs.splice(i, 1);
      const heal = Math.max(1, Math.round(player.maxHp * orb.heal));
      player.hp = Math.min(player.maxHp, player.hp + heal);
      audio.band(0.35, 520, 1.0, 0.18, 980);
      feel.shakeIt(3);
      for (let k = 0; k < 18; k++) {
        const a = rnd(0, Math.PI * 2);
        particles.push({ x: orb.x, y: orb.y - 14, vx: Math.cos(a) * rnd(1, 3.6), vy: Math.sin(a) * rnd(1, 3.6) - 1,
                         life: 22, col: k % 2 ? '#FF6A6A' : '#FFD0D0', s: 2 });
      }
    }
  }
}
function drawPickups(g) {
  /* 属性点（原样） */
  for (const p of pickups) {
    const bob = Math.sin(p.t * 0.11) * 3.5;
    const cy = p.y - 16 + bob;
    g.save();
    g.globalCompositeOperation = 'lighter';
    const R = 22;
    const gr = g.createRadialGradient(p.x, cy, 1, p.x, cy, R);
    gr.addColorStop(0,    'rgba(255,255,255,0.95)');
    gr.addColorStop(0.34, 'rgba(120,215,255,0.55)');
    gr.addColorStop(1,    'rgba(60,120,255,0)');
    g.fillStyle = gr;
    g.fillRect(p.x - R, cy - R, R * 2, R * 2);
    g.restore();
    g.save();
    g.translate(p.x, cy);
    g.rotate(p.t * 0.035);
    g.fillStyle = '#EAF8FF';
    g.beginPath(); g.moveTo(0, -8); g.lineTo(5.5, 0); g.lineTo(0, 8); g.lineTo(-5.5, 0); g.closePath(); g.fill();
    g.fillStyle = '#5FA8FF';
    g.beginPath(); g.moveTo(0, -3.4); g.lineTo(2.4, 0); g.lineTo(0, 3.4); g.lineTo(-2.4, 0); g.closePath(); g.fill();
    g.restore();
  }

  /* 回血球：红色光晕 + 白色十字 */
  for (const orb of healthOrbs) {
    const bob = Math.sin(orb.t * 0.13) * 3.2;
    const cy = orb.y - 14 + bob;
    g.save();
    g.globalCompositeOperation = 'lighter';
    const R = 20;
    const gr = g.createRadialGradient(orb.x, cy, 1, orb.x, cy, R);
    gr.addColorStop(0,    'rgba(255,106,106,0.90)');
    gr.addColorStop(0.38, 'rgba(255,140,140,0.50)');
    gr.addColorStop(1,    'rgba(255,60,60,0)');
    g.fillStyle = gr;
    g.fillRect(orb.x - R, cy - R, R * 2, R * 2);
    g.restore();
    g.save();
    g.translate(orb.x, cy);
    g.rotate(Math.sin(orb.t * 0.03) * 0.20);
    g.fillStyle = '#FFE8E8';
    g.fillRect(-8, -2, 16, 4);
    g.fillRect(-2, -8, 4, 16);
    g.fillStyle = '#FF5A5A';
    g.fillRect(-6, -1.5, 12, 3);
    g.fillRect(-1.5, -6, 3, 12);
    g.restore();
  }
}

class Enemy {
  constructor(type, x, y) {
    const t = ENEMY_TYPES[type];
    Object.assign(this, t);
    this.type = type;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.hp = t.hp; this.maxHp = t.hp;
    this.dir = -1;
    this.onGround = false;
    this.flash = 0; this.hurtT = 0;
    this.white = 0;
    this.redT = 0;                             // 纯视觉：受击通红还持续几帧
    this.stagger = 0; this.staggerCd = 0;      // BOSS 硬直（受高额伤害时）
    this.dead = false;
    this.spin = 0; this.spinV = 0;
    this.phase = rnd(0, 6.28);
    this.attackCd = 0;
    this.wake = false;
    this.isBoss = t.kind === 'boss';
    this.hitCd = 0;
    this.wallHit = 0;
    this.walkOn = false;
    this.atkT = 0; this.atkCd = 0; this.skillCd = 0; this.atkKind = '';
    if (this.atkLen === undefined) this.atkLen = 34;
    this.turnT = 0;
    this.animT = rnd(0, 100);
    this.squash = 1;
    this.walkAcc = 0;
  }
  get hitbox() { return { x: this.x, y: this.y - this.h, w: this.w, h: this.h }; }
  get cx() { return this.x + this.w / 2; }

  hurt(dmg, kx, lift) {
    if (this.dead) return;
    // 铁卫的塔盾朝着玩家（dir 就指着玩家），所以"从正面来"= kx 方向和 dir 相反。
    // 正面只吃 40%，绕到背后打反倒有 1.6 倍背刺加成 —— 它转身要 34 帧，冲刺绕后是可行的。
    if (this.shield) {
      if (sign(kx) === -this.dir) {
        dmg = Math.max(1, Math.round(dmg * 0.4));
        audio.metalClang();
        for (let i = 0; i < 6; i++)
          particles.push({ x: this.cx + this.dir * 16, y: this.y - this.h * 0.55,
            vx: rnd(-2.4, 2.4), vy: rnd(-2.4, 0.6), life: 12, col: i % 2 ? '#fff' : '#9ED8FF', s: 2 });
      } else {
        dmg = Math.round(dmg * 1.6);
      }
    }
    this.hp -= dmg;
    this.flash = 7;
    this.hurtT = 12;                     // 玩法计时器：>0 期间敌人 AI 整个跳过（原值不动）
    // 染色是纯视觉，跟僵直解耦：杂兵红 12 帧，精英 15，BOSS 18 —— 越大的家伙红得越久。
    this.redT = this.isBoss ? 18 : (this.miniBoss ? 15 : 12);
    this.white = 3;                      // 前 3 帧白闪（拳皇式命中白），之后整段通通红
    this.wake = true;
    this.vx = kx * 0.9;
    if (lift) { this.vy = lift; this.spinV = -sign(kx || 1) * 0.22; }
    this.squash = 0.86;

    /* ★ BOSS 硬直：单次高额伤害把它的招式打断，并把它钉住约半秒。
       门槛 28 是照着基础伤害定的 —— 重击 34 / 升龙 30 / 雷霆天怒 60 够得到，
       轻击 12、冲锋 20、空中下劈 26 够不到。「重招才有硬直」这条线要立得住，
       否则轻击连点也能把它打成木桩。冷却 110 帧同理：硬直可以打断，但不能连成锁。*/
    if (this.isBoss && this.hp > 0 && dmg >= 28 && this.staggerCd <= 0) {
      this.stagger = 34; this.staggerCd = 110;
      this.atkT = 0; this.atkKind = '';            // 正在出的招直接掐掉
      this.skillCd = Math.max(this.skillCd, 30);   // 硬直爬起来后别立刻又甩技能
      audio.metalClang(); feel.freeze(6); feel.shakeIt(11); feel.punch(0.05);
      for (let i = 0; i < 14; i++)
        particles.push({ x: this.cx + rnd(-18, 18), y: this.y - rnd(10, this.h),
                         vx: rnd(-3.2, 3.2), vy: rnd(-3.8, 0.6), life: 22,
                         col: i % 3 ? '#FFD36B' : '#FF6A5A', s: 2 });
    }
    if (this.hp <= 0) {
      this.dead = true;
      this.spinV = -sign(kx || 1) * 0.3;
      if (this.isBoss) {
        audio.ko(); feel.freeze(14); feel.punch(0.14); feel.shakeIt(18);
        spawnPickups(this.cx, this.y, this.drops || 4);      // BOSS 掉属性点
      } else if (this.miniBoss) {
        audio.ko(); feel.freeze(8); feel.punch(0.08);
      }
      spawnDust(this.cx, this.y, 10, 1.2);
      // 回血球：普通怪 18%，精英/BOSS 必掉（BOSS 回得更多）
      const healChance = this.isBoss ? 1 : (this.miniBoss ? 1 : 0.18);
      if (rnd(0, 1) < healChance) {
        spawnHealthOrb(this.cx, this.y, this.isBoss ? 0.5 : 0.25);
      }
      for (let i = 0; i < 14; i++) {
        particles.push({ x: this.cx, y: this.y - this.h / 2, vx: rnd(-3.4, 3.4), vy: rnd(-4.4, 0),
                         life: 28, col: i % 2 ? this.eye : this.col2, s: 2 });
      }
    }
  }

  // 转身：普通怪立刻转，铁卫要 34 帧 —— 这就是"绕后背刺"的空间
  faceTo(dx) {
    const want = sign(dx) || this.dir;
    if (!this.shield) { this.dir = want; this.turnT = 0; return; }
    if (want !== this.dir) this.turnT++;
    else this.turnT = 0;
    if (this.turnT > 34) { this.dir = want; this.turnT = 0; }
  }

  // 前方是不是空的（悬崖）。BOSS/小BOSS 靠这个别一脚踩空 ——
  // 它们会一路追着玩家跑，实测第 2 关那个晶簇巨像就是这么自己走进坑里摔死的。
  ledgeAhead(level, dir) {
    if (!this.onGround) return false;
    const nx = this.cx + dir * (this.w * 0.5 + 16);
    return groundBelow(nx, this.y + 4, level.platforms) === null;
  }

  // 地面怪：朝玩家走；BOSS 会按距离在「近战重击」和「技能」之间选
  aiWalk(player, dx, dist, level) {
    this.faceTo(dx);

    if (this.isBoss) {
      const arena = level.bossArena;
      // 玩家还没进 BOSS 场地：守在场地里，不追到门口外面去
      if (arena && player.cx < arena.x - 8) { this.vx = 0; return; }
      this.vx = this.dir * this.spd;
      if (this.ledgeAhead(level, this.dir)) this.vx = 0;        // 坑沿上站住别迈
      if (this.wake && this.atkCd <= 0 && this.hurtT <= 0) {
        if (dist < this.reach) {
          this.atkCd = this.atkCool; this.atkT = this.atkLen; this.atkKind = 'melee';
        } else if (this.skill && this.skillCd <= 0 && dist < this.skillRange) {
          this.skillCd = this.skillCool; this.atkT = this.atkLen; this.atkKind = 'skill';
        }
      }
      return;
    }

    this.vx = this.dir * this.spd;
    if (this.miniBoss && this.ledgeAhead(level, this.dir)) this.vx = 0;
    if (this.melee && this.atkCd <= 0 && dist < this.reach && this.onGround) {
      this.atkCd = this.atkCool; this.atkT = this.atkLen; this.atkKind = 'lunge';
    }
  }

  // 飞行怪：悬停在玩家斜上方，靠近了就俯冲
  aiFly(player, dx, dist) {
    this.faceTo(dx);
    // ⚠️ 悬停高度必须落在玩家地面招式的打击范围内，否则这只怪在地面上根本打不到。
    //    玩家的重击判定框最高到脚上 46px、轻击只到 38px（W+K 升龙能到 86px）；
    //    原来悬停在 56px，轻/重击全打空 —— 等于一只打不死的怪一直蹭你的血。
    const hovY = player.y - 34 + Math.sin(this.animT * 0.07 + this.phase) * 6;
    const wantX = player.cx - this.dir * 30;
    this.vx = lerp(this.vx, clamp((wantX - this.cx) * 0.055, -2.3, 2.3), 0.10);
    this.vy = lerp(this.vy, clamp((hovY - this.y) * 0.055, -1.9, 1.9), 0.10);
    if (this.atkCd <= 0 && dist < this.reach) { this.atkCd = this.atkCool; this.atkT = this.atkLen; }
  }

  // 炮台：不移动，玩家进射程就蓄力
  aiTurret(player, dx, dist) {
    this.faceTo(dx);
    this.vx = 0;
    if (this.wake && this.atkCd <= 0 && dist < 330) { this.atkCd = this.atkCool; this.atkT = this.atkLen; }
  }

  // 面前的「嘴/爪」判定框：只有正面一小块能伤人（BOSS 走 bossSlam，不走这里）
  getMouthBox() {
    if (this.dmg <= 0 || this.isBoss || this.kind === 'turret') return null;
    let w = 22, h = 18, ahead = this.w * 0.30, height = this.h * 0.45;
    if (this.kind === 'quad')       { w = 28; h = 20; ahead = this.w * 0.35; height = this.h * 0.45; }
    else if (this.kind === 'biped') { w = 22; h = 28; ahead = this.w * 0.30; height = this.h * 0.35; }
    else if (this.kind === 'fly')   { w = 20; h = 16; ahead = this.w * 0.32; height = this.h * 0.50; }
    else if (this.kind === 'shell') { w = 22; h = 18; ahead = this.w * 0.38; height = this.h * 0.55; }
    const fx = this.dir > 0 ? this.x + this.w + ahead : this.x - ahead - w;
    return { x: fx, y: this.y - height - h, w: w, h: h };
  }

  // BOSS 近战重击：往前压一步 + 脚下冲击波 + 身前一记判定
  bossSlam(player) {
    this.vx = this.dir * 2.6;
    const fx = this.cx + this.dir * this.w * 0.45;
    spawnShock(fx, this.y, this.dir);
    spawnDust(fx, this.y, 16, 1.6);
    audio.boom(); feel.shakeIt(18); feel.punch(0.08);
    const box = { x: this.dir > 0 ? this.cx : this.cx - this.reach,
                  y: this.y - this.h - 12, w: this.reach, h: this.h + 34 };
    if (hit(box, player.hitbox)) player.hurt(Math.round(this.dmg * 1.35), this.dir * 1.7);
  }

  // BOSS 技能：三种，各自的射程和表现都不一样
  bossSkill(player) {
    const ox = this.cx + this.dir * this.w * 0.42, oy = this.y - this.h * 0.62;
    if (this.skill === 'volley') {
      // 钢牙：三门炮齐射
      const base = Math.atan2((player.y - 26) - oy, player.cx - ox);
      for (let i = -1; i <= 1; i++) eShots.push(new EShot(ox, oy, base + i * 0.17));
      spawnHitFx(ox, oy, false, this.dir);
      audio.kiWave(); feel.shakeIt(9);
    } else if (this.skill === 'quake') {
      // 霜核：双臂砸地，向两侧掀起冲击波
      spawnShock(this.cx, this.y, 1); spawnShock(this.cx, this.y, -1);
      spawnDust(this.cx, this.y, 24, 2.1);
      audio.boom(); feel.shakeIt(22); feel.punch(0.10);
      if (Math.abs(player.cx - this.cx) < 155 && player.y > this.y - 76)
        player.hurt(Math.round(this.dmg * 1.15), sign(player.cx - this.cx) || 1);
    } else if (this.skill === 'spread') {
      // 熔核：熔岩扇形弹幕
      const base = Math.atan2((player.y - 26) - oy, player.cx - ox);
      for (let i = -2; i <= 2; i++) eShots.push(new EShot(ox, oy, base + i * 0.13));
      audio.ultBurst(); feel.shakeIt(13); feel.punch(0.06);
    }
  }

  // 起手那一刻（前摇走完）的冲量 / 弹丸
  fireAttack(player) {
    const kind = this.atkKind || this.attack;
    if (kind === 'melee') { this.bossSlam(player); return; }
    if (kind === 'skill') { this.bossSkill(player); return; }
    if (this.attack === 'lunge') {
      this.vx = this.dir * this.lungeSpd;
      audio.dash();
      spawnDust(this.cx, this.y, 4, 0.7);
    } else if (this.attack === 'shot') {
      const ang = Math.atan2((player.y - 22) - (this.y - this.h * 0.55), player.cx - this.cx);
      eShots.push(new EShot(this.cx + this.dir * 18, this.y - this.h * 0.55, ang));
      audio.kiWave(); feel.shakeIt(3);
    }
  }

  update(level, player) {
    if (this.dead) return;
    if (this.flash > 0) this.flash--;
    if (this.white > 0) this.white--;
    if (this.redT > 0) this.redT--;
    if (this.hurtT > 0) this.hurtT--;
    if (this.attackCd > 0) this.attackCd--;
    if (this.hitCd > 0) this.hitCd--;
    if (this.wallHit > 0) this.wallHit--;
    if (this.atkCd > 0) this.atkCd--;
    if (this.skillCd > 0) this.skillCd--;
    if (this.staggerCd > 0) this.staggerCd--;
    this.squash = lerp(this.squash, 1, 0.2);
    this.walkOn = Math.abs(this.vx) > 0.25 && this.onGround;
    if (this.hurtT === 0 && this.onGround) this.spinV *= 0.85;
    this.spin += this.spinV;

    const dx = player.cx - this.cx, dist = Math.abs(dx);
    if (dist < (this.wakeDist || 200)) this.wake = true;

    if (this.stagger > 0) {
      // 硬直：AI 全部跳过，只剩惯性滑一点。想趁这半秒贴身输出就得趁现在。
      this.stagger--;
      this.vx *= 0.80;
    } else if (this.hurtT > 0) {
      this.vx *= 0.90;
    } else if (this.atkT > 0) {
      this.atkT--;
      if (this.atkT === this.atkLen - this.atkLead) this.fireAttack(player);
      this.vx *= 0.985;               // 出招全程保持冲势，别被寻敌逻辑把速度改回走路速度
    } else if (this.kind === 'fly') {
      this.aiFly(player, dx, dist);
    } else if (this.kind === 'turret') {
      this.aiTurret(player, dx, dist);
    } else if (this.wake) {
      this.aiWalk(player, dx, dist, level);
    } else {
      this.phase += 0.02;
      this.vx = Math.sin(this.phase) * 0.35;
    }

    if (this.kind === 'fly') this.vy = clamp(this.vy, -3.4, 3.8);   // 飞行怪不吃重力
    else { this.vy += 0.5; this.vy = clamp(this.vy, -14, 13); }
    this.x += this.vx; this.y += this.vy;
    if (this.kind === 'fly') {
      // ⚠️ 悬停高度在**位移之后**硬钳住（玩家脚上 24~38px）。
      //    上面那套 lerp 悬停只在没出招时才跑，出招期间蝙蝠按残余 vy 一直飘，
      //    实测能飘到脚上 50px —— 而玩家轻击只够到 38px、重击 46px，就成了打不死的怪。
      //    （原来悬停基准是 56px，那才是"地面完全够不到"，现在改成 34px。）
      //    钳在移动前做没用，位移还会把它带出去最多一个 vy。
      this.y = clamp(this.y, player.y - 38, player.y - 24);
      // 注意顺序：flyCollide 在钳制**之后**，所以贴着石柱飞时它会被顶到柱顶去"栖息"，
      // 那时得跳起来或升龙才够得到 —— 这是有意保留的（飞行怪停在岩架上很合理），
      // 但它只在柱子旁边发生，开阔地上永远落在上面那个可打到的带里。
      this.flyCollide(level.platforms);
    } else this.groundCollide(level.platforms);
    this.x = clamp(this.x, 0, LEVEL_W - this.w);
    if (this.isBoss && level.bossArena) {
      const a = level.bossArena;
      this.x = clamp(this.x, a.x + 6, a.x + a.w - this.w - 6);
    }

    // 撞到石柱侧面就跳过去，别在原地顶着不动
    if (this.wallHit > 0 && this.onGround) this.vy = this.isBoss ? -8.4 : -7.6;

    // 走路上下颠
    const moving = Math.abs(this.vx) > 0.25 && this.onGround;
    this.walkAcc += moving ? Math.abs(this.vx) : 0;
    if (moving || this.kind === 'fly' || this.kind === 'turret') this.animT += 1;

    // 只有面前那一小块「嘴/爪」判定能伤人 —— 不再按整只身体判定，背后和头顶都不吃
    if (this.hitCd <= 0 && !player.attacking) {
      const mouth = this.getMouthBox();
      if (mouth && hit(mouth, player.hitbox)) {
        this.hitCd = 56;
        player.hurt(this.dmg, sign(player.cx - this.cx) || 1);
      }
    }
  }

  // 飞行怪：只做"别钻进地里"的钳制
  flyCollide(plats) {
    for (const p of plats) {
      if (this.x + this.w > p.x && this.x < p.x + p.w) {
        if (this.y > p.y) { this.y = p.y; this.vy = Math.min(0, this.vy); }
      }
    }
    if (this.y > 600) this.dead = true;
  }

  groundCollide(plats) {
    // 和玩家一样是实心的，否则敌人会直接穿进石柱里
    for (const p of plats) {
      const pb = { x: p.x, y: p.y, w: p.w, h: VH + 60 - p.y };
      const me = { x: this.x, y: this.y - this.h, w: this.w, h: this.h };
      if (hit(me, pb) && this.y - this.vy > pb.y + 1) {
        if (this.vx > 0) this.x = pb.x - this.w;
        else if (this.vx < 0) this.x = pb.x + pb.w;
        this.vx = 0;
        this.wallHit = 6;                 // 记一下，供上层判断要不要跳过去
      }
    }
    const prevBottom = this.y - this.vy;
    this.onGround = false;
    for (const p of plats) {
      if (this.x + this.w > p.x && this.x < p.x + p.w) {
        if (prevBottom <= p.y + 2 && this.y >= p.y && this.vy >= 0) {
          this.y = p.y; this.vy = 0; this.onGround = true;
        }
      }
    }
    if (this.y > 600) this.dead = true;
  }

  // 返回 [图集动画名, 帧号]。野狼扑击期间播扑咬，其余时候播行走
  sprFrame() {
    // BOSS 出招：走专门的攻击图集（6 帧），用小数帧号 + 交叉淡入插值
    if (this.isBoss && this.atkT > 0 && SPR_MAN[this.spr + '_atk']) {
      const p = 1 - this.atkT / this.atkLen;
      // 0 起手 / 1 蓄势 / 2 举到最高 / 3 下砸 / 4 砸中 / 5 收势
      // ⚠️ 第 4 帧（砸中）要压在 p=0.40 —— atkLead/atkLen 就是这个比例，
      //    判定的那一帧正好是画面上砸中的那一帧。
      const K = [[0, 0], [0.12, 1], [0.24, 2], [0.32, 3], [0.40, 4], [0.70, 5]];
      let a = 0, b = 0, k0 = 0, k1 = 0;
      if (p >= K[K.length - 1][0]) { a = b = K[K.length - 1][1]; }
      else {
        for (let i = 0; i < K.length - 1; i++) {
          if (p >= K[i][0] && p < K[i + 1][0]) {
            k0 = K[i][0]; k1 = K[i + 1][0]; a = K[i][1]; b = K[i + 1][1]; break;
          }
        }
      }
      const u = k1 > k0 ? (p - k0) / (k1 - k0) : 1;
      return [this.spr + '_atk', a + (b - a) * clamp(u, 0, 1)];
    }
    // 只有普通野狼有专门的扑咬图集
    if (this.type === 'wolf' && this.atkT > 0 && SPR_MAN.ewolf_atk) {
      const p = 1 - this.atkT / this.atkLen;
      return ['ewolf_atk', Math.min(3, Math.floor(p * 3.99))];
    }
    // 炮台的 4 帧就是蓄力过程：平时停在第 0 帧（镜头发暗），开火时逐帧变亮
    if (this.kind === 'turret') {
      if (this.atkT > 0) {
        const p = 1 - this.atkT / this.atkLen;
        return [this.spr, p < 0.30 ? 1 : (p < 0.80 ? 2 : 3)];
      }
      return [this.spr, 0];
    }
    // 飞行怪悬停时也要扇翅膀
    if (this.kind === 'fly') return [this.spr, Math.floor(this.animT / 6) % 4];
    if (!this.walkOn) return [this.spr, 0];
    const per = this.isBoss ? 14 : 9;
    return [this.spr, Math.floor(this.animT / per) % 4];
  }

  draw(g, level) {
    if (this.dead) return;                      // 死亡即刻消失（死亡粒子已经另行生成）

    // 受击染色：前 3 帧白闪（顿帧里最亮的一下），随后整段通红。
    // 原来的写法是 `flash % 2 === 0` —— 红白每帧交替，看起来像闪烁而不是"挨打了"，
    // 而且 7 帧里只有 4 帧是红的，浅色怪（霜核、石壳）上几乎看不出来。
    // 现在改成"白 3 帧 → 一直红到 redT 结束"，杂兵 12 / 精英 15 / BOSS 18 帧
    // （redT 是独立的视觉计时器，不参与僵直判定，免得顺手改了难度）。
    //
    // 硬直则一律用更浓的红（red2）并让身体左右哆嗦 —— BOSS 隔着大血条，
    // 只有这点抖动能让玩家一眼看出"这半秒它被我打断了，赶紧上"。
    const stag = this.stagger > 0;
    const tintMode = stag ? 'red2' : (this.white > 0 ? 'white' : (this.redT > 0 ? 'red' : null));

    // 影子
    if (!this.dead) drawShadow(g, this.cx, this.y, this.w * 1.05, level.platforms, 1);

    const bob = Math.abs(Math.sin(this.animT * 0.16)) * (Math.abs(this.vx) > 0.25 ? 1.6 : 0.5);
    g.save();

    // 受击时给整张精灵挂一圈红边光，深色雨夜里这一点红才抓得住眼睛
    if (tintMode) {
      g.shadowColor = stag ? 'rgba(255,72,72,1)' : 'rgba(255,86,86,0.8)';
      g.shadowBlur = stag ? 12 : 7;
    }

    // 精灵本身朝左画，所以 dir=-1（朝左）不翻，dir=+1 才翻
    const sf = this.sprFrame();
    const jit = stag ? ((this.stagger % 4 < 2) ? -1.6 : 1.6) : 0;
    drawSprTinted(g, sf[0], sf[1], this.cx + jit, this.y - bob, -this.dir,
      tintMode,
      (gg) => {
        gg.rotate(this.spin);
        gg.scale(1 / this.squash, this.squash);   // 受击压扁 / 落地拉伸
      });
    g.restore();

    // 小怪血条
    if (!this.isBoss && this.hp < this.maxHp && !this.dead) {
      const bw = this.w, bx = Math.round(this.x), by = Math.round(this.y) - this.h - 9;
      g.fillStyle = 'rgba(0,0,0,0.7)'; g.fillRect(bx - 1, by - 1, bw + 2, 6);
      g.fillStyle = C.hpBG; g.fillRect(bx, by, bw, 4);
      g.fillStyle = C.hp;   g.fillRect(bx, by, bw * (this.hp / this.maxHp), 4);
    }
  }
}
