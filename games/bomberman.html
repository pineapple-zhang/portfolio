/* ===== §15 AUDIO ===========================================================
   全部程序合成，零外部音频文件 */
const AUDIO = {
  ctx: null, muted: false, master: null,
};

AUDIO.unlock = function () {
  if (AUDIO.ctx) { if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume(); return; }
  try {
    AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = 0.32;
    AUDIO.master.connect(AUDIO.ctx.destination);
  } catch (err) { AUDIO.ctx = null; }
};

AUDIO.play = function (kind) {
  if (!AUDIO.ctx || AUDIO.muted) return;
  const c = AUDIO.ctx, t = c.currentTime;
  const g = c.createGain(); g.connect(AUDIO.master);

  if (kind === 'place') {
    const o = c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(220,t);
    o.frequency.exponentialRampToValueAtTime(90,t+.09);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
    o.connect(g); o.start(t); o.stop(t+.11);
  } else if (kind === 'boom') {
    const n = noiseBuffer(c); const s = c.createBufferSource(); s.buffer = n;
    const f = c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(120,t+.34);
    g.gain.setValueAtTime(.85,t); g.gain.exponentialRampToValueAtTime(.001,t+.36);
    s.connect(f); f.connect(g); s.start(t); s.stop(t+.38);
  } else if (kind === 'pick') {
    [660,880,1180].forEach((fq,i)=>{
      const o = c.createOscillator(); o.type='triangle'; o.frequency.value=fq;
      const gg = c.createGain();
      gg.gain.setValueAtTime(.0001,t+i*.05);
      gg.gain.exponentialRampToValueAtTime(.4,t+i*.05+.01);
      gg.gain.exponentialRampToValueAtTime(.0001,t+i*.05+.12);
      o.connect(gg); gg.connect(AUDIO.master); o.start(t+i*.05); o.stop(t+i*.05+.14);
    });
    g.disconnect();
  } else if (kind === 'hurt') {
    const o = c.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(110,t+.3);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.connect(g); o.start(t); o.stop(t+.34);
  } else if (kind === 'shoot') {
    const o = c.createOscillator(); o.type='square';
    o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(260,t+.07);
    g.gain.setValueAtTime(.28,t); g.gain.exponentialRampToValueAtTime(.001,t+.08);
    o.connect(g); o.start(t); o.stop(t+.09);
  } else if (kind === 'shield') {
    const o = c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(1200,t); o.frequency.exponentialRampToValueAtTime(300,t+.2);
    g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.001,t+.22);
    o.connect(g); o.start(t); o.stop(t+.24);
  } else if (kind === 'tick') {
    const o = c.createOscillator(); o.type='square'; o.frequency.value = 880;
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);
    o.connect(g); o.start(t); o.stop(t+.08);
  }
};

function noiseBuffer(c) {
  const len = c.sampleRate * 0.4;
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  return buf;
}

/* ===== §16 FX ==============================================================
   震屏、粒子、飘字（纯表现，不参与逻辑） */
const FX = { shakeAmt:0, shakeUntil:0, parts: [], texts: [] };

FX.shake = function (amt) { FX.shakeAmt = Math.max(FX.shakeAmt, amt); FX.shakeUntil = GAME.now + 220; };

FX.burst = function (x, y, theme) {
  for (let i = 0; i < 7; i++) {
    const a = Math.random()*6.283, s = 1.5 + Math.random()*2.5;
    FX.parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, max:0.5,
                    color: Math.random()<.5 ? theme.soft : theme.softTop });
  }
};

FX.text = function (e, str) { FX.texts.push({ x:e.x, y:e.y, str, life:1 }); };

FX.update = function (dt) {
  for (let i = FX.parts.length-1; i>=0; i--) {
    const p = FX.parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt / p.max;
    if (p.life <= 0) FX.parts.splice(i,1);
  }
  for (let i = FX.texts.length-1; i>=0; i--) {
    const t = FX.texts[i];
    t.y -= dt*1.1; t.life -= dt/1.1;
    if (t.life <= 0) FX.texts.splice(i,1);
  }
  if (GAME.now > FX.shakeUntil) FX.shakeAmt *= 0.86;
};

FX.draw = function (ctx) {
  ctx.save();
  ctx.translate(BOARD_X, BOARD_Y);
  for (const p of FX.parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x*CFG.CELL-3, p.y*CFG.CELL-3, 6, 6);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px "PingFang SC",system-ui,sans-serif';
  for (const t of FX.texts) {
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 3;
    ctx.strokeText(t.str, t.x*CFG.CELL, t.y*CFG.CELL);
    ctx.fillText(t.str, t.x*CFG.CELL, t.y*CFG.CELL);
  }
  ctx.restore();
};

/* ===== §17 RENDER ========================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');

function fitStage() {
  const pad = 16;
  const s = Math.min((window.innerWidth-pad)/cv.width, (window.innerHeight-pad)/cv.height, 1);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.width = cv.width + 'px';
  stage.style.height = cv.height + 'px';
}
window.addEventListener('resize', fitStage);

const RENDER = {};

RENDER.frame = function () {
  const th = ARENA.theme || THEMES[0];
  ctx.save();
  if (FX.shakeAmt > 0.3) {
    ctx.translate((Math.random()-.5)*FX.shakeAmt, (Math.random()-.5)*FX.shakeAmt);
  }

  // 背景
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(-20,-20, cv.width+40, cv.height+40);

  HUD.draw(ctx);

  ctx.save();
  ctx.translate(BOARD_X, BOARD_Y);

  // 地板
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = ((x + y) & 1) ? th.floor2 : th.floor;
      ctx.fillRect(x*CFG.CELL, y*CFG.CELL, CFG.CELL, CFG.CELL);
    }
  }
  // 格子分隔线
  ctx.strokeStyle = 'rgba(0,0,0,.10)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 1; x < COLS; x++) { ctx.moveTo(x*CFG.CELL+.5, 0); ctx.lineTo(x*CFG.CELL+.5, BOARD_H); }
  for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y*CFG.CELL+.5); ctx.lineTo(BOARD_W, y*CFG.CELL+.5); }
  ctx.stroke();

  // 方块
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = ARENA.tiles[idx(x,y)];
      if (t === T.FLOOR) continue;
      drawBlock(ctx, x, y, t, th);
    }
  }

  // F1 调试视图
  if (GAME.debug) drawDebug(ctx);

  // 掉落道具
  for (const it of ITEM.list) {
    const sc = 1 + it.pop * 0.6;
    const px = it.x*CFG.CELL, py = it.y*CFG.CELL;
    ctx.save();
    ctx.translate(px, py); ctx.scale(sc, sc);
    drawIcon(ctx, it.name, 0, 0, 17);
    ctx.restore();
  }

  // 地雷
  for (const m of WEP.mines) {
    const px = m.cx*CFG.CELL + CFG.CELL/2, py = m.cy*CFG.CELL + CFG.CELL/2;
    const armed = GAME.now >= m.armAt;
    ctx.fillStyle = armed ? '#ff4d4d' : '#777';
    ctx.beginPath(); ctx.arc(px, py, 8, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    if (armed && ((GAME.now/160)|0) % 2 === 0) {
      ctx.fillStyle = '#ffe'; ctx.beginPath(); ctx.arc(px, py, 3, 0, 6.283); ctx.fill();
    }
  }

  // 炸弹
  for (const b of BOMB.list) {
    if (b.detonated) continue;
    const px = b.cx*CFG.CELL + CFG.CELL/2, py = b.cy*CFG.CELL + CFG.CELL/2;
    const age = (GAME.now - b.placedAt) / CFG.BOMB_FUSE;
    const pulse = 1 + Math.sin(GAME.now/70) * 0.06 * (0.4 + age);
    ctx.save(); ctx.translate(px, py); ctx.scale(pulse, pulse);
    ctx.fillStyle = '#15181d';
    ctx.beginPath(); ctx.arc(0, 1, 14, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.arc(-4, -4, 4.5, 0, 6.283); ctx.fill();
    // 引信
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(4, -11); ctx.quadraticCurveTo(11, -17, 7, -23); ctx.stroke();
    // 火花
    const sp = 2 + Math.abs(Math.sin(GAME.now/60))*2.6;
    ctx.fillStyle = age > .66 ? '#ffd24d' : '#ff8a3d';
    ctx.beginPath(); ctx.arc(7, -24, sp, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  // 子弹
  for (const b of WEP.bullets) {
    const px = b.x*CFG.CELL, py = b.y*CFG.CELL;
    if (b.kind === 'rocket') {
      ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(b.dy, b.dx));
      ctx.fillStyle = '#e8e8e8'; ctx.fillRect(-8,-3,14,6);
      ctx.fillStyle = '#ff5c3d'; ctx.beginPath();
      ctx.moveTo(6,-3); ctx.lineTo(11,0); ctx.lineTo(6,3); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath(); ctx.arc(px, py, 3.2, 0, 6.283); ctx.fill();
    }
  }

  // 火焰
  for (const ex of BOOM.list) {
    const k = (ex.until - GAME.now) / CFG.BOOM_MS;
    for (let ci = 0; ci < ex.cells.length; ci++) {
      const cell = ex.cells[ci];
      const cx = cell % COLS, cy = (cell / COLS) | 0;
      const px = cx*CFG.CELL, py = cy*CFG.CELL;
      const isCore = ci === 0;
      const grow = Math.min(1, (1-k)*4);
      ctx.globalAlpha = Math.max(0, k) * 0.95;
      const grad = ctx.createRadialGradient(px+CFG.CELL/2, py+CFG.CELL/2, 2,
                                            px+CFG.CELL/2, py+CFG.CELL/2, CFG.CELL*0.62*grow);
      grad.addColorStop(0, isCore ? '#ffffff' : '#fff3b0');
      grad.addColorStop(0.45, '#ffcf3d');
      grad.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(px-3, py-3, CFG.CELL+6, CFG.CELL+6);
    }
    ctx.globalAlpha = 1;
  }

  // 角色（先画非本地玩家，本地玩家压在最上层）
  for (const e of ENT.list) if (e.id !== GAME.localA && e.id !== GAME.localB) drawEnt(ctx, e);
  for (const e of ENT.list) if (e.id === GAME.localA || e.id === GAME.localB) drawEnt(ctx, e);

  FX.draw(ctx);
  ctx.restore();
  ctx.restore();
};

function drawBlock(ctx, x, y, t, th) {
  const px = x*CFG.CELL, py = y*CFG.CELL;
  if (t === T.HARD) {
    ctx.fillStyle = th.hard;
    ctx.fillRect(px+1, py+1, CFG.CELL-2, CFG.CELL-2);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(px+1, py+1, CFG.CELL-2, 5);
    ctx.strokeStyle = th.edge; ctx.lineWidth = 2;
    ctx.strokeRect(px+1.5, py+1.5, CFG.CELL-3, CFG.CELL-3);
  } else {
    ctx.fillStyle = th.soft;
    ctx.fillRect(px+2, py+2, CFG.CELL-4, CFG.CELL-4);
    ctx.fillStyle = th.softTop;
    ctx.fillRect(px+2, py+2, CFG.CELL-4, 8);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
    ctx.strokeRect(px+2.5, py+2.5, CFG.CELL-5, CFG.CELL-5);
    ctx.beginPath();
    ctx.moveTo(px+2, py+CFG.CELL-2); ctx.lineTo(px+CFG.CELL-2, py+2);
    ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.stroke();
  }
}

/** F1 调试视图：每格危险倒计时、机器人逃逸路径、当前 plan
    M4 的验收就靠它 —— 机器人往火里走、卡在角落，在这里一眼能看出来。 */
function drawDebug(ctx) {
  ctx.save();
  ctx.font = '9px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = idx(x,y);
      if (ARENA.tiles[i] !== T.FLOOR) continue;
      const d = AI.realDanger[i];
      if (d === Infinity) continue;
      const px = x*CFG.CELL, py = y*CFG.CELL;
      const left = d - GAME.now;
      const k = left <= 0 ? 1 : Math.max(0, 1 - left/(CFG.BOMB_FUSE + 900));
      ctx.fillStyle = 'rgba(255,60,40,' + (0.10 + k*0.45).toFixed(2) + ')';
      ctx.fillRect(px, py, CFG.CELL, CFG.CELL);
      ctx.fillStyle = left <= 0 ? '#ffffff' : '#ffd24d';
      ctx.fillText(left <= 0 ? '!!' : (left/1000).toFixed(1), px+CFG.CELL/2, py+CFG.CELL/2);
    }
  }
  for (const e of ENT.list) {
    if (!e.isBot || !e.alive || !e.ai) continue;
    const path = e.ai.path;
    if (path && path.length > 1) {
      ctx.strokeStyle = e.color; ctx.lineWidth = 3; ctx.globalAlpha = 0.85;
      ctx.beginPath();
      for (let k = 0; k < path.length; k++) {
        const px = (path[k] % COLS)*CFG.CELL + CFG.CELL/2;
        const py = ((path[k]/COLS)|0)*CFG.CELL + CFG.CELL/2;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const tx = e.x*CFG.CELL, ty = e.y*CFG.CELL - CFG.CELL*0.95;
    ctx.font = 'bold 10px monospace';
    const label = (e.ai.lastPlan || '?') + (e.stunnedUntil > GAME.now ? ' 眩晕' : '');
    const w = ctx.measureText(label).width + 8;
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.fillRect(tx - w/2, ty - 8, w, 14);
    ctx.fillStyle = e.color;
    ctx.fillText(label, tx, ty);
  }
  ctx.restore();
}

/** 道具图标：矢量绘制，接图后可以整体替换 */
function drawIcon(ctx, name, cx, cy, r) {
  ctx.save(); ctx.translate(cx, cy);
  const P = {
    bomb:'#ff8a3d', power:'#ff5c3d', speed:'#5ac8fa', push:'#a8e063',
    shield:'#7ad3ff', invincibility:'#ffd93d', heart:'#ff5c8a',
    double_shotgun:'#c0c6cf', rocket_launcher:'#ff9a3d', landmine:'#ff4d4d',
    frog:'#6ddc6d', bulldozer:'#e8b04d', race_car:'#ff6b6b',
  }[name] || '#ccc';
  ctx.fillStyle = P;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#10141a';
  ctx.font = 'bold ' + (r*1.15) + 'px "PingFang SC",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const G = { bomb:'弹', power:'力', speed:'速', push:'踢', shield:'盾',
              invincibility:'无', heart:'心', double_shotgun:'枪', rocket_launcher:'炮',
              landmine:'雷', frog:'蛙', bulldozer:'推', race_car:'车' }[name] || '?';
  ctx.fillText(G, 0, 1);
  ctx.restore();
}

/** 角色外观。矢量模式下靠这几个辨识点把两个主角区分开：
    男孩黑发 + 额前黄色挑染，女孩红发高马尾 + 西瓜发饰。
    接入精灵图后这一层会被 ART 取代，但保底形象始终在。 */
const LOOKS = [
  { robe:'#efe8d6', trim:'#5fae9a', hair:'#221f1c', accent:'#ffd93d', skin:'#f5d6b8', style:'streak'    }, // 1P 黑发男孩
  { robe:'#efe8d6', trim:'#3f8f4a', hair:'#c0392b', accent:'#3fae5a', skin:'#f9dcbe', style:'ponytail'  }, // 2P 西瓜女孩
  { robe:'#cdd6e2', trim:'#5a7186', hair:'#1f2a3a', accent:'#5ac8fa', skin:'#f0d0b0', style:'short'     }, // 机器人·阿岩
  { robe:'#e3dcc4', trim:'#7f8a4a', hair:'#3a2a1c', accent:'#a8e063', skin:'#f2d4b4', style:'short'     }, // 机器人·小满
  { robe:'#ded0e8', trim:'#7a5a9a', hair:'#2a1f3a', accent:'#c792ea', skin:'#f2d4b4', style:'bun'       }, // 机器人·铁蛋
];

function drawEnt(ctx, e) {
  if (!e.alive) return;
  const px = e.x*CFG.CELL, py = e.y*CFG.CELL;
  const R = CFG.RADIUS*CFG.CELL;
  const invuln = GAME.now < e.invulnUntil;
  const L = LOOKS[e.look] || LOOKS[2];

  ctx.save();
  ctx.translate(px, py);
  // 硬闪烁在 5 人同场时太乱，无敌改成半透明 + 金环
  if (invuln) ctx.globalAlpha = 0.5;

  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, R*0.72, R*0.92, R*0.4, 0, 0, 6.283); ctx.fill();

  // 眩晕圈
  if (e.stunnedUntil > GAME.now) {
    ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -R*0.5, R*1.25, 0, 6.283); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = GAME.now/240 + i*2.09;
      ctx.fillStyle = '#ffd93d';
      ctx.beginPath();
      ctx.arc(Math.cos(a)*R*1.25, -R*0.5 + Math.sin(a)*R*0.36, 3, 0, 6.283);
      ctx.fill();
    }
  }

  // 载具底盘
  if (e.vehicle) {
    ctx.fillStyle = { frog:'#4caf50', bulldozer:'#c9932e', race_car:'#e04848' }[e.vehicle];
    roundRect(ctx, -R*1.15, -R*0.35, R*2.3, R*1.5, R*0.4); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2; ctx.stroke();
  }

  const [dx,dy] = DIRV[e.dir];        // 朝向单位向量
  const facingUp = e.dir === 0;

  const sprite = ART.mode === 'sprite' ? ART.get(ART.key(e)) : null;
  if (sprite) {
    // 精灵图：底边压在脚下、向上生长，整体约一格高
    const dh = R * 2.95;
    const dw = dh * (sprite.width / sprite.height);
    ctx.drawImage(sprite, -dw/2, R * 1.06 - dh, dw, dh);
  } else {

  // ── 长袍 ──
  ctx.fillStyle = L.robe;
  roundRect(ctx, -R*0.86, -R*0.78, R*1.72, R*1.72, R*0.42); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.42)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = L.trim;
  ctx.fillRect(-R*0.86, R*0.66, R*1.72, R*0.28);            // 青绿下摆
  ctx.fillRect(-R*0.11, -R*0.78, R*0.22, R*1.44);           // 中缝衣襟
  ctx.fillStyle = '#7a5236';                                 // 腰带
  ctx.fillRect(-R*0.86, R*0.20, R*1.72, R*0.24);

  // ── 头 ──
  const hx = dx*R*0.14, hy = dy*R*0.12 - R*0.30;
  ctx.fillStyle = L.skin;
  ctx.beginPath(); ctx.arc(hx, hy, R*0.60, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1.5; ctx.stroke();

  // ── 头发 ──
  ctx.fillStyle = L.hair;
  if (facingUp) {
    ctx.beginPath(); ctx.arc(hx, hy, R*0.62, 0, 6.283); ctx.fill();   // 背面只见后脑
  } else {
    ctx.beginPath();
    ctx.arc(hx, hy, R*0.63, Math.PI*0.90, Math.PI*2.10);
    ctx.closePath(); ctx.fill();
  }
  if (L.style === 'streak') {
    // 额前那一撮黄色挑染 —— 这是 1P 最强的辨识点
    ctx.fillStyle = L.accent;
    ctx.beginPath();
    ctx.ellipse(hx + R*0.22, hy - R*0.44, R*0.28, R*0.12, -0.42, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = L.hair;                                            // 身后垂下的长发
    ctx.beginPath();
    ctx.ellipse(hx - dx*R*0.10, hy + R*0.66, R*0.44, R*0.28, 0, 0, 6.283);
    ctx.fill();
  } else if (L.style === 'ponytail') {
    ctx.fillStyle = L.hair;                                            // 红色高马尾
    ctx.beginPath();
    ctx.ellipse(hx - dx*R*0.58, hy + R*0.26, R*0.60, R*0.25, -dy*0.45, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = '#2f8f4a';                                         // 西瓜发饰：皮
    ctx.beginPath(); ctx.ellipse(hx + R*0.02, hy - R*0.60, R*0.26, R*0.15, -0.28, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#e74c3c';                                         // 西瓜发饰：瓤
    ctx.beginPath(); ctx.ellipse(hx + R*0.02, hy - R*0.58, R*0.17, R*0.08, -0.28, 0, 6.283); ctx.fill();
  } else if (L.style === 'bun') {
    ctx.fillStyle = L.hair;
    ctx.beginPath(); ctx.arc(hx - dx*R*0.38, hy - R*0.44, R*0.32, 0, 6.283); ctx.fill();
  } else {
    ctx.fillStyle = L.hair;
    ctx.beginPath(); ctx.arc(hx - dx*R*0.32, hy - R*0.28, R*0.34, 0, 6.283); ctx.fill();
  }

  // ── 眼睛（提供朝向信息）──
  if (!facingUp) {
    const ex = hx + dx*R*0.20, ey = hy + dy*R*0.16 + R*0.08;
    ctx.fillStyle = '#10141a';
    ctx.beginPath(); ctx.arc(ex - R*0.20, ey, R*0.095, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + R*0.20, ey, R*0.095, 0, 6.283); ctx.fill();
  }

  }  // end vector fallback

  // 护盾
  if (e.shield) {
    ctx.strokeStyle = 'rgba(122,211,255,.9)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, R*1.3, 0, 6.283); ctx.stroke();
  }

  // 无敌环
  if (invuln) {
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,217,61,.85)'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, R*1.45, GAME.now/300, GAME.now/300 + 6.283);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 名字
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px "PingFang SC",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 3;
  ctx.strokeText(e.name, 0, -R*1.15);
  ctx.fillText(e.name, 0, -R*1.15);

  ctx.restore();
}

/* ===== §18 GAME ============================================================ */
const GAME = {
  state: 'menu',          // menu | countdown | playing | paused | over
  now: 0,
  matchEnd: 0,
  prev: 0,
  acc: 0,
  mode: 'ffa',
  modeName: '自由混战',
  difficulty: 'normal',
  pendingMode: 'ffa',
  pendingDiff: 'normal',
  localA: 1, localB: 2,
  teamPool: [0, 0],
  lastTick: 0,
};

GAME.toMenu = function () {
  GAME.state = 'menu';
  SCREEN.renderMenu();
  SCREEN.show('menu');
};

GAME.start = function () {
  GAME.mode = GAME.pendingMode;
  GAME.difficulty = GAME.pendingDiff;
  GAME.modeName = (GAME.mode === 'team' ? '团队战 2v3' : '自由混战')
                + ' · 机器人' + (DIFF_LABEL[GAME.difficulty] || '普通');
  SCREEN.hideAll();

  ENT.reset(); BOMB.list.length = 0; BOOM.list.length = 0;
  ITEM.list.length = 0; WEP.reset();
  FX.parts.length = 0; FX.texts.length = 0;

  ARENA.gen(-1, null);

  const P_COLORS = ['#ffd93d','#ff5c8a','#5ac8fa','#a8e063','#c792ea'];
  const NAMES = ['1P 黑衣侠', '2P 西瓜侠', '机器人·阿岩', '机器人·小满', '机器人·铁蛋'];

  // 出生点分配：两个真人固定四角，机器人在其余点
  const order = [0, 3, 1, 2, 4];
  for (let i = 0; i < 5; i++) {
    const [sx, sy] = SPAWNS[order[i]];
    const isBot = i >= 2;
    const e = ENT.create({
      name: NAMES[i],
      isBot,
      team: GAME.mode === 'team' ? (isBot ? 1 : 0) : i,
      color: P_COLORS[i],
    });
    e.look = i;                       // 决定矢量形象（发色/服饰/挑染/马尾）
    e.x = sx + 0.5; e.y = sy + 0.5;
  }
  GAME.localA = ENT.list[0].id;
  GAME.localB = ENT.list[1].id;
  GAME.teamPool = [6, 6];

  Input.init(5);          // 2 真人 + 3 机器人，共用同一套输入结构
  GAME.now = 0; GAME.prev = performance.now();
  GAME.acc = 0;
  GAME.matchEnd = CFG.COUNTDOWN + CFG.MATCH_TIME;
  GAME.state = 'countdown';
  GAME.lastTick = 0;
  GAME.spawnInvulnUntil = CFG.COUNTDOWN + CFG.SPAWN_INVULN;
  for (const e of ENT.list) e.invulnUntil = CFG.COUNTDOWN + CFG.SPAWN_INVULN;
};

GAME.pause = function () {
  if (GAME.state !== 'playing' && GAME.state !== 'countdown') return;
  GAME.state = 'paused';
  SCREEN.renderPause(); SCREEN.show('pause');
};
GAME.resume = function () {
  if (GAME.state !== 'paused') return;
  GAME.state = 'playing';
  SCREEN.hideAll();
  GAME.prev = performance.now();
};

GAME.finish = function (reason) {
  GAME.state = 'over';
  const rows = ENT.list.map(e => {
    let s = e.score + (e.alive ? e.lives * CFG.P_PER_LIFE : 0);
    if (e.alive) s += Math.floor((GAME.now - CFG.COUNTDOWN) / 1000) * CFG.P_PER_SEC;
    return { name:e.name, color:e.color, score:Math.round(s), kills:e.kills,
             deaths:e.deaths, me:!e.isBot, alive:e.alive, team:e.team };
  });
  rows.sort((a,b) => b.score - a.score);
  SCREEN.renderResult(rows, reason || '本 局 结 束');
  SCREEN.show('result');
};

/* ---- 主循环：固定时间步，逻辑 60Hz，渲染插值 ---- */
const STEP = 1000/60;

function loop(ts) {
  requestAnimationFrame(loop);
  if (GAME.state === 'menu') { RENDER.frame(); return; }

  let dtReal = ts - GAME.prev;
  GAME.prev = ts;
  if (dtReal > 200) dtReal = 200;
  if (GAME.state === 'paused' || GAME.state === 'over') { RENDER.frame(); return; }

  GAME.acc += dtReal;
  let steps = 0;
  while (GAME.acc >= STEP && steps < 5) {
    GAME.step(STEP/1000);
    GAME.acc -= STEP;
    steps++;
  }
  if (steps === 5) GAME.acc = 0;
  RENDER.frame();
}

GAME.step = function (dt) {
  if (GAME.state === 'paused' || GAME.state === 'over' || GAME.state === 'menu') return;
  GAME.now += dt*1000;

  if (GAME.state === 'countdown') {
    if (GAME.now >= CFG.COUNTDOWN) GAME.state = 'playing';
    else {
      const n = Math.ceil((CFG.COUNTDOWN - GAME.now)/1000);
      if (n !== GAME.lastTick) { GAME.lastTick = n; if (n > 0) AUDIO.play('tick'); }
    }
    return;
  }

  // 机器人决策必须先跑，它们也只能通过虚拟输入操作角色
  AI.update(dt);

  // 输入 → 行动（真人键盘 / 机器人虚拟输入，共用同一段物理）
  for (let i = 0; i < ENT.list.length; i++) {
    const e = ENT.list[i];
    if (i < 2) Input.sample(i, GAME.now);
    if (!e || !e.alive) continue;
    const s = Input.state[i];
    if (!s) continue;
    ENT.move(e, (s.right - s.left), (s.down - s.up), dt);
    if (s.bomb) {
      if (i < 2) Input.consumeBomb(i); else s.bomb = 0;
      if (e.weapon && e.ammo > 0) WEP.fire(e); else BOMB.place(e);
    }
  }

  BOMB.update();
  BOOM.update();
  ITEM.update();
  ITEM.updateVehicles();
  WEP.update(dt);
  FX.update(dt);

  // 踢炸弹
  for (const b of BOMB.list) {
    if (b.detonated) continue;
    for (const e of ENT.list) {
      if (!e.alive || !e.hasPush) continue;
      if (Math.floor(e.x) === b.cx && Math.floor(e.y) === b.cy) {
        const [dx,dy] = DIRV[e.dir];
        const nx = b.cx+dx, ny = b.cy+dy;
        if (inB(nx,ny) && ARENA.tiles[idx(nx,ny)] === T.FLOOR && ARENA.bombAt[idx(nx,ny)] < 0) {
          ARENA.bombAt[b.cell] = -1;
          b.cx = nx; b.cy = ny; b.cell = idx(nx,ny);
          ARENA.bombAt[b.cell] = BOMB.list.indexOf(b);
          b.detonateAt = GAME.now + CFG.BOMB_FUSE;
        }
      }
    }
  }

  // 队伍共享生命池
  if (GAME.mode === 'team') TEAM.update();

  // 结束判定
  const aliveHumans = ENT.list.filter(e => !e.isBot && e.alive).length;
  const aliveBots   = ENT.list.filter(e =>  e.isBot && e.alive).length;
  if (GAME.mode === 'team') {
    if (aliveHumans === 0 || aliveBots === 0) return GAME.finish('团 队 战 结 束');
  } else {
    if (ENT.list.filter(e => e.alive).length <= 1) return GAME.finish('混 战 结 束');
  }
  if (GAME.now >= GAME.matchEnd) return GAME.finish('时 间 到');
};

/* ---- 键盘 ---- */
window.addEventListener('keydown', ev => {
  if (ev.code === 'Escape') {
    if (GAME.state === 'playing' || GAME.state === 'countdown') GAME.pause();
    else if (GAME.state === 'paused') GAME.resume();
    return;
  }
  if (ev.code === 'KeyM') {
    AUDIO.muted = !AUDIO.muted;
    if (AUDIO.master) AUDIO.master.gain.value = AUDIO.muted ? 0 : 0.32;
    return;
  }
  if (ev.code === 'F1') { ev.preventDefault(); GAME.debug = !GAME.debug; return; }
  // 防止空格/方向键滚动页面
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(ev.code)) ev.preventDefault();
  Input.onKey(ev.code, true, GAME.now);
}, { passive:false });

window.addEventListener('keyup', ev => { Input.onKey(ev.code, false, GAME.now); });
window.addEventListener('blur', () => {
  Input.raw = Object.create(null);
  for (const s of Input.state) { s.up=s.down=s.left=s.right=s.bomb=0; s._bombHeld=false; }
  if (GAME.state === 'playing' || GAME.state === 'countdown') GAME.pause();
});

/* ---- 启动 ---- */
fitStage();
SCREEN.renderMenu();
requestAnimationFrame(loop);

// 暴露给调试与无头模拟
window.__G = { GAME, ENT, ARENA, BOMB, BOOM, ITEM, WEP, AI, TEAM, Input, CFG, HURT, FX, T };

})();
</script>
