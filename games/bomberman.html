<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>炸弹人 · 双人对战</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2b3440;
    --txt:#e6edf3; --dim:#8b949e; --hi:#63f600; --warn:#ffb020;
    --p1:#ffd93d; --p2:#ff5c8a; --bot:#5ac8fa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt); overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
  }
  #stage{position:relative; transform-origin:center center;}
  canvas{display:block; background:#000; border-radius:6px;}
  .overlay{
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:rgba(8,11,16,.88); backdrop-filter:blur(3px);
    border-radius:6px; text-align:center; padding:24px;
  }
  .overlay.on{display:flex;}
  h1{font-size:30px; letter-spacing:2px; margin-bottom:6px;}
  h1 .a{color:var(--p1);} h1 .b{color:var(--p2);}
  .sub{color:var(--dim); font-size:13px; margin-bottom:22px; line-height:1.7;}
  .btn{
    display:block; width:260px; margin:7px 0; padding:11px 18px;
    background:var(--panel); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; font-size:15px; font-family:inherit; cursor:pointer;
    transition:.14s;
  }
  .btn:hover{background:#1f2733; border-color:#3d4a5a; transform:translateY(-1px);}
  .btn.sel{border-color:var(--hi); color:var(--hi);}
  .btn small{display:block; color:var(--dim); font-size:11px; margin-top:3px;}
  .btn.sel small{color:#9aa6b2;}
  .row{display:flex; gap:14px; align-items:flex-start;}
  .col{display:flex; flex-direction:column; align-items:center;}
  .col .lbl{color:var(--dim); font-size:11px; letter-spacing:1px; margin-bottom:8px;}
  .keys{font-size:12px; color:var(--dim); line-height:2; margin-top:12px;}
  .keys b{color:var(--txt); font-weight:600;}
  kbd{
    background:#21262d; border:1px solid #3d444d; border-bottom-width:2px;
    border-radius:4px; padding:1px 6px; font-size:11px; font-family:inherit; color:var(--txt);
  }
  table.res{border-collapse:collapse; margin:0 auto 18px; font-size:14px;}
  table.res th,table.res td{padding:7px 18px; border-bottom:1px solid var(--line); text-align:left;}
  table.res th{color:var(--dim); font-weight:500; font-size:12px;}
  table.res tr.me td{color:var(--hi);}
  .tabs{display:flex; gap:6px; margin-bottom:6px;}
  .tab{padding:6px 16px; border-radius:6px; background:var(--panel); border:1px solid var(--line);
       font-size:13px; cursor:pointer; font-family:inherit; color:var(--dim);}
  .tab.on{background:#1f2733; color:var(--txt); border-color:#3d4a5a;}
  .tab.on[data-diff="easy"]{border-color:#5ac8fa; color:#5ac8fa;}
  .tab.on[data-diff="hard"]{border-color:#ff6b6b; color:#ff6b6b;}
  .grouplbl{color:var(--dim); font-size:11px; letter-spacing:2px; margin-bottom:7px;}
  .grp{margin-bottom:16px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="735" height="769"></canvas>
  <div class="overlay on" id="ovMenu"></div>
  <div class="overlay" id="ovPause"></div>
  <div class="overlay" id="ovResult"></div>
</div>

<script>
/* ============================================================================
   炸弹人 · 双人对战   —— 玩法与数值复刻自 Bomb It 2 (Spil Games / Azerion)
   原始平衡数值来自游戏本体 assets/json/balance.json
   ============================================================================ */
(function () {
'use strict';

/* ===== §1 CONFIG ===========================================================
   全部数值照抄原版。唯一例外见 SPEED_SCALE。 */
const CFG = {
  CELL: 49, W: 15, H: 13,

  // ── 场次 ──
  MATCH_TIME:      180000,   // 单局 180 秒
  INITIAL_LIVES:   3,
  SPAWN_INVULN:    2000,     // 开局无敌闪烁
  COUNTDOWN:       2000,     // 开场 3-2-1

  // ── 炸弹 ──
  BOMB_FUSE:       2500,     // 引信 2.5 秒
  BOOM_MS:         450,      // 火焰持续
  CHAIN_SAME_FRAME: true,    // 连锁同帧引爆

  // ── 玩家上限 ──
  MAX_BLAST:       5,
  MAX_BOMBS:       9,
  MAX_SPEED_LV:    9,
  STUN_MS:         5000,     // 被炸中眩晕 5 秒（原版 TIME_STUNNED）

  // ── 速度换算：原版 INITIAL_SPEED / SPEED_INCREASE 的单位在压缩源码里
  //    还原不出来，这是全文件唯一一个换算常量。
  //    lv1 ≈ 2.42 格/秒，lv9 ≈ 7.50 格/秒，对标经典炸弹人的节奏。 */
  INITIAL_SPEED:   0.2375,
  SPEED_INCREASE:  0.0625,
  SPEED_SCALE:     0.0983,

  // ── 掉落表（原版 ON_BLOCK_DESTROY）──
  DROP_KIND: [['power_up',50],['weapon',20],['mount',5],['nothing',25]],

  // ── 强化道具（原版 POWER_UP_CHANCES）──
  DROP_POWER: [['bomb',20],['power',20],['speed',20],['push',20],
               ['shield',10],['invincibility',8],['heart',2]],

  // ── 武器（原版 7 把，本期实装 3 把，权重按剩余项归一化）──
  DROP_WEAPON: [['double_shotgun',20],['rocket_launcher',20],['landmine',10]],

  // ── 载具（原版 MOUNT_CHANCES）──
  DROP_MOUNT: [['frog',34],['bulldozer',33],['race_car',33]],

  // ── 计分（原版）──
  P_KILL:100, P_BLOCK:10, P_ITEM:100, P_COIN:100, P_PER_SEC:10, P_PER_LIFE:100,

  // ── 手感参数（非原版，自调）──
  RADIUS:      0.34,   // 角色碰撞半径（<0.5 才能钻 1 格宽走廊）
  CORNER_ASSIST: 0.9,  // 拐角助推强度
  LANE_SNAP:     0.75, // 走廊吸附强度
  INPUT_BUFFER:  150,  // 放弹输入缓冲（毫秒）
  BOOM_SHAKE:    6,
};
const COLS = CFG.W, ROWS = CFG.H, NCELL = COLS * ROWS;
const BOARD_W = COLS * CFG.CELL, BOARD_H = ROWS * CFG.CELL;
const BOARD_X = 0, BOARD_Y = 96;   // 画布上棋盘偏移（上方留给 HUD）

const T = { FLOOR:0, HARD:1, SOFT:2 };

/* ===== §2 ARENA ============================================================
   网格、主题、生成、碰撞、走廊吸附 */
const ARENA = {
  tiles: new Uint8Array(NCELL),
  bombAt: new Int16Array(NCELL).fill(-1),
  itemAt: new Int16Array(NCELL).fill(-1),
  _seen: new Uint8Array(NCELL),          // 连通性校验用
  _q: new Int32Array(NCELL),
  theme: null,
  layout: 0,
  hardCount: 0,
};
const idx = (x, y) => y * COLS + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;

const THEMES = [
  { id:'park',    name:'主题公园', floor:'#7ec850', floor2:'#71b845', hard:'#3f7a2e', soft:'#c98b3e', softTop:'#e0a55a', edge:'#2b5a20' },
  { id:'mine',    name:'水晶矿',   floor:'#5b6b8a', floor2:'#526180', hard:'#2f3a52', soft:'#8b5fbf', softTop:'#a97fd8', edge:'#232b3d' },
  { id:'factory', name:'工厂',     floor:'#8a8f96', floor2:'#7d828a', hard:'#3a3f47', soft:'#b06a2e', softTop:'#cd8542', edge:'#2a2e34' },
  { id:'disco',   name:'迪斯科',   floor:'#3b2a55', floor2:'#332448', hard:'#1d1430', soft:'#e0489a', softTop:'#ff6cb4', edge:'#120c1f' },
  { id:'winter',  name:'冬天',     floor:'#d8e8f5', floor2:'#c8dcee', hard:'#7f9bb5', soft:'#8fb8d8', softTop:'#aed2ec', edge:'#5d7b95' },
  { id:'beach',   name:'海滩',     floor:'#efd9a3', floor2:'#e6cd92', hard:'#b08a4e', soft:'#4fb3c9', softTop:'#6fd0e0', edge:'#8a6a34' },
];

/** 5 个出生点：四角 + 正中 */
const SPAWNS = [[1,1],[COLS-2,1],[1,ROWS-2],[COLS-2,ROWS-2],[(COLS-1)>>1,(ROWS-1)>>1]];

/** 从 (sx,sy) 灌水，标记 ARENA._seen，返回可达格数。
    软块算可通行 —— 它们炸掉之后就通了，所以它衡量的是「这张图最终能不能走通」。 */
ARENA.floodFrom = function (sx, sy) {
  const seen = ARENA._seen, q = ARENA._q;
  seen.fill(0);
  let head = 0, tail = 0;
  const s = idx(sx, sy);
  if (ARENA.tiles[s] === T.HARD) return 0;
  q[tail++] = s; seen[s] = 1;
  let n = 0;
  while (head < tail) {
    const u = q[head++]; n++;
    const ux = u % COLS, uy = (u / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const x = ux + DIRV[d][0], y = uy + DIRV[d][1];
      if (!inB(x,y)) continue;
      const i = idx(x,y);
      if (seen[i] || ARENA.tiles[i] === T.HARD) continue;
      seen[i] = 1;
      q[tail++] = i;
    }
  }
  return n;
};

/* 三种布局的加密程度：EXTRA 是把「本来是软块」的位置改成不可炸毁的比例 */
const LAYOUT_EXTRA = [0.22, 0.42, 0.32];
const MIN_OPEN = 52;          // 全图最少可通行格数，防止地图憋死

ARENA.gen = function (themeIdx, layout) {
  ARENA.theme = THEMES[themeIdx < 0 ? (Math.random()*THEMES.length|0) : themeIdx];
  ARENA.layout = layout == null ? (Math.random()*3|0) : layout;
  const t = ARENA.tiles; t.fill(T.FLOOR);
  ARENA.bombAt.fill(-1); ARENA.itemAt.fill(-1);
  const L = ARENA.layout;

  // 外墙
  for (let x = 0; x < COLS; x++) { t[idx(x,0)] = T.HARD; t[idx(x,ROWS-1)] = T.HARD; }
  for (let y = 0; y < ROWS; y++) { t[idx(0,y)] = T.HARD; t[idx(COLS-1,y)] = T.HARD; }

  // 基础棋盘硬块。偶×偶的位置是骨架，保证「奇,奇」那些连接节点永远留着。
  for (let y = 1; y < ROWS-1; y++) {
    for (let x = 1; x < COLS-1; x++) {
      if (x % 2 === 0 && y % 2 === 0) t[idx(x,y)] = T.HARD;
    }
  }
  // 中心保底留空，避免正中出生点被埋
  const c = SPAWNS[4]; t[idx(c[0],c[1])] = T.FLOOR;

  // 额外硬块：把一部分原本会是软块的位置升级成不可炸毁，让地图更封闭
  const extras = [];
  const extraRate = LAYOUT_EXTRA[L];
  for (let y = 1; y < ROWS-1; y++) {
    for (let x = 1; x < COLS-1; x++) {
      const i = idx(x,y);
      if (t[i] !== T.FLOOR) continue;
      if (nearSpawn(x, y, 1)) continue;        // 出生点周围不动，否则容易围死
      if (Math.random() < extraRate) { t[i] = T.HARD; extras.push(i); }
    }
  }

  // 出生点十字通道必须打开 —— 但绝不能碰外墙，否则墙会被打穿，
  // 角色能钻进边界外，寻路会彻底失效。
  const isBorder = (x, y) => x === 0 || y === 0 || x === COLS-1 || y === ROWS-1;
  const clearSpawns = () => {
    for (const [sx, sy] of SPAWNS) {
      t[idx(sx,sy)] = T.FLOOR;
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const x = sx+dx, y = sy+dy;
        if (inB(x,y) && !isBorder(x,y)) t[idx(x,y)] = T.FLOOR;
      }
    }
  };
  clearSpawns();

  // ---- 连通性校验：硬块加密后可能把地图切断，逐个撤销直到重新通 ----
  // 没有这一步，加密度就是拿「开局卡死」赌运气。
  //
  // 注意循环上界必须用「初始」块数常量：extras 在循环里会被 splice 掉，
  // 用 extras.length 当上界会让循环随删除而提前退出，硬块撤不干净，地图照样断。
  const totalExtras = extras.length;
  for (let guard = 0; guard <= totalExtras; guard++) {
    const reach = ARENA.floodFrom(SPAWNS[0][0], SPAWNS[0][1]);
    let allSpawnsOk = true;
    for (let k = 1; k < SPAWNS.length; k++) {
      if (!ARENA._seen[idx(SPAWNS[k][0], SPAWNS[k][1])]) { allSpawnsOk = false; break; }
    }
    if (allSpawnsOk && reach >= MIN_OPEN) break;
    if (extras.length === 0) break;

    // 试拆每一块，选「拆掉后可达面积最大」的那块动手 —— 比随机拆更能保住密度
    let bestJ = 0, bestReach = -1;
    for (let j = 0; j < extras.length; j++) {
      const cell = extras[j];
      t[cell] = T.FLOOR;
      const r = ARENA.floodFrom(SPAWNS[0][0], SPAWNS[0][1]);
      t[cell] = T.HARD;
      if (r > bestReach) { bestReach = r; bestJ = j; }
    }
    t[extras[bestJ]] = T.FLOOR;
    extras.splice(bestJ, 1);
  }

  // 软块
  const softRate = [0.72, 0.68, 0.84][L];
  for (let y = 1; y < ROWS-1; y++) {
    for (let x = 1; x < COLS-1; x++) {
      const i = idx(x,y);
      if (t[i] !== T.FLOOR) continue;
      if (nearSpawn(x, y, 1)) continue;
      if (Math.random() < softRate) t[i] = T.SOFT;
    }
  }
  clearSpawns();

  ARENA.hardCount = 0;
  for (let i = 0; i < NCELL; i++) if (t[i] === T.HARD) ARENA.hardCount++;
  return ARENA.theme;
};

function nearSpawn(x, y, rad) {
  for (const [sx, sy] of SPAWNS) {
    if (Math.abs(x-sx) <= rad && Math.abs(y-sy) <= rad) return true;
  }
  return false;
}

ARENA.passable = function (x, y) {
  if (!inB(x,y)) return false;
  const v = ARENA.tiles[idx(x,y)];
  return v !== T.HARD && v !== T.SOFT;
};

ARENA.collides = function (px, py, ent) {
  const r = CFG.RADIUS;
  const x0 = Math.floor(px-r), x1 = Math.floor(px+r);
  const y0 = Math.floor(py-r), y1 = Math.floor(py+r);
  for (let cy = y0; cy <= y1; cy++) {
    for (let cx = x0; cx <= x1; cx++) {
      if (!inB(cx,cy)) return true;
      const i = idx(cx,cy);
      const v = ARENA.tiles[i];
      if (v === T.HARD || v === T.SOFT) return true;
      const bi = ARENA.bombAt[i];
      if (bi >= 0 && BOMB.list[bi]) {
        // 刚放下的炸弹，放弹者本人走出去之前可以穿过
        if (!BOMB.list[bi].passable.has(ent.id)) return true;
      }
    }
  }
  return false;
};

/** 摧毁软块并结算掉落 */
ARENA.breakSoft = function (x, y, byEnt) {
  const i = idx(x,y);
  if (ARENA.tiles[i] !== T.SOFT) return;
  ARENA.tiles[i] = T.FLOOR;
  if (byEnt) { byEnt.score += CFG.P_BLOCK; byEnt.blocks++; }
  FX.burst(x+0.5, y+0.5, ARENA.theme);
  const kind = roll(CFG.DROP_KIND);
  if (kind === 'nothing') return;
  let name = null;
  if (kind === 'power_up') name = roll(CFG.DROP_POWER);
  else if (kind === 'weapon') name = roll(CFG.DROP_WEAPON);
  else if (kind === 'mount') name = roll(CFG.DROP_MOUNT);
  if (name) ITEM.spawn(x, y, name);
};

function roll(table) {
  let total = 0;
  for (const [, c] of table) total += c;
  let r = Math.random() * total;
  for (const [n, c] of table) { r -= c; if (r <= 0) return n; }
  return table[table.length-1][0];
}

/* ===== §3 ART ==============================================================
   优先用内嵌精灵图；没有就退化成矢量小人。
   两者视觉差很多但玩法完全一致 —— 这是刻意的解耦：美术卡住不影响可玩性。 */
const ART = {
  mode: 'vector',           // 'vector' | 'sprite'
  img: {},                  // key -> { src: Image, tint: '#xxx'|null, canvas?: canvas }
};

/* 哪个 look 用哪套原图（前两个是真人主角，后三个是机器人，靠染色区分） */
const ART_BASE = ['boy', 'girl', 'boy', 'girl', 'boy'];
const ART_TINT = [null, null, '#3fa9f5', '#5fbf4a', '#a86fe0'];

ART.load = function (src) {
  for (let i = 0; i < 5; i++) {
    const set = src[ART_BASE[i]];
    if (!set) continue;
    for (let d = 0; d < 4; d++) {
      const im = new Image();
      im.src = set[d];
      ART.img['c' + i + '_' + d] = { src: im, tint: ART_TINT[i] };
    }
  }
  ART.mode = 'sprite';
};

/** 取可绘制的图；染色副本首次用到时才生成，不在热路径里做重复合成 */
ART.get = function (key) {
  const rec = ART.img[key];
  if (!rec) return null;
  if (rec.canvas) return rec.canvas;
  const im = rec.src;
  if (!im || !im.complete || !im.naturalWidth) return null;
  if (!rec.tint) return im;

  const cv = document.createElement('canvas');
  cv.width = im.naturalWidth;
  cv.height = im.naturalHeight;
  const c = cv.getContext('2d');
  c.drawImage(im, 0, 0);
  // source-atop 只染到不透明的像素上，保留原图的明暗与描边
  c.globalCompositeOperation = 'source-atop';
  c.globalAlpha = 0.5;
  c.fillStyle = rec.tint;
  c.fillRect(0, 0, cv.width, cv.height);
  rec.canvas = cv;
  return cv;
};

  lastPress: [],   // 方向「最近按下优先」的时间戳
};

Input.init = function (n) {
  Input.state = [];
  Input.lastPress = [];
  for (let i = 0; i < n; i++) {
    Input.state.push({ up:0,down:0,left:0,right:0, bomb:0, bombBufUntil:0, vDir:null, virtual:null });
    Input.lastPress.push({ up:-1,down:-1,left:-1,right:-1 });
  }
};

Input.onKey = function (code, down, now) {
  Input.raw[code] = down;
  if (!down) return;
  for (let p = 0; p < Input.maps.length; p++) {
    const m = Input.maps[p];
    for (const d of ['up','down','left','right']) {
      if (m[d] === code) Input.lastPress[p][d] = now;
    }
  }
};

/** 机器人唯一允许的入口：写入和人类完全相同的输入结构 */
Input.setVirtual = function (pid, v) {
  const s = Input.state[pid];
  if (!s) return;
  s.up = v.up ? 1 : 0; s.down = v.down ? 1 : 0;
  s.left = v.left ? 1 : 0; s.right = v.right ? 1 : 0;
  s.bomb = v.bomb ? 1 : 0;
};

/** 只对真人调用；机器人由 setVirtual 直接写状态 */
Input.sample = function (pid, now) {
  const s = Input.state[pid];
  if (!s) return;
  const m = Input.maps[pid];
  if (!m) { s.up=s.down=s.left=s.right=s.bomb=0; return; }
  s.up    = Input.raw[m.up]    ? 1 : 0;
  s.down  = Input.raw[m.down]  ? 1 : 0;
  s.left  = Input.raw[m.left]  ? 1 : 0;
  s.right = Input.raw[m.right] ? 1 : 0;

  // 方向键「最近按下优先」：同时按左右时以最后按下的为准，避免抖动
  if (s.left && s.right) {
    if (Input.lastPress[pid].left > Input.lastPress[pid].right) s.right = 0; else s.left = 0;
  }
  if (s.up && s.down) {
    if (Input.lastPress[pid].up > Input.lastPress[pid].down) s.down = 0; else s.up = 0;
  }

  // 放弹输入缓冲：按下后短窗口内仍会生效，手感的关键
  if (Input.raw[m.bomb] && !s._bombHeld) s.bombBufUntil = now + CFG.INPUT_BUFFER;
  s._bombHeld = !!Input.raw[m.bomb];
  s.bomb = now < s.bombBufUntil ? 1 : 0;
};

Input.consumeBomb = function (pid) { Input.state[pid].bombBufUntil = 0; };

/* ===== §5 ENTITY ===========================================================
   玩家状态机。x/y 以「格」为单位，格心 = 整数 + 0.5。 */
const ENT = { list: [], nextId: 1 };

ENT.create = function (opts) {
  const e = {
    id: ENT.nextId++,
    name: opts.name,
    isBot: !!opts.isBot,
    team: opts.team | 0,
    color: opts.color,
    spriteKey: opts.spriteKey || null,
    x: 1.5, y: 1.5, dir: 1,               // 0上 1右 2下 3左
    speedLv: 1, blast: 1, maxBombs: 1,
    lives: CFG.INITIAL_LIVES,
    alive: true,
    stunnedUntil: 0,
    invulnUntil: 0,
    shield: false,
    hasPush: false,
    vehicle: null, vehicleUntil: 0,
    weapon: null, ammo: 0,
    score: 0,
    kills: 0, deaths: 0, blocks: 0, items: 0,
    activeBombs: 0,
    lastMoveDir: 1,
    ai: null,
    moveX: 0, moveY: 0,
  };
  ENT.list.push(e);
  return e;
};

ENT.reset = function () { ENT.list.length = 0; ENT.nextId = 1; };

/** 当前速度（格/秒）—— 全文件唯一取速度的入口，禁止直接读 speedLv 换算 */
ENT.speedOf = function (e) {
  if (e.stunnedUntil > GAME.now) return 0;
  let raw = CFG.INITIAL_SPEED + CFG.SPEED_INCREASE * (e.speedLv - 1);
  let cps = raw / CFG.SPEED_SCALE;
  if (e.vehicle === 'frog')       cps *= 1.5;
  else if (e.vehicle === 'bulldozer') cps *= 0.85;
  else if (e.vehicle === 'race_car')  cps *= 2.0;
  return cps;
};

const DIRV = [[0,-1],[1,0],[0,1],[-1,0]];

/** 移动 + 走廊吸附 + 拐角助推 */
ENT.move = function (e, ix, iy, dt) {
  if (e.stunnedUntil > GAME.now) return;
  const cps = ENT.speedOf(e);
  if (cps <= 0) return;
  const step = cps * dt;

  let dx = ix, dy = iy;
  if (dx && dy) { // 斜向输入只取主轴，避免对角线漂移
    if (Math.abs(ix) >= Math.abs(iy)) dy = 0; else dx = 0;
  }

  // 走廊吸附：只在单轴移动时，把垂直方向缓缓拉向格心，钻 1 格宽通道才顺
  if (dx && !dy) {
    const lane = Math.floor(e.y) + 0.5;
    const off = lane - e.y;
    if (Math.abs(off) < 0.42) e.y += clamp(off, -step * CFG.LANE_SNAP, step * CFG.LANE_SNAP);
  } else if (dy && !dx) {
    const lane = Math.floor(e.x) + 0.5;
    const off = lane - e.x;
    if (Math.abs(off) < 0.42) e.x += clamp(off, -step * CFG.LANE_SNAP, step * CFG.LANE_SNAP);
  }

  if (dx) {
    e.dir = dx > 0 ? 1 : 3;
    const nx = e.x + dx * step;
    if (!ARENA.collides(nx, e.y, e)) { e.x = nx; }
    else if (!ENT.tryCorner(e, nx, e.y, 'x', step, dx)) { /* 挡住 */ }
  } else if (dy) {
    e.dir = dy > 0 ? 2 : 0;
    const ny = e.y + dy * step;
    if (!ARENA.collides(e.x, ny, e)) { e.y = ny; }
    else if (!ENT.tryCorner(e, e.x, ny, 'y', step, dy)) { /* 挡住 */ }
  }

  // 兜底：任何情况下都不允许离开可玩区域。
  // 这也是寻路的安全网 —— 一旦角色跑到地图外，AI 的 field() 会从非法格起步，
  // 整条逃生链路会静默失效，表现为机器人呆立不动。
  const lo = 0.5 + CFG.RADIUS, hiX = COLS - 0.5 - CFG.RADIUS, hiY = ROWS - 0.5 - CFG.RADIUS;
  if (e.x < lo) e.x = lo; else if (e.x > hiX) e.x = hiX;
  if (e.y < lo) e.y = lo; else if (e.y > hiY) e.y = hiY;

  // 推土机撞软块直接碾碎
  if (e.vehicle === 'bulldozer') ENT.dozer(e, dx, dy);
};

/** 拐角助推：正前方被挡时，试着往格心方向挪一点再走，解决 1 格宽通道卡墙 */
ENT.tryCorner = function (e, nx, ny, axis, step, sgn) {
  const nudge = step * CFG.CORNER_ASSIST;
  if (axis === 'x') {
    const lane = Math.floor(e.y) + 0.5, off = lane - e.y;
    if (Math.abs(off) < 0.02) return false;
    const cy = e.y + Math.sign(off) * Math.min(Math.abs(off), nudge);
    if (!ARENA.collides(nx, cy, e)) { e.x = nx; e.y = cy; return true; }
  } else {
    const lane = Math.floor(e.x) + 0.5, off = lane - e.x;
    if (Math.abs(off) < 0.02) return false;
    const cx = e.x + Math.sign(off) * Math.min(Math.abs(off), nudge);
    if (!ARENA.collides(cx, ny, e)) { e.x = cx; e.y = ny; return true; }
  }
  return false;
};

ENT.dozer = function (e, dx, dy) {
  const cx = Math.floor(e.x + (dx||0) * (CFG.RADIUS + 0.08));
  const cy = Math.floor(e.y + (dy||0) * (CFG.RADIUS + 0.08));
  if (inB(cx,cy) && ARENA.tiles[idx(cx,cy)] === T.SOFT) ARENA.breakSoft(cx, cy, e);
};

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* ===== §6 BOMB =============================================================
   投放、引信、连锁同帧引爆 */
const BOMB = { list: [], free: [] };

BOMB.place = function (e) {
  if (!e.alive || e.stunnedUntil > GAME.now) return false;
  if (e.activeBombs >= e.maxBombs) return false;
  const cx = Math.floor(e.x), cy = Math.floor(e.y);
  if (!inB(cx,cy)) return false;
  const i = idx(cx,cy);
  if (ARENA.bombAt[i] >= 0) return false;
  if (ARENA.tiles[i] !== T.FLOOR) return false;

  const b = {
    cx, cy, ownerId: e.id, team: e.team, blast: e.blast,
    placedAt: GAME.now, detonateAt: GAME.now + CFG.BOMB_FUSE,
    detonated: false, cell: i,
    passable: new Set([e.id]),
  };
  // 站在同一格上的人都能先走出去
  for (const o of ENT.list) {
    if (o.alive && Math.floor(o.x) === cx && Math.floor(o.y) === cy) b.passable.add(o.id);
  }
  BOMB.list.push(b);
  ARENA.bombAt[i] = BOMB.list.length - 1;
  e.activeBombs++;
  AUDIO.play('place');
  return true;
};

BOMB.update = function () {
  for (let i = BOMB.list.length - 1; i >= 0; i--) {
    const b = BOMB.list[i];
    if (b.detonated) continue;
    if (GAME.now >= b.detonateAt) BOMB.detonate(i);
  }
  // 清掉已爆的
  for (let i = BOMB.list.length - 1; i >= 0; i--) {
    if (BOMB.list[i].detonated) {
      if (ARENA.bombAt[BOMB.list[i].cell] === i) ARENA.bombAt[BOMB.list[i].cell] = -1;
      BOMB.list.splice(i, 1);
      // 后面的索引全部前移
      for (let k = 0; k < NCELL; k++) if (ARENA.bombAt[k] > i) ARENA.bombAt[k]--;
    }
  }
};

BOMB.byCell = function (i) {
  const bi = ARENA.bombAt[i];
  return bi >= 0 ? BOMB.list[bi] : null;
};

/** 引爆一颗炸弹（含连锁：同一帧内递归引爆范围内其他炸弹） */
BOMB.detonate = function (startIdx) {
  const queue = [startIdx];
  while (queue.length) {
    const bi = queue.shift();
    const b = BOMB.list[bi];
    if (!b || b.detonated) continue;
    b.detonated = true;

    const owner = ENT.list.find(e => e.id === b.ownerId);
    if (owner) owner.activeBombs = Math.max(0, owner.activeBombs - 1);
    ARENA.bombAt[b.cell] = -1;

    const cells = [b.cell];
    for (let d = 0; d < 4; d++) {
      const [dx,dy] = DIRV[d];
      for (let k = 1; k <= b.blast; k++) {
        const x = b.cx + dx*k, y = b.cy + dy*k;
        if (!inB(x,y)) break;
        const i = idx(x,y);
        const t = ARENA.tiles[i];
        if (t === T.HARD) break;
        cells.push(i);
        if (t === T.SOFT) { ARENA.breakSoft(x, y, owner); break; }   // 软块吸收火焰，不再延伸
        const other = BOMB.byCell(i);
        if (other && !other.detonated) { queue.push(ARENA.bombAt[i]); break; }
      }
    }
    BOOM.spawn(cells, b.ownerId, b.team);
  }
};

/* ===== §7 BOOM =============================================================
   火焰解算与伤害 */
const BOOM = { list: [] };

BOOM.spawn = function (cells, ownerId, team) {
  const ex = {
    cells, ownerId, team,
    until: GAME.now + CFG.BOOM_MS,
    hit: new Set(),
  };
  BOOM.list.push(ex);
  AUDIO.play('boom');
  FX.shake(CFG.BOOM_SHAKE);
};

BOOM.update = function () {
  for (let i = BOOM.list.length - 1; i >= 0; i--) {
    const ex = BOOM.list[i];
    for (const cell of ex.cells) {
      const cx = cell % COLS, cy = (cell / COLS) | 0;
      for (const e of ENT.list) {
        if (!e.alive) continue;
        if (ex.hit.has(e.id)) continue;
        // 矩形重叠近似：角色中心落在火焰格内即可判定
        if (Math.floor(e.x) === cx && Math.floor(e.y) === cy) {
          ex.hit.add(e.id);
          HURT.apply(e, ex);
        }
      }
    }
    if (GAME.now >= ex.until) BOOM.list.splice(i, 1);
  }
};

const HURT = {};

HURT.apply = function (e, src) {
  if (!e.alive) return;
  if (GAME.now < e.invulnUntil) return;
  if (e.stunnedUntil > GAME.now) return;          // 眩晕中不重复挨打
  // 团队模式关闭友军伤害（自伤保留）。同键盘的两个人本来就没法精细协同，
  // 开友伤只产生挫败不产生战术深度；关掉后「互相掩护走位」成为对抗人数优势的真实战术。
  if (GAME.mode === 'team' && src.ownerId !== e.id && src.team === e.team) return;
  if (e.shield) { e.shield = false; AUDIO.play('shield'); FX.text(e, '护盾抵挡'); return; }

  const attacker = ENT.list.find(o => o.id === src.ownerId);
  if (attacker && attacker !== e) { attacker.kills++; attacker.score += CFG.P_KILL; }

  e.deaths++;
  let dead;
  if (GAME.mode === 'team' && e.isBot) {
    GAME.teamPool[1]--;                            // 机器人队共享生命池
    dead = GAME.teamPool[1] <= 0;
  } else {
    e.lives--;
    dead = e.lives <= 0;
  }

  FX.text(e, dead ? '淘汰' : '被炸中！');
  FX.shake(10);
  AUDIO.play('hurt');

  if (dead) {
    if (GAME.mode === 'team' && e.isBot && GAME.teamPool[1] <= 0) {
      // 生命池清零 → 机器人队全灭
      for (const o of ENT.list) if (o.isBot) { o.alive = false; o.activeBombs = 0; if (o.ai) o.ai.path = null; }
    } else {
      e.alive = false;
      e.activeBombs = 0;
      if (e.ai) e.ai.path = null;
    }
  } else {
    e.stunnedUntil = GAME.now + CFG.STUN_MS;
    e.invulnUntil  = e.stunnedUntil + 1000;       // 眩晕期间免疫，醒来后 1 秒缓冲
    e.vehicle = null;
    e.weapon = null; e.ammo = 0;
  }
};

/* ===== §8 ITEM =============================================================
   7 种强化道具 + 武器 + 载具，共用一地掉落槽 */
const ITEM = { list: [] };

ITEM.spawn = function (x, y, name) {
  const i = idx(x,y);
  if (ARENA.itemAt[i] >= 0) return;
  ITEM.list.push({ x:x+0.5, y:y+0.5, name, born:GAME.now, cell:i, pop:1 });
  ARENA.itemAt[i] = ITEM.list.length - 1;
};

ITEM.update = function () {
  for (let i = ITEM.list.length - 1; i >= 0; i--) {
    const it = ITEM.list[i];
    it.pop = Math.max(0, 1 - (GAME.now - it.born) / 220);
    if (GAME.now - it.born < 120) continue;
    for (const e of ENT.list) {
      if (!e.alive) continue;
      if (Math.abs(e.x - it.x) < 0.5 && Math.abs(e.y - it.y) < 0.5) {
        ITEM.pick(e, it);
        ARENA.itemAt[it.cell] = -1;
        ITEM.list.splice(i, 1);
        break;
      }
    }
  }
};

ITEM.pick = function (e, it) {
  e.score += CFG.P_ITEM;
  e.items++;
  AUDIO.play('pick');
  let label = '';
  switch (it.name) {
    case 'bomb':    e.maxBombs = Math.min(CFG.MAX_BOMBS, e.maxBombs + 1); label = '炸弹 +1'; break;
    case 'power':   e.blast    = Math.min(CFG.MAX_BLAST, e.blast + 1);    label = '威力 +1'; break;
    case 'speed':   e.speedLv  = Math.min(CFG.MAX_SPEED_LV, e.speedLv + 1); label = '速度 +10%'; break;
    case 'push':    e.hasPush = true; label = '可踢炸弹'; break;
    case 'shield':  e.shield = true; label = '护盾'; break;
    case 'invincibility': e.invulnUntil = GAME.now + 8000; label = '无敌 8 秒'; break;
    case 'heart':   e.lives = Math.min(9, e.lives + 1); label = '生命 +1'; break;
    case 'double_shotgun': e.weapon = 'double_shotgun'; e.ammo = 3; label = '双管霰弹枪'; break;
    case 'rocket_launcher': e.weapon = 'rocket_launcher'; e.ammo = 2; label = '火箭筒'; break;
    case 'landmine': e.weapon = 'landmine'; e.ammo = 3; label = '地雷'; break;
    case 'frog':       e.vehicle = 'frog';       e.vehicleUntil = GAME.now + 20000; label = '青蛙'; break;
    case 'bulldozer':  e.vehicle = 'bulldozer';  e.vehicleUntil = GAME.now + 20000; label = '推土机'; break;
    case 'race_car':   e.vehicle = 'race_car';   e.vehicleUntil = GAME.now + 12000; label = '赛车'; break;
  }
  FX.text(e, label);
};

ITEM.updateVehicles = function () {
  for (const e of ENT.list) {
    if (e.vehicle && GAME.now >= e.vehicleUntil) e.vehicle = null;
  }
};

/* ===== §9 WEAPON ===========================================================
   3 把武器。放弹键在持有武器时改为开火，打完自动回到放炸弹。 */
const WEP = { bullets: [], mines: [] };

WEP.fire = function (e) {
  if (!e.weapon || e.ammo <= 0) return false;
  const [dx,dy] = DIRV[e.dir];
  const sx = e.x + dx*0.5, sy = e.y + dy*0.5;
  const kind = e.weapon;
  e.ammo--;
  if (kind === 'landmine') {
    const cx = Math.floor(e.x), cy = Math.floor(e.y);
    WEP.mines.push({ cx, cy, armAt: GAME.now + 1000, ownerId: e.id, team: e.team, cell: idx(cx,cy) });
    AUDIO.play('place');
  } else if (kind === 'double_shotgun') {
    for (const off of [-0.16, 0.16]) {
      WEP.bullets.push({ x:sx + (dy?off:0), y:sy + (dx?off:0), dx, dy,
        speed:9, kind:'pellet', ownerId:e.id, team:e.team, dieAt:GAME.now+900, hitIds:new Set() });
    }
    AUDIO.play('shoot');
  } else if (kind === 'rocket_launcher') {
    WEP.bullets.push({ x:sx, y:sy, dx, dy, speed:6.5, kind:'rocket',
      ownerId:e.id, team:e.team, dieAt:GAME.now+2600, hitIds:new Set() });
    AUDIO.play('shoot');
  }
  if (e.ammo <= 0) { e.weapon = null; FX.text(e, '武器用尽'); }
  return true;
};

WEP.update = function (dt) {
  // 子弹
  for (let i = WEP.bullets.length - 1; i >= 0; i--) {
    const b = WEP.bullets[i];
    b.x += b.dx * b.speed * dt;
    b.y += b.dy * b.speed * dt;
    const cx = Math.floor(b.x), cy = Math.floor(b.y);
    let dead = GAME.now > b.dieAt;

    if (!dead && !inB(cx,cy)) dead = true;
    if (!dead) {
      const t = ARENA.tiles[idx(cx,cy)];
      if (t === T.HARD) dead = true;
      else if (t === T.SOFT) {
        ARENA.breakSoft(cx, cy, ENT.list.find(e=>e.id===b.ownerId));
        if (b.kind === 'rocket') WEP.blastAt(cx, cy, b);
        dead = true;
      }
    }
    // 命中角色
    if (!dead) {
      for (const e of ENT.list) {
        if (!e.alive || e.id === b.ownerId || b.hitIds.has(e.id)) continue;
        if (Math.floor(e.x) === cx && Math.floor(e.y) === cy) {
          b.hitIds.add(e.id);
          HURT.apply(e, { ownerId:b.ownerId, team:b.team });
          if (b.kind === 'rocket') WEP.blastAt(cx, cy, b);
          dead = true;
          break;
        }
      }
    }
    if (dead) WEP.bullets.splice(i,1);
  }

  // 地雷
  for (let i = WEP.mines.length - 1; i >= 0; i--) {
    const m = WEP.mines[i];
    if (GAME.now < m.armAt) continue;
    let triggered = false;
    for (const e of ENT.list) {
      if (!e.alive || e.id === m.ownerId) continue;
      if (Math.floor(e.x) === m.cx && Math.floor(e.y) === m.cy) { triggered = true; break; }
    }
    if (triggered) {
      const cells = [m.cell];
      for (const [dx,dy] of DIRV) {
        const x = m.cx+dx, y = m.cy+dy;
        if (inB(x,y) && ARENA.tiles[idx(x,y)] !== T.HARD) {
          cells.push(idx(x,y));
          if (ARENA.tiles[idx(x,y)] === T.SOFT) ARENA.breakSoft(x,y,null);
        }
      }
      BOOM.spawn(cells, m.ownerId, m.team);
      WEP.mines.splice(i,1);
    }
  }
};

WEP.blastAt = function (cx, cy, b) {
  const cells = [idx(cx,cy)];
  for (const [dx,dy] of DIRV) {
    const x = cx+dx, y = cy+dy;
    if (inB(x,y) && ARENA.tiles[idx(x,y)] !== T.HARD) {
      cells.push(idx(x,y));
      if (ARENA.tiles[idx(x,y)] === T.SOFT) ARENA.breakSoft(x,y,null);
    }
  }
  BOOM.spawn(cells, b.ownerId, b.team);
};

WEP.reset = function () { WEP.bullets.length = 0; WEP.mines.length = 0; };

/* ===== §10 VEHICLE =========================================================
   效果在 ENT.speedOf 里；这里只放被动行为（推土机在 ENT.dozer）。 */

/* ===== §11 AI ==============================================================
   三层：感知（每帧）→ 决策（90~220ms，三个机器人错开）→ 执行（每帧）
   铁律：机器人只能通过 Input.setVirtual 操作角色，走和人类完全相同的物理路径。
        这样物理 bug 会同时体现在人机双方（必被发现），机器人也没有隐藏优势。 */
const AI = {
  // 危险图分两张，这一点很关键：
  //   danger     —— 评测「如果我现在放一颗炸弹」时会临时叠加假想火焰，用完撤回。
  //   realDanger —— 只反映场上真实存在的威胁，从不被假想炸弹写脏。
  // 判断「我要不要逃命」必须看 realDanger。混用会让假想火焰泄漏成幽灵警报，
  // 机器人会整天在没炸弹的地方抱头鼠窜，而真正该做的事一件不做。
  danger:     new Float32Array(NCELL),
  realDanger: new Float32Array(NCELL),
  lethalNow:  new Uint8Array(NCELL),    // 此刻正在燃烧
  arrival:   new Float32Array(NCELL),
  settled:   new Uint8Array(NCELL),
  prev:      new Int16Array(NCELL),
  dirTo:     new Int8Array(NCELL),      // 每个格的最佳来向，用于转向惩罚
  TURN_MS:   1,                         // 每转一次弯记 1ms，纯粹用来打破等长路径的并列
  queue:     new Int32Array(NCELL),
  seen:      new Uint8Array(NCELL),
  undoCell:  new Int32Array(NCELL + 64),
  undoMark:  new Int32Array(NCELL).fill(-1),
  undoVal:   new Float32Array(NCELL),
  undoN:     0,
  esc:       [],      // 逃逸路径（格索引，起点在前）
  myEsc:     [],
  blastList: [],
  fieldGoal: -1,
  fieldSlackCell: -1,
  fieldSlack: -1e9,
  openOptions: 0,
  _v: { up:0, down:0, left:0, right:0, bomb:0 },
  _z: { up:0, down:0, left:0, right:0, bomb:0 },

  SAFETY:   260,     // 逃生余量。调大能明显压低「自己炸死自己」的比例
  EXPOSURE: 2500,    // 踏入「将来会炸」格子的虚拟代价
  PANIC:    900,     // 脚下将炸的判定阈值
  MIN_POCKET: 6,     // 逃逸终点周围最少空地数
};

/* --- 决策档位：三种人格 × 三档难度 --- */
const PROFILES = {
  rookie:   { thinkInterval:220, reactionDelay:400, mistakeChance:0.30, optimism:0.08, dropAggression:0.75, roam:1.3 },
  standard: { thinkInterval:150, reactionDelay:260, mistakeChance:0.16, optimism:0.15, dropAggression:1.00, roam:1.0 },
  ace:      { thinkInterval: 90, reactionDelay:150, mistakeChance:0.06, optimism:0.28, dropAggression:1.35, roam:0.8 },
};
const PERSONAS = {
  aggressive: { drop:1.5, item:0.6, hunt:1.6, name:'激进' },
  scavenger:  { drop:0.8, item:2.0, hunt:0.8, name:'拾荒' },
  cautious:   { drop:1.0, item:1.1, hunt:0.9, name:'保守' },
};
const PERSONA_KEYS = ['aggressive','scavenger','cautious'];

/* --- 二叉堆（Int32 格索引 + Float32 键），零分配 --- */
const HEAP = {
  c: new Int32Array(4096), k: new Float32Array(4096), n: 0,
  clear() { this.n = 0; },
  push(c, k) {
    if (this.n >= this.c.length) return;
    let i = this.n++;
    this.c[i] = c; this.k[i] = k;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.k[p] <= this.k[i]) break;
      const tc = this.c[p], tk = this.k[p];
      this.c[p] = this.c[i]; this.k[p] = this.k[i];
      this.c[i] = tc; this.k[i] = tk;
      i = p;
    }
  },
  pop() {
    const top = this.c[0];
    this.n--;
    if (this.n > 0) {
      this.c[0] = this.c[this.n]; this.k[0] = this.k[this.n];
      let i = 0;
      for (;;) {
        const l = i*2+1, r = l+1;
        let m = i;
        if (l < this.n && this.k[l] < this.k[m]) m = l;
        if (r < this.n && this.k[r] < this.k[m]) m = r;
        if (m === i) break;
        const tc = this.c[m], tk = this.k[m];
        this.c[m] = this.c[i]; this.k[m] = this.k[i];
        this.c[i] = tc; this.k[i] = tk;
        i = m;
      }
    }
    return top;
  },
};

/* --- 危险图 ---
   假想炸弹要「临时写进危险图 → 评估 → 原样撤回」。
   备份标记必须用**自增批次 ID**，不能用 undoN 本身：undoN 在写的过程中会变，
   用它会漏记/重记，撤回时把上一帧的陈旧数值写回去，
   结果是凭空出现一片不存在的危险区 —— 机器人会被幽灵炸弹逼得原地打转或定住。 */
AI.session = 0;

AI.beginStamp = function () {
  AI.session++;
  AI.undoN = 0;
};

AI.stamp = function (cell, t) {
  if (t >= AI.danger[cell]) return;
  if (AI.undoMark[cell] !== AI.session) {        // 同一批次内每格只备份一次原值
    AI.undoMark[cell] = AI.session;
    if (AI.undoN < AI.undoCell.length) {
      AI.undoCell[AI.undoN] = cell;
      AI.undoVal[AI.undoN] = AI.danger[cell];
      AI.undoN++;
    }
  }
  AI.danger[cell] = t;
};

AI.undoAll = function () {
  for (let i = 0; i < AI.undoN; i++) AI.danger[AI.undoCell[i]] = AI.undoVal[i];
  AI.undoN = 0;
};

/** 按爆炸规则把火焰格写进危险图，同时记录格表 */
AI.stampBlast = function (cx, cy, blast, t, collect) {
  if (collect) AI.blastList.length = 0;
  const push = (i) => { AI.stamp(i, t); if (collect) AI.blastList.push(i); };
  push(idx(cx, cy));                       // 炸弹自身格也致命 —— 漏了这条 AI 会站在自己炸弹上
  for (let d = 0; d < 4; d++) {
    const dx = DIRV[d][0], dy = DIRV[d][1];
    for (let k = 1; k <= blast; k++) {
      const x = cx + dx*k, y = cy + dy*k;
      if (!inB(x,y)) break;
      const i = idx(x,y);
      const tile = ARENA.tiles[i];
      if (tile === T.HARD) break;
      push(i);
      if (tile === T.SOFT) break;           // 软块吸收火焰，不再延伸
      if (ARENA.bombAt[i] >= 0) break;      // 连锁同帧引爆，无需延伸
    }
  }
};

/** 把一颗炸弹的火焰格写进指定危险图（不做 undo 记账，给真实危险图用） */
AI.writeBlast = function (arr, cx, cy, blast, t) {
  const w = (i) => { if (t < arr[i]) arr[i] = t; };
  w(idx(cx, cy));
  for (let d = 0; d < 4; d++) {
    const dx = DIRV[d][0], dy = DIRV[d][1];
    for (let k = 1; k <= blast; k++) {
      const x = cx + dx*k, y = cy + dy*k;
      if (!inB(x,y)) break;
      const i = idx(x,y);
      const tile = ARENA.tiles[i];
      if (tile === T.HARD) break;
      w(i);
      if (tile === T.SOFT) break;
      if (ARENA.bombAt[i] >= 0) break;
    }
  }
};

AI.updateDanger = function () {
  AI.danger.fill(Infinity);
  AI.realDanger.fill(Infinity);
  AI.lethalNow.fill(0);
  AI.beginStamp();
  for (const ex of BOOM.list) {
    if (GAME.now >= ex.until) continue;
    for (const cell of ex.cells) {
      AI.danger[cell] = GAME.now;
      AI.realDanger[cell] = GAME.now;
      AI.lethalNow[cell] = 1;
    }
  }
  for (const b of BOMB.list) {
    if (b.detonated) continue;
    AI.stampBlast(b.cx, b.cy, b.blast, b.detonateAt, false);      // 可推演的那张
    AI.writeBlast(AI.realDanger, b.cx, b.cy, b.blast, b.detonateAt); // 只反映真实威胁的那张
  }
};

AI.walkable = function (x, y, startCell) {
  if (!inB(x,y)) return false;
  const i = idx(x,y);
  const t = ARENA.tiles[i];
  if (t === T.HARD || t === T.SOFT) return false;
  if (ARENA.bombAt[i] >= 0 && i !== startCell) return false;
  return true;
};

/** 通用 Dijkstra。mode: 'escape' 找到第一个绝对安全格 | 'buy' 最大化存活余量 | 'reach' 铺满到达时间
    prefDir 是当前朝向，用来给「转向」记一点点代价 —— 见 AI.TURN_MS 的说明。 */
AI.field = function (sx, sy, speed, mode, prefDir) {
  const arrival = AI.arrival, settled = AI.settled, prev = AI.prev;
  arrival.fill(Infinity); settled.fill(0); prev.fill(-1);
  AI.dirTo.fill(-1);
  HEAP.clear();
  AI.fieldGoal = -1; AI.fieldSlack = -1e9; AI.fieldSlackCell = -1;

  const start = idx(sx, sy);
  const msPer = 1000 / Math.max(0.6, speed);
  arrival[start] = GAME.now;
  if (prefDir != null) AI.dirTo[start] = prefDir;
  HEAP.push(start, GAME.now);

  while (HEAP.n > 0) {
    const u = HEAP.pop();
    if (settled[u]) continue;
    settled[u] = 1;
    const a = arrival[u], dg = AI.danger[u];

    // 起点永远要展开。剪枝规则的本意是「到达时该格已经/即将挨炸 → 这个节点不能用」，
    // 但起点是「此刻所在」，脚下正在燃烧时同样满足这个条件；若照剪不误，
    // 邻居一个都不会展开，明明旁边就有安全格也会判定成无处可逃，
    // 机器人就会原地站着烧死（表现为「全部死亡都是自爆」）。
    if (u !== start) {
      if (dg === Infinity) {
        if (mode === 'escape' || mode === 'buy') { AI.fieldGoal = u; break; }
      }
      if (mode === 'buy') {
        const slack = dg - a;
        if (slack > AI.fieldSlack) { AI.fieldSlack = slack; AI.fieldSlackCell = u; }
      } else if (a > dg - AI.SAFETY) {
        continue;                            // 到达时已经/即将挨炸 → 该节点不可用，不再扩展
      }
    }

    const ux = u % COLS, uy = (u / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const vx = ux + DIRV[d][0], vy = uy + DIRV[d][1];
      if (!AI.walkable(vx, vy, start)) continue;
      const v = idx(vx, vy);
      if (settled[v]) continue;
      // 转向惩罚：开阔地带到同一个目标有大量等长路线，不惩罚转向的话
      // Dijkstra 会随便挑一条，出来的是「右-下-右-下」的锯齿路径，
      // 走起来就是原地抖。代价只有 1ms，不影响「能不能在引信烧完前跑到」的判断。
      const turn = (AI.dirTo[u] < 0 || AI.dirTo[u] === d) ? 0 : AI.TURN_MS;
      const na = a + msPer + turn;
      if (na >= arrival[v]) continue;
      if (mode !== 'buy' && na > AI.danger[v] - AI.SAFETY) continue;
      arrival[v] = na;
      prev[v] = u;
      AI.dirTo[v] = d;
      HEAP.push(v, na);
    }
  }
  if (mode === 'buy' && AI.fieldGoal < 0) AI.fieldGoal = AI.fieldSlackCell;
  return AI.fieldGoal;
};

AI.pathTo = function (goal) {
  const out = AI.esc; out.length = 0;
  let u = goal, guard = 0;
  while (u >= 0 && guard++ <= NCELL) { out.push(u); u = AI.prev[u]; }
  out.reverse();
  return out;
};

/** 规划逃逸路线。成功返回 true，路径写入 AI.esc。 */
AI.planEscape = function (sx, sy, speed, dir) {
  const g = AI.field(sx, sy, speed, 'escape', dir);
  if (g < 0) return false;
  AI.pathTo(g);
  return true;
};

/** 无路可逃时：往「最晚被烧到」的方向跑，看起来像在拼命挣扎而不是站定等死 */
AI.planBuyTime = function (bot) {
  AI.field(Math.floor(bot.x), Math.floor(bot.y), ENT.speedOf(bot) || 2, 'buy', bot.dir);
  if (AI.fieldGoal >= 0) AI.pathTo(AI.fieldGoal);
  else AI.esc.length = 0;
};

/** 逃逸终点周围的可达空地数（防止把自己关进小口袋） */
AI.openArea = function (cell, maxSteps) {
  AI.seen.fill(0);
  let head = 0, tail = 0;
  AI.queue[tail++] = cell; AI.seen[cell] = 1;
  let count = 0;
  while (head < tail) {
    const u = AI.queue[head++];
    count++;
    if (count > 40) break;
    const ux = u % COLS, uy = (u / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const vx = ux + DIRV[d][0], vy = uy + DIRV[d][1];
      if (!inB(vx,vy)) continue;
      const v = idx(vx,vy);
      if (AI.seen[v]) continue;
      if (ARENA.tiles[v] === T.HARD || ARENA.tiles[v] === T.SOFT) continue;
      if (ARENA.bombAt[v] >= 0) continue;
      AI.seen[v] = 1;
      if (tail < AI.queue.length) AI.queue[tail++] = v;
    }
  }
  return count;
};

/** 从 enemy 当前位置出发，敌人能不能逃掉？ */
AI.enemyCanEscape = function (enemy) {
  const g = AI.field(Math.floor(enemy.x), Math.floor(enemy.y),
                     Math.max(1.2, ENT.speedOf(enemy) || 2.4), 'escape', enemy.dir);
  return g >= 0;
};

/** 敌人有几条逃生路线（越少说明越是「陷阱」而不是「空放」） */
AI.escapeOptions = function () {
  let n = 0;
  for (let i = 0; i < NCELL; i++) if (AI.settled[i] && AI.danger[i] === Infinity) { if (++n >= 3) break; }
  return n;
};

/** 炸弹投放评估。返回 null 表示绝对不能放，否则返回收益分。 */
AI.evaluateBombDrop = function (bot, cx, cy) {
  if (!bot.alive || bot.activeBombs >= bot.maxBombs) return null;
  if (!inB(cx,cy)) return null;
  const ci = idx(cx,cy);
  if (ARENA.bombAt[ci] >= 0) return null;
  if (AI.lethalNow[ci]) return null;                 // 脚下正在烧，别添乱

  const t = GAME.now + CFG.BOMB_FUSE;
  AI.beginStamp();
  AI.stampBlast(cx, cy, bot.blast, t, true);

  // ── 硬约束 A：不能自杀 ──
  if (!AI.planEscape(cx, cy, Math.max(1.2, ENT.speedOf(bot) || 2.4), bot.dir)) { AI.undoAll(); return null; }
  AI.myEsc.length = 0;
  for (const c of AI.esc) AI.myEsc.push(c);
  const pathLen = AI.myEsc.length;

  // ── 硬约束 B：不能把自己关进比现在更小的口袋 ──
  //    用「相对」判据而非绝对阈值：出生点被软块围死时，绝对阈值会让机器人
  //    永远不敢炸开出路，直接僵在原地（实测踩过这个坑）。
  if (pathLen === 0) { AI.undoAll(); return null; }
  const curArea = AI.openArea(idx(cx, cy), 4);
  const newArea = AI.openArea(AI.myEsc[pathLen-1], 4);
  if (newArea < AI.MIN_POCKET && newArea < curArea) { AI.undoAll(); return null; }

  // ── 硬约束 C：团队模式不能波及队友 ──
  if (GAME.mode === 'team') {
    for (const o of ENT.list) {
      if (!o.alive || o.team !== bot.team || o.id === bot.id) continue;
      const oc = idx(Math.floor(o.x), Math.floor(o.y));
      if (AI.blastList.indexOf(oc) >= 0) { AI.undoAll(); return null; }
    }
  }

  // ── 收益评分 ──
  let v = 0, softCount = 0;
  for (const c of AI.blastList) {
    const tile = ARENA.tiles[c];
    if (tile === T.SOFT) {
      softCount++;
      if (ARENA.itemAt[c] >= 0) v += 12;             // 底下有道具，炸开是好事
      else v += 45;                                  // 清障开路（给足权重，否则机器人整天无所事事）
    }
    if (ARENA.itemAt[c] >= 0 && tile === T.FLOOR) v -= 60;   // 别把地上的道具炸没
  }
  // 被软块围住时，炸开出路本身就是收益 —— 出生点四角都会用到这一条
  if (softCount > 0 && curArea < 10) v += 40;

  for (const o of ENT.list) {
    if (!o.alive || o.id === bot.id) continue;
    if (GAME.mode === 'team' && o.team === bot.team) continue;
    const oc = idx(Math.floor(o.x), Math.floor(o.y));
    if (AI.blastList.indexOf(oc) < 0) continue;
    // 「敌人跑得掉吗」是 AI 显得聪明的关键
    const canRun = AI.enemyCanEscape(o);
    const options = canRun ? AI.escapeOptions() : 0;
    v += 100 * (canRun ? bot.ai.optimism : 1.0);
    if (canRun && options <= 2) v += 25;             // 能跑但跑不远 = 陷阱，不是空放
    if (GAME.mode === 'team') v += TEAM.focusBonus(bot, o);
  }

  v -= pathLen * 4;                                  // 逃逸越远，代价越高
  if (bot.stunnedUntil > GAME.now) v -= 40;          // 眩晕中放弹基本是找死
  if (bot.weapon && bot.ammo > 0) v -= 20;           // 有枪在手，不急着放弹
  AI.undoAll();
  return v * bot.ai.persona.drop;
};

/* --- 道具取舍 --- */
const ITEM_DESIRE = {
  heart:3.0, invincibility:2.6, bomb:2.2, power:2.2, speed:1.6,
  shield:2.0, push:1.4, double_shotgun:1.8, rocket_launcher:2.0,
  landmine:1.2, frog:1.5, bulldozer:1.3, race_car:1.7,
};

AI.pickItem = function (bot) {
  if (ITEM.list.length === 0) return null;
  const bcx = Math.floor(bot.x), bcy = Math.floor(bot.y);
  AI.field(bcx, bcy, Math.max(1.2, ENT.speedOf(bot) || 2.4), 'reach', bot.dir);
  let best = null, bestScore = -1e9;
  for (const it of ITEM.list) {
    const a = AI.arrival[it.cell];
    if (!isFinite(a)) continue;
    const dist = (a - GAME.now) / 1000;
    const desire = ITEM_DESIRE[it.name] || 1;
    const risk = AI.danger[it.cell] === Infinity ? 0 : -35;
    const s = (desire * 22 + risk) * bot.ai.persona.item - dist * 7;
    if (s > bestScore) { bestScore = s; best = { cell: it.cell, dist, score: s }; }
  }
  if (!best || best.score < 6) return null;
  return best;
};

/* --- 猎杀目标 --- */
AI.pickHuntTarget = function (bot) {
  const enemies = ENT.list.filter(o =>
    o.alive && o.id !== bot.id && !(GAME.mode === 'team' && o.team === bot.team));
  if (enemies.length === 0) return null;
  const bcx = Math.floor(bot.x), bcy = Math.floor(bot.y);
  AI.field(bcx, bcy, Math.max(1.2, ENT.speedOf(bot) || 2.4), 'reach', bot.dir);
  let best = null, bestScore = -1e9;
  for (const o of enemies) {
    const ox = Math.floor(o.x), oy = Math.floor(o.y);
    // 目标应该是「敌人旁边那一格」，而不是敌人脚下那一格。
    // 追着敌人本格走只会永远跟在他屁股后面 —— 炸弹是要往他身边放的。
    let standCell = -1, standArr = Infinity;
    for (let d = 0; d < 4; d++) {
      const x = ox + DIRV[d][0], y = oy + DIRV[d][1];
      if (!AI.walkable(x, y, -1)) continue;
      const a = AI.arrival[idx(x, y)];
      if (isFinite(a) && a < standArr) { standArr = a; standCell = idx(x, y); }
    }
    if (standCell < 0) continue;
    const dist = (standArr - GAME.now) / 1000;
    let s = 40 - dist * 4;
    s += (CFG.INITIAL_LIVES - o.lives) * 8;          // 残血优先
    if (o.stunnedUntil > GAME.now) s += 45;          // 眩晕 = 立刻扑上去
    if (GAME.mode === 'team') s += TEAM.focusBonus(bot, o);
    else s += o.score * 0.02;                        // 高分玩家被针对，自然的平衡器
    s *= bot.ai.persona.hunt;
    if (s > bestScore) { bestScore = s; best = { enemy: o, cell: standCell, dist, score: s }; }
  }
  if (!best || best.score < 8) return null;
  return best;
};

/* --- 巡逻 / 开路 --- */
AI.pickRoamCell = function (bot) {
  const bcx = Math.floor(bot.x), bcy = Math.floor(bot.y);
  AI.field(bcx, bcy, Math.max(1.2, ENT.speedOf(bot) || 2.4), 'reach', bot.dir);
  const here = idx(bcx, bcy);
  // 全格扫描而不是随机抽样：195 格成本可以忽略，而且不会因为运气不好
  // 一次都没抽中而让机器人「无事可做」定在原地。
  let best = null, bestScore = -1e9, fb = null, fbScore = -1e9;
  for (let c = 0; c < NCELL; c++) {
    const a = AI.arrival[c];
    if (!isFinite(a)) continue;
    if (AI.danger[c] !== Infinity) continue;
    if (c === here) continue;
    const dist = (a - GAME.now) / 1000;
    let s = dist * 3;
    // 偏向靠近敌人的格子，制造压迫感
    for (const o of ENT.list) {
      if (!o.alive || o.id === bot.id) continue;
      if (GAME.mode === 'team' && o.team === bot.team) continue;
      const d = Math.abs((c % COLS) - o.x) + Math.abs(((c / COLS) | 0) - o.y);
      s += Math.max(0, 12 - d);
    }
    // 强烈偏好「贴着软块」的前沿格 —— 只有站在那儿放弹才能炸开新区域。
    // 没有这一条，机器人会在已经清空的地图里空转，一整局放不了几颗炸弹。
    const cx2 = c % COLS, cy2 = (c / COLS) | 0;
    let frontier = 0;
    for (let d = 0; d < 4; d++) {
      const x = cx2 + DIRV[d][0], y = cy2 + DIRV[d][1];
      if (inB(x,y) && ARENA.tiles[idx(x,y)] === T.SOFT) frontier++;
    }
    s += frontier * 30;
    if (dist >= 1.2 && dist <= 9 && s > bestScore) { bestScore = s; best = { cell: c, dist }; }
    if (s > fbScore) { fbScore = s; fb = { cell: c, dist }; }
  }
  return best || fb;      // 距离窗口内没有就往最远的可达安全格走
};

/* --- 大脑主循环 --- */
const PLAN = { IDLE:'idle', ESCAPE:'escape', BUY:'buy', DROP:'drop',
               ITEM:'item', HUNT:'hunt', ROAM:'roam', HOLD:'hold' };

/* 难度 → 三个机器人各自的档位。队内保留梯度，打起来才不是一个模子。 */
const DIFF_TIERS = {
  easy:   ['rookie',   'rookie',   'rookie'  ],
  normal: ['rookie',   'standard', 'standard'],
  hard:   ['standard', 'ace',      'ace'     ],
};
const TIER_DOWN = { ace:'standard', standard:'rookie', rookie:'rookie' };

AI.initBot = function (e, pi) {
  const tiers = DIFF_TIERS[GAME.difficulty] || DIFF_TIERS.normal;
  let tier = tiers[pi - 2] || 'standard';
  // 团队模式是 3 打 2，整体降一级做人数补偿
  if (GAME.mode === 'team') tier = TIER_DOWN[tier];
  const profile = Object.assign({}, PROFILES[tier]);
  if (GAME.mode === 'team') profile.reactionDelay += 80;      // 再给人类让一手
  e.ai = {
    profile,
    persona: PERSONAS[PERSONA_KEYS[(pi - 2) % 3]],
    thinkAt: GAME.now + (pi - 2) * 70,                        // 三个机器人错开，帧时间才平稳
    opSeen: Object.create(null),
    holdSince: 0,
    path: null, pi: 0,
    wantBomb: false,
    bombCooldownUntil: 0,
    lastPlan: PLAN.IDLE,
    _px: e.x, _py: e.y, _wantAxis: null,   // 卡墙检测用
    commit: null,                          // 目标承诺 { cell, until }
  };
};

AI.setPath = function (bot, cells) {
  if (!cells || cells.length === 0) { bot.ai.path = null; return; }
  bot.ai.path = cells.slice();
  bot.ai.pi = 0;
};

AI.botThink = function (bot) {
  const ai = bot.ai;
  if (!bot.alive) { ai.path = null; return; }
  if (bot.stunnedUntil > GAME.now) { ai.path = null; return; }

  const bcx = Math.floor(bot.x), bcy = Math.floor(bot.y);
  const mi = idx(bcx, bcy);

  // ── (1) 脚下将炸：唯一目标是活命，无条件抢占 ──
  if (AI.realDanger[mi] - GAME.now < AI.PANIC) {
    if (AI.planEscape(bcx, bcy, Math.max(1.2, ENT.speedOf(bot) || 2.4), bot.dir)) {
      ai.lastPlan = PLAN.ESCAPE; AI.setPath(bot, AI.esc); return;
    }
    AI.planBuyTime(bot);
    ai.lastPlan = PLAN.BUY; AI.setPath(bot, AI.esc); return;
  }

  // ── (2) 常态：生成候选并打分 ──
  const pr = ai.profile;
  const cands = [];
  const speed = Math.max(1.2, ENT.speedOf(bot) || 2.4);

  const dropV = AI.evaluateBombDrop(bot, bcx, bcy);
  if (dropV !== null && dropV > 0) cands.push({ k:PLAN.DROP, v:dropV, tag:'self' });

  const item = AI.pickItem(bot);
  if (item) cands.push({ k:PLAN.ITEM, v:item.score, tag:'i'+item.cell, cell:item.cell });

  const hunt = AI.pickHuntTarget(bot);
  if (hunt) cands.push({ k:PLAN.HUNT, v:hunt.score, tag:'e'+hunt.enemy.id, cell:hunt.cell });

  const roam = AI.pickRoamCell(bot);
  let roamCell = roam ? roam.cell : -1;
  // ── 目标承诺 ──
  // 决策周期只有 90~220ms，可走完一段路要好几秒。每次都重新挑目标的话，
  // 机器人会走两步掉一次头 —— 玩家看到的就是「原地上下乱动」。
  // 所以：还在赶路就继续赶，只在目标作废或明显有更好的选择时才换。
  if (ai.commit && GAME.now < ai.commit.until) {
    const c = ai.commit.cell;
    if (c !== idx(bcx, bcy) && isFinite(AI.arrival[c]) && AI.realDanger[c] === Infinity) {
      roamCell = c;                                    // 沿用承诺目标
    } else {
      ai.commit = null;                                // 目标没了或被点着了
    }
  }
  if (roamCell >= 0) {
    const held = ai.commit && ai.commit.cell === roamCell;
    // 承诺目标给足权重，压过中途冒出来的小机会；但真有近在眼前的好东西还是会去拿
    cands.push({ k:PLAN.ROAM, v: 9 * pr.roam + (held ? 28 : 0), tag:'r'+roamCell, cell: roamCell });
  }

  // 走到这里说明脚下不危险。没有候选就原地待命，等下一个决策周期重算。
  // 注意不能在这里退回 planEscape —— 那会让「已经安全」的机器人往最近的
  // 安全格挪一步，而在安全区里最近的安全格永远是邻居，结果就是在两格间反复横跳。
  if (cands.length === 0) { ai.lastPlan = PLAN.IDLE; ai.path = null; return; }

  let best = cands[0];
  for (let i = 1; i < cands.length; i++) if (cands[i].v > best.v) best = cands[i];

  // 换了目标就重新承诺，给下一个决策周期用
  if (best.cell != null) {
    if (!ai.commit || ai.commit.cell !== best.cell) {
      ai.commit = { cell: best.cell, until: GAME.now + 2400 };
    }
  }

  // ── (3) 反应延迟：只约束「进攻性」决策 ──
  //      没有这一层，机器人会在人类放弹的同一帧就判定「这人跑不掉」并立即投放，
  //      玩家会觉得被读心。这是「好玩」与「被虐」的分界线。
  //
  //      但它绝不能管走路和捡道具：那些候选的 tag 里带着目标格编号，
  //      而目标格每次重算都在变，机会就永远「持续不了」，机器人会一直卡在
  //      HOLD 状态原地不动（实测踩过这个坑，机器人能站满 117 秒）。
  if (best.k === PLAN.DROP || best.k === PLAN.HUNT) {
    const seen = ai.opSeen[best.tag];
    let hold = false;
    if (seen === undefined) { ai.opSeen[best.tag] = GAME.now; ai.holdSince = GAME.now; hold = true; }
    else if (GAME.now - seen < pr.reactionDelay) hold = true;
    else if (GAME.now - ai.holdSince > 1600) { ai.opSeen = Object.create(null); ai.holdSince = GAME.now; }

    if (hold) {
      ai.lastPlan = PLAN.HOLD;
      // 等待期间不能杵着不动，但更不能每次重新挑目标 —— 那正是「原地乱动」的来源。
      // 优先沿用已有承诺；实在没有才新选一个，并且选完立刻承诺下来。
      if (!ai.path) {
        let cell = -1;
        if (ai.commit && GAME.now < ai.commit.until) {
          AI.field(bcx, bcy, speed, 'reach', bot.dir);
          if (isFinite(AI.arrival[ai.commit.cell])) cell = ai.commit.cell;
        }
        if (cell < 0) {
          const r2 = AI.pickRoamCell(bot);
          if (r2) { cell = r2.cell; ai.commit = { cell, until: GAME.now + 2400 }; }
        }
        if (cell >= 0) { AI.pathTo(cell); AI.setPath(bot, AI.esc); }
      }
      return;
    }
  }

  // ── (4) 失误率：按概率降级为次优选项 ──
  if (Math.random() < pr.mistakeChance && cands.length > 1) {
    let alt = null;
    for (const c of cands) if (c !== best && (!alt || c.v > alt.v)) alt = c;
    if (alt) best = alt;
  }

  ai.lastPlan = best.k;
  if (best.k === PLAN.DROP) {
    ai.wantBomb = true;
    // 放完立刻重算一次逃逸，避免站着等
    if (AI.planEscape(bcx, bcy, speed, bot.dir)) AI.setPath(bot, AI.esc); else ai.path = null;
    ai.opSeen = Object.create(null);
    return;
  }
  if (best.cell != null) {
    const g = AI.field(bcx, bcy, speed, 'reach', bot.dir);
    if (isFinite(AI.arrival[best.cell])) { AI.pathTo(best.cell); AI.setPath(bot, AI.esc); }
    else ai.path = null;
  } else {
    ai.path = null;
  }
};

/** 兜底转向：没有可用路径时，朝「危险最晚到来」的相邻格挪一步。
    这是最后一道防线 —— 只要它还在，机器人就永远不会呆立不动，
    哪怕寻路因为任何原因返回了空路径。 */
AI.greedyMove = function (bot, v) {
  const bx = Math.floor(bot.x), by = Math.floor(bot.y);
  const cur = idx(bx, by);
  const D = AI.realDanger;
  const here = D[cur] === Infinity ? 1e9 : D[cur] - GAME.now;

  let bestDir = -1, bestKey = -Infinity;
  for (let d = 0; d < 4; d++) {
    const x = bx + DIRV[d][0], y = by + DIRV[d][1];
    if (!AI.walkable(x, y, cur)) continue;
    const i = idx(x, y);
    const key = D[i] === Infinity ? 1e9 : D[i] - GAME.now;
    if (key > bestKey) { bestKey = key; bestDir = d; }
  }
  if (bestDir < 0) return false;
  // 脚下本来就够安全、旁边还不如这儿，那就别乱晃（交给决策层安排正事）
  if (bestKey <= here && here > 2500) return false;

  if (bestDir === 0) v.up = 1;
  else if (bestDir === 1) v.right = 1;
  else if (bestDir === 2) v.down = 1;
  else v.left = 1;
  return true;
};

/** 执行层：把 plan 变成虚拟输入 */
AI.botAct = function (bot, pi) {
  const v = AI._v;
  v.up = 0; v.down = 0; v.left = 0; v.right = 0; v.bomb = 0;
  if (!bot.alive || bot.stunnedUntil > GAME.now) { Input.setVirtual(pi, v); return; }

  const ai = bot.ai;

  // 顺路把炸弹放了
  if (ai.wantBomb && GAME.now >= ai.bombCooldownUntil) {
    v.bomb = 1;
    ai.wantBomb = false;
    ai.bombCooldownUntil = GAME.now + 260;
    Input.setVirtual(pi, v);
    return;
  }
  ai.wantBomb = false;

  // 沿路径走。path[0] 是起点格，ai.pi 表示「正在前往的路点下标」。
  const path = ai.path;
  let steering = false;
  if (path && path.length > 1) {
    const cur = idx(Math.floor(bot.x), Math.floor(bot.y));
    while (ai.pi < path.length && path[ai.pi] === cur) ai.pi++;   // 踩到路点就推进
    if (ai.pi >= path.length) {
      ai.path = null;
    } else {
      const target = path[ai.pi];
      const tx = (target % COLS) + 0.5;
      const ty = ((target / COLS) | 0) + 0.5;
      const dx = tx - bot.x, dy = ty - bot.y;

      // 只走偏差大的那个轴 —— 和人类按键的方式一致，物理路径完全相同。
      // 但如果上一帧想走的那个轴一动没动（顶着墙或没对齐），这一帧先走另一个轴
      // 把身位对齐，否则会贴着墙角干等到下一次决策，看起来像卡死。
      const EPS = 0.03;
      const stalledX = ai._wantAxis === 'x' && Math.abs(bot.x - ai._px) < 1e-4;
      const stalledY = ai._wantAxis === 'y' && Math.abs(bot.y - ai._py) < 1e-4;

      // 轴向迟滞：上一个轴只要还有得走、也没被挡住，就继续用它。
      // 每帧重挑「哪个轴偏差大」会导致角色一帧向右、一帧向下地抽搐 ——
      // 实测这是「原地上下乱动」的主要来源（y 坐标呈锯齿状爬行）。
      let useX;
      if (ai._wantAxis === 'x' && Math.abs(dx) > EPS && !stalledX) useX = true;
      else if (ai._wantAxis === 'y' && Math.abs(dy) > EPS && !stalledY) useX = false;
      else useX = Math.abs(dx) > Math.abs(dy);
      ai._wantAxis = useX ? 'x' : 'y';

      // 主轴走不了就走副轴，务必留在路径上，不要落到 greedy 兜底去
      const goX = () => {
        if (dx > EPS) { v.right = 1; return true; }
        if (dx < -EPS) { v.left = 1; return true; }
        return false;
      };
      const goY = () => {
        if (dy > EPS) { v.down = 1; return true; }
        if (dy < -EPS) { v.up = 1; return true; }
        return false;
      };
      steering = useX ? (goX() || goY()) : (goY() || goX());
    }
  }
  ai._px = bot.x; ai._py = bot.y;
  // 兜底只在「手上确实没有路径」时启用。
  // 有路径还调 greedy 会把刚走上的路又拐回去，这是抖动的另一个来源。
  if (!steering && !ai.path) AI.greedyMove(bot, v);
  Input.setVirtual(pi, v);
};

AI.update = function (dt) {
  AI.updateDanger();
  for (let i = 0; i < ENT.list.length; i++) {
    const e = ENT.list[i];
    if (!e.isBot) continue;
    if (!e.ai) AI.initBot(e, i);
    if (!e.alive) { Input.setVirtual(i, AI._z); continue; }
    if (GAME.now >= e.ai.thinkAt) {
      AI.botThink(e);
      e.ai.thinkAt = GAME.now + e.ai.profile.thinkInterval;
    }
    AI.botAct(e, i);
  }
};

/* ===== §12 TEAM ============================================================
   3 打 2 的补偿与协同 */
const TEAM = {
  bb: {
    focusEnemyId: -1,
    focusUntil: 0,
    claims: new Map(),        // enemyId -> Set(botId)
    axis: new Map(),          // botId -> 'h' | 'v'
  },
  nextUpdate: 0,
};

TEAM.focusBonus = function (bot, enemy) {
  const bb = TEAM.bb;
  if (GAME.now > bb.focusUntil || bb.focusEnemyId !== enemy.id) return -18;
  let set = bb.claims.get(enemy.id);
  if (!set) { set = new Set(); bb.claims.set(enemy.id, set); }
  if (set.has(bot.id)) return 45;
  if (set.size >= 2) return 0;            // 最多 2 人追同一个，第 3 个别去挤
  set.add(bot.id);
  return 45;
};

TEAM.pickFocus = function () {
  const bb = TEAM.bb;
  let best = null, bestScore = -1e9;
  for (const e of ENT.list) {
    if (!e.alive || e.team === 0) continue;      // 目标是人类队
    let s = 0;
    s += (CFG.INITIAL_LIVES - e.lives) * 25;     // 残血优先
    s += e.stunnedUntil > GAME.now ? 70 : 0;     // 眩晕 = 立刻集火
    s += 20;                                     // 优先打人类，制造戏剧性
    s += e.score * 0.02;                         // 高分玩家被针对
    let near = 0, cnt = 0;
    for (const b of ENT.list) {
      if (!b.isBot || !b.alive) continue;
      near += Math.abs(b.x - e.x) + Math.abs(b.y - e.y); cnt++;
    }
    if (cnt) s -= (near / cnt) * 3;
    if (s > bestScore) { bestScore = s; best = e; }
  }
  bb.focusEnemyId = best ? best.id : -1;
  bb.focusUntil = GAME.now + 4000;
  bb.claims.clear();
  bb.axis.clear();
};

TEAM.update = function () {
  if (GAME.now >= TEAM.nextUpdate) {
    TEAM.nextUpdate = GAME.now + 250;
    TEAM.pickFocus();
  }
};

/* ===== §13 HUD =============================================================
   画在 canvas 上，避免每帧改 DOM */
const HUD = {};

HUD.draw = function (ctx) {
  ctx.save();
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, BOARD_W, BOARD_Y);

  // 左上：计时（倒计时阶段不扣匹配时间）
  const left = Math.max(0, GAME.matchEnd - Math.max(GAME.now, CFG.COUNTDOWN));
  const sec = Math.ceil(left/1000);
  const mm = String(Math.floor(sec/60)).padStart(2,'0');
  const ss = String(sec%60).padStart(2,'0');
  ctx.fillStyle = sec <= 15 ? '#ff5c5c' : '#e6edf3';
  ctx.font = 'bold 28px "PingFang SC",system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(mm + ':' + ss, 14, 30);

  ctx.fillStyle = '#8b949e';
  ctx.font = '12px "PingFang SC",system-ui,sans-serif';
  ctx.fillText(GAME.modeName, 14, 58);
  if (GAME.mode === 'team') {
    ctx.fillStyle = '#5ac8fa';
    ctx.fillText('机器人队生命池 ' + Math.max(0, GAME.teamPool[1]) + ' / 6', 14, 78);
  } else {
    ctx.fillText('F1 调试视图 · M 静音', 14, 78);
  }

  // 右侧：5 张玩家卡
  const cardW = 118, cardH = 62, gap = 6;
  const totalW = cardW*5 + gap*4;
  let x = BOARD_W - totalW - 14;
  for (const e of ENT.list) {
    const y = 14;
    ctx.fillStyle = e.alive ? 'rgba(255,255,255,.06)' : 'rgba(255,255,255,.02)';
    roundRect(ctx, x, y, cardW, cardH, 7); ctx.fill();
    ctx.strokeStyle = e.alive ? e.color : '#333';
    ctx.lineWidth = e.id === 1 || e.id === 2 ? 2 : 1;
    roundRect(ctx, x, y, cardW, cardH, 7); ctx.stroke();

    // 头像块
    ctx.fillStyle = e.alive ? e.color : '#444';
    roundRect(ctx, x+7, y+8, 20, 20, 5); ctx.fill();

    ctx.fillStyle = e.alive ? '#e6edf3' : '#666';
    ctx.font = 'bold 12px "PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(e.name, x+34, y+18);

    ctx.font = '11px "PingFang SC",system-ui,sans-serif';
    ctx.fillStyle = '#8b949e';
    ctx.fillText('分 ' + e.score, x+34, y+34);
    ctx.fillText('杀 ' + e.kills, x+34, y+50);

    // 生命点（团队模式下机器人共用生命池，不单独显示）
    ctx.textAlign = 'right';
    if (!(GAME.mode === 'team' && e.isBot)) {
      for (let k = 0; k < Math.min(e.lives, 5); k++) {
        ctx.fillStyle = '#ff5c8a';
        ctx.beginPath(); ctx.arc(x+cardW-10-k*11, y+14, 4, 0, 6.283); ctx.fill();
      }
    }
    // 状态图标
    let sx = x + cardW - 10;
    ctx.textAlign = 'center';
    const badges = [];
    if (e.shield) badges.push('盾');
    if (GAME.now < e.invulnUntil) badges.push('无');
    if (e.vehicle) badges.push('骑');
    if (e.weapon) badges.push('枪');
    if (e.hasPush) badges.push('踢');
    ctx.font = '10px "PingFang SC",system-ui,sans-serif';
    for (const b of badges) {
      ctx.fillStyle = '#63f600';
      ctx.beginPath(); ctx.arc(sx-6, y+48, 7, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#0d1117';
      ctx.fillText(b, sx-6, y+49);
      sx -= 18;
      if (sx < x + 6) break;
    }
    x += cardW + gap;
  }
  ctx.restore();
};

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

/* ===== §14 SCREENS =========================================================
   DOM 覆盖层：菜单 / 暂停 / 结算 */
const SCREEN = {
  el: {
    menu: document.getElementById('ovMenu'),

    result: document.getElementById('ovResult'),
  },

const DIFF_LABEL = { easy:'简单', normal:'普通', hard:'困难' };

SCREEN.renderMenu = function () {
  const md = GAME.pendingMode, df = GAME.pendingDiff;
