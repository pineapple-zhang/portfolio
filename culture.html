<!-- ⚠️ 必须在样式表之前把 .js 挂上，不能等到 body 末尾的 site.js。
     首屏入场的初始态（opacity:0）只写在 `.js` 选择器下面 ——
     .js 挂晚了的话，浏览器已经按「全可见」画过一帧，
     挂上 .js 时元素是从 1 变成 0（还带着 110ms 的 transition-delay），
     紧接着两个 rAF 后又加 is-in 把它拉回 1，
     这次过渡是 1→1，**入场动画直接看不出来**（刷新时偶发，取决于谁先到）。
     标题的单字没有这个问题 —— 它们是 JS 之后才创建的，首个计算值就是 0。 -->
<script>document.documentElement.classList.remove('no-js');
document.documentElement.classList.add('js');
/* 兜底：site.js 万一没跑起来（文件缺失、被杀软拦、路径写错），
   就把 .js 撤掉。否则所有 .reveal 元素会永远停在 opacity:0 —— 整页白屏。
   site.js 一旦执行就会置上 window.__siteReady，这个定时器就什么都不做。 */
setTimeout(function () {
  if (!window.__siteReady) document.documentElement.classList.remove('js');
}, 4000);</script>
